<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="ttl desc"><title id="ttl">Executive roadmap milestone preview</title><desc id="desc">Visual preview based on the interactive roadmap showing its four real proposed milestones and two candidate bets.</desc><rect width="1200" height="720" fill="#fff"/><text x="30" y="40" fill="#2d5f9e" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="1.1" text-anchor="start">THE EXECUTIVE VIEW</text><text x="30" y="92" fill="#162746" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">What to pursue, in what order and why.</text><text x="30" y="124" fill="#677b98" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Choose a milestone; open a bet to inspect its struggle, response, trade-offs and evidence.</text><rect x="24" y="159" width="283" height="220" rx="13" fill="#fff" stroke="#b5cbe8" stroke-width="2"/><rect x="38" y="174" width="36" height="36" rx="18" fill="#285ddd" stroke="none" stroke-width="1"/><text x="56" y="200" fill="#fff" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="middle">1</text><text x="84" y="191" fill="#172643" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Realize &amp; Verify</text><text x="84" y="213" fill="#172643" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Membership Value</text><text x="39" y="247" fill="#65748b" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Make promised value usable</text><text x="39" y="267" fill="#65748b" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">and reliably delivered.</text><rect x="39" y="292" width="109" height="27" rx="13" fill="#f5f8fc" stroke="#e1e6f0" stroke-width="1"/><text x="50" y="310" fill="#405372" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">2 candidates</text><rect x="39" y="328" width="184" height="27" rx="13" fill="#f5f8fc" stroke="#e1e6f0" stroke-width="1"/><text x="50" y="346" fill="#405372" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">9 person-wks draft</text><rect x="319" y="159" width="283" height="220" rx="13" fill="#fff" stroke="#d9e2ef" stroke-width="1"/><rect x="333" y="174" width="36" height="36" rx="18" fill="#7854e1" stroke="none" stroke-width="1"/><text x="351" y="200" fill="#fff" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="middle">2</text><text x="379" y="191" fill="#172643" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Make Better,</text><text x="379" y="213" fill="#172643" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Verifiable Choices</text><text x="334" y="247" fill="#65748b" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Use Membership only when</text><text x="334" y="267" fill="#65748b" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">it changes a real decision.</text><rect x="334" y="292" width="109" height="27" rx="13" fill="#f5f8fc" stroke="#e1e6f0" stroke-width="1"/><text x="345" y="310" fill="#405372" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">2 tests</text><rect x="334" y="328" width="184" height="27" rx="13" fill="#f5f8fc" stroke="#e1e6f0" stroke-width="1"/><text x="345" y="346" fill="#405372" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">30 person-wks draft</text><rect x="614" y="159" width="283" height="220" rx="13" fill="#fff" stroke="#d9e2ef" stroke-width="1"/><rect x="628" y="174" width="36" height="36" rx="18" fill="#19927c" stroke="none" stroke-width="1"/><text x="646" y="200" fill="#fff" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="middle">3</text><text x="674" y="191" fill="#172643" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Resolve &amp; Recover</text><text x="674" y="213" fill="#172643" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Outcomes</text><text x="629" y="247" fill="#65748b" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Move to bounded,</text><text x="629" y="267" fill="#65748b" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">reversible help.</text><rect x="629" y="292" width="109" height="27" rx="13" fill="#f5f8fc" stroke="#e1e6f0" stroke-width="1"/><text x="640" y="310" fill="#405372" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">1 test · 2 hold</text><rect x="629" y="328" width="184" height="27" rx="13" fill="#f5f8fc" stroke="#e1e6f0" stroke-width="1"/><text x="640" y="346" fill="#405372" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">12 person-wks draft</text><rect x="909" y="159" width="283" height="220" rx="13" fill="#fff" stroke="#d9e2ef" stroke-width="1"/><rect x="923" y="174" width="36" height="36" rx="18" fill="#c58b00" stroke="none" stroke-width="1"/><text x="941" y="200" fill="#fff" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="middle">4</text><text x="969" y="191" fill="#172643" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Expand Proven</text><text x="969" y="213" fill="#172643" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Patterns</text><text x="924" y="247" fill="#65748b" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Enter new experiences</text><text x="924" y="267" fill="#65748b" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">when struggles are evidenced.</text><rect x="924" y="292" width="109" height="27" rx="13" fill="#f5f8fc" stroke="#e1e6f0" stroke-width="1"/><text x="935" y="310" fill="#405372" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">1 hold</text><rect x="924" y="328" width="184" height="27" rx="13" fill="#f5f8fc" stroke="#e1e6f0" stroke-width="1"/><text x="935" y="346" fill="#405372" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Appetite unassigned</text><rect x="24" y="402" width="218" height="42" rx="8" fill="#fff" stroke="#d7e2f0" stroke-width="1"/><text x="38" y="428" fill="#172643" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Expand current milestone</text><rect x="256" y="402" width="172" height="42" rx="8" fill="#fff" stroke="#d7e2f0" stroke-width="1"/><text x="271" y="428" fill="#172643" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Show all milestones</text><text x="1173" y="429" fill="#77849a" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="end">4 milestones · 51 illustrative person-wks</text><rect x="24" y="470" width="1152" height="226" rx="16" fill="#fff" stroke="#dce4ee" stroke-width="1"/><rect x="24" y="470" width="1152" height="67" rx="0" fill="#fbfdff" stroke="none" stroke-width="1"/><text x="43" y="501" fill="#285ddd" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">01</text><text x="86" y="501" fill="#172643" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Milestone 1 · Realize &amp; Verify Membership Value</text><text x="86" y="524" fill="#63738d" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Start with current benefits, not new autonomy.</text><rect x="42" y="551" width="548" height="126" rx="11" fill="#fff" stroke="#dce5ef" stroke-width="1"/><text x="60" y="582" fill="#172643" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">1.1 · Automatic Offers</text><text x="60" y="605" fill="#667793" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Purchase decision · in-context value</text><rect x="60" y="620" width="134" height="29" rx="15" fill="#ecf4ff" stroke="#d4e5f8" stroke-width="1"/><text x="73" y="640" fill="#2865a0" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">TEST · evidence bet</text><rect x="211" y="620" width="352" height="29" rx="6" fill="#f0f5fc" stroke="none" stroke-width="1"/><text x="226" y="639" fill="#245dc6" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Show Frame + Candidate Shape</text><rect x="609" y="551" width="548" height="126" rx="11" fill="#fff" stroke="#dce5ef" stroke-width="1"/><text x="627" y="582" fill="#172643" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">1.2 · Benefit Outcome Assurance</text><text x="627" y="605" fill="#667793" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">After purchase · credits, benefits, exceptions</text><rect x="627" y="620" width="134" height="29" rx="15" fill="#ecf4ff" stroke="#d4e5f8" stroke-width="1"/><text x="640" y="640" fill="#2865a0" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">TEST · evidence bet</text><rect x="778" y="620" width="352" height="29" rx="6" fill="#f0f5fc" stroke="none" stroke-width="1"/><text x="793" y="639" fill="#245dc6" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="0" text-anchor="start">Show Frame + Candidate Shape</text></svg>