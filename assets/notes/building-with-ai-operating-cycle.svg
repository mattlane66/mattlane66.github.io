<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 850" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">The operating cycle for building software with AI</title>
<desc id="diagram-desc">Choose what matters, describe the result, let AI build, verify what happened, interpret what it means, and steer the next decision. Then repeat.</desc>
<defs>
  <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#173dff" opacity=".08"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#173dff" stroke-width="1.6"/></marker>
</defs>
<rect width="760" height="850" rx="20" fill="#fffefa"/>
<rect x="1" y="1" width="758" height="848" rx="19" fill="none" stroke="#ccc9bd" stroke-width="2"/>
<rect x="22" y="20" width="716" height="810" rx="12" fill="url(#dots)"/>
<text x="49" y="66" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3.0" fill="#63625c">THE OPERATING CYCLE</text>
<text x="49" y="105" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="750" fill="#10100f">Five human skills. One AI build step.</text>
<!-- loopback connector -->
<path d="M660 734 H691 Q710 734 710 714 V177 Q710 159 693 159 H658" fill="none" stroke="#173dff" stroke-width="2.6" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
<text x="720" y="445" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#173dff" transform="rotate(90 720 445)" letter-spacing="1.5">REPEAT</text>
<!-- vertical primary path -->
<path d="M83 206 V233 M83 306 V333 M83 406 V433 M83 506 V533 M83 606 V633" stroke="#173dff" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<!-- five human cards + one AI card -->
<g font-family="Helvetica,Arial,sans-serif">
<rect x="49" y="135" width="611" height="72" rx="8" fill="#fff" stroke="#10100f" stroke-width="1.6"/>
<rect x="49" y="135" width="8" height="72" fill="#173dff"/>
<text x="74" y="166" font-size="17" font-weight="800" fill="#173dff">01</text><text x="119" y="169" font-size="28" font-weight="800" fill="#10100f">CHOOSE</text>
<text x="119" y="190" font-size="19" fill="#5d5b55">What matters most?</text>

<rect x="49" y="235" width="611" height="72" rx="8" fill="#fff" stroke="#10100f" stroke-width="1.6"/>
<rect x="49" y="235" width="8" height="72" fill="#173dff"/>
<text x="74" y="266" font-size="17" font-weight="800" fill="#173dff">02</text><text x="119" y="269" font-size="28" font-weight="800" fill="#10100f">DESCRIBE</text>
<text x="119" y="290" font-size="19" fill="#5d5b55">What do we want to exist?</text>

<rect x="49" y="335" width="611" height="72" rx="8" fill="#d9ff57" stroke="#10100f" stroke-width="1.6"/>
<rect x="49" y="335" width="8" height="72" fill="#10100f"/>
<text x="74" y="366" font-size="17" font-weight="800" fill="#10100f">AI</text><text x="119" y="369" font-size="28" font-weight="800" fill="#10100f">BUILD</text>
<text x="119" y="390" font-size="19" fill="#33372a">The agent implements an agreed piece.</text>

<rect x="49" y="435" width="611" height="72" rx="8" fill="#fff" stroke="#10100f" stroke-width="1.6"/>
<rect x="49" y="435" width="8" height="72" fill="#173dff"/>
<text x="74" y="466" font-size="17" font-weight="800" fill="#173dff">03</text><text x="119" y="469" font-size="28" font-weight="800" fill="#10100f">VERIFY</text>
<text x="119" y="490" font-size="19" fill="#5d5b55">What actually happened?</text>

<rect x="49" y="535" width="611" height="72" rx="8" fill="#fff" stroke="#10100f" stroke-width="1.6"/>
<rect x="49" y="535" width="8" height="72" fill="#173dff"/>
<text x="74" y="566" font-size="17" font-weight="800" fill="#173dff">04</text><text x="119" y="569" font-size="28" font-weight="800" fill="#10100f">INTERPRET</text>
<text x="119" y="590" font-size="19" fill="#5d5b55">What does the result mean?</text>

<rect x="49" y="635" width="611" height="99" rx="8" fill="#173dff" stroke="#173dff" stroke-width="1.6"/>
<text x="74" y="672" font-size="17" font-weight="800" fill="#d9ff57">05</text><text x="119" y="677" font-size="28" font-weight="800" fill="#fffefa">STEER</text>
<text x="119" y="708" font-size="20" fill="#fffefa">Continue · Refine · Realign · Stop</text>
</g>
<line x1="49" y1="779" x2="660" y2="779" stroke="#cfccc1"/>
<text x="49" y="808" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#63625c">Keep work reversible. Intervene when the agent gets stuck.</text>
</svg>