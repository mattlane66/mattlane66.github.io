<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1672 941" role="img" aria-labelledby="trace-title trace-desc">
<title id="trace-title">TRACE: a method for finding poor fit in real use</title>
<desc id="trace-desc">Start with a real use case. Write the full sequence of observed steps; mark difficulties and workarounds without discarding the other steps; then select consequential problems for further investigation. The highlighted items are hypotheses, not predetermined solutions. Blue dots and lines represent recorded steps; red asterisks and lines indicate observed trouble spots, and the final red card isolates a smaller set for investigation.</desc>

