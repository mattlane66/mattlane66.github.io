<svg shape-rendering="geometricPrecision" focusable="false" class="note-diagram" aria-roledescription="diagram" xmlns="http://www.w3.org/2000/svg" width="760" height="544" viewBox="0 0 760 544" role="img" aria-labelledby="title desc"><title id="title">Four relationships between opportunities and problems</title><desc id="desc">Comparability: three sibling opportunities under one parent, compare. Linkage: two problems under a shared parent, group. Shared solution: two opportunities converge on one solution, reuse. Coupled bet: four interdependent pieces linked to one another, coordinate. No relationship is highlighted as a warning.</desc><g transform="translate(12 12)"><rect x="0.75" y="0.75" width="358.5" height="254.5" rx="12" fill="#fdf6e3" stroke="#cfc8b7" stroke-width="1.5"/><text x="22" y="43" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="25" letter-spacing="-0.7" fill="#16161d">Comparability</text><path d="M180 105 V133 M115 133 H245 M115 133 V156 M180 133 V156 M245 133 V156" fill="none" stroke="#666861" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="165" y="77" width="30" height="28" rx="5" fill="#81a879" stroke="#52734e" stroke-width="1.5"/><rect x="100" y="156" width="30" height="28" rx="5" fill="#81a879" stroke="#52734e" stroke-width="1.5"/><rect x="165" y="156" width="30" height="28" rx="5" fill="#81a879" stroke="#52734e" stroke-width="1.5"/><rect x="230" y="156" width="30" height="28" rx="5" fill="#81a879" stroke="#52734e" stroke-width="1.5"/><path d="M22 211 H338" stroke="#cfc8b7"/><text x="22" y="236" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650" fill="#586e75">COMPARE</text></g><g transform="translate(388 12)"><rect x="0.75" y="0.75" width="358.5" height="254.5" rx="12" fill="#fdf6e3" stroke="#cfc8b7" stroke-width="1.5"/><text x="22" y="43" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="25" letter-spacing="-0.7" fill="#16161d">Linkage</text><path d="M180 10