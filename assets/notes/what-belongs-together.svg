="77" width="30" height="28" rx="5" fill="#81a879" stroke="#52734e" stroke-width="1.5"/><rect x="222" y="77" width="30" height="28" rx="5" fill="#81a879" stroke="#52734e" stroke-width="1.5"/><rect x="108" y="156" width="30" height="28" rx="5" fill="#e7b454" stroke="#b98934" stroke-width="1.5"/><rect x="222" y="156" width="30" height="28" rx="5" fill="#e7b454" stroke="#b98934" stroke-width="1.5"/><path d="M22 211 H338" stroke="#cfc8b7"/><text x="22" y="236" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650" fill="#586e75">COORDINATE</text></g></svg>
