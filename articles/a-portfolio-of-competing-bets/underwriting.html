</style></head><body><header class="top"><a href="https://mattlane66.github.io/">Matt Lane</a><a href="./">Article ↗</a></header><main class="wrap"><div class="ey">Companion tool</div><h1>The next dollar</h1><p class="dek">Compare two competing hypotheses, the conditions they share, and the ownership you give up.</p><p><a href="index.html">← Back to the article</a></p><figure class="bets" data-bets="workspace"><div class="frame"><div class="fallback"><h4>Workspace · static summary</h4><p>Compare the mechanisms, evidence, deal economics and capital commitments for DoorDash/Toast and Bird/Lime. JavaScript is required for interactive calculations.</p><p>Historical evidence: <a href="https://www.sec.gov/Archives/edgar/data/1792789/000162828022004350/dash-20211231.htm">DoorDash FY2021</a> · <a href="https://www.sec.gov/Archives/edgar/data/1650164/000165016422000009/tost-20211231.htm">Toast FY2021</a> · <a href="https://www.sec.gov/Archives/edgar/data/1861449/000186144922000034/brds2021earningsrelease.htm">Bird FY2021</a> · <a href="https://stpaul.legistar.com/LegislationDetail.aspx?FullText=1&GUID=6883BEBB-6364-4DA2-BE19-42322505DF88&ID=4890841&Options=&Search=">Saint Paul 2021</a>.</p></div><div class="bets-content"></div></div></figure></main><script>

, "https://www.prnewswire.com/news-releases/bird-enters-into-comprehensive-restructuring-support-agreement-with-first--and-second-lien-lenders-to-strengthen-financial-position-302019823.html", "Voluntary Chapter 11 proceeding."]}, "cases": [{"id": "restaurants", "label": "Restaurant commerce", "names": ["DoorDash", "Toast"], "colors": ["#a14535", "#176a66"], "thesis": "Restaurants increasingly transact through digital infrastructure.", "headline": "Different ways to capture the same market", "roles": ["Consumer demand and fulfilment", "Merchant operations and payments"], "facts": ["2021: $41.9bn marketplace gross order value (GOV).", "2021: approximately 57,000 locations; over $57bn gross payment volume."], "refs": [["D1"], ["T1"]], "factors": [["Consumer discovery", "Help diners discover restaurants and create incremental demand.", 5, 2, ["D1", "T1"]], ["Digital ordering", "Enable orders to be placed digitally.", 5, 4, ["D1", "T1", "T2"]], ["Last-mile fulfilment", "Arrange delivery to the consumer.", 5, 3, ["D1", "T2"]], ["Point of sale", "Operate the merchant transaction system.", 1, 5, ["D1", "T1"]], ["Merchant workflow", "Manage restaurant operations and related workflows.", 2, 5, ["D1", "T1"]], ["Payment services", "Provide merchant payment processing as a product.", 1, 5, ["D1", "T1"]], ["Channel integration", "Connect orders from multiple channels to merchant systems.", 3, 5, ["D1", "T2"]]], "deps": [["Restaurant spending", "System", 2, 2, "Restaurant activity supports order demand.", "Merchant sales drive payment volume and customer viability.", ["D1", "T1"], "Track restaurant sales and closures; distinguish total spending from channel shift."], ["Digital adoption", "System", 2, 2, "Consumers and merchants must use digital ordering.", "Restaurants must use integrated digital tools and payment processing.", ["D1", "T1"], "Observe repeat digital usage, not one-time onboarding."], ["Viable delivery economics", "Business model", 2, 1, "Delivery revenue must cover fulfilment and support costs.", "Delivery integrations benefit merchants, but POS and in-person payments are alternatives.", ["D1", "T1", "T2"], "Measure contribution per order after incentives and variable costs."], ["Marketplace liquidity", "Business model", 2, 0, "Consumers, merchants and couriers must match at acceptable service levels.", "Toast need not operate a consumer delivery marketplace to sell POS.", ["D1", "T1"], "Test repeat ordering, courier availability and geographic density."], ["Merchant software adoption", "Business model", 1, 2, "Merchant integration helps but does not require owning the POS.", "Adoption and retention of the operating platform underpin subscriptions and payments.", ["D1", "T1"], "Measure active deployments, retention and time to value."], ["Merchant payment economics", "Business model", 0, 2, "Merchant payment processing as a standalone product is not central to marketplace revenue.", "Payment volume and net processing economics support financial technology revenue.", ["D1", "T1"], "Measure payment gross profit per location after processing costs."], ["Capital availability", "Financing", 1, 1, "External finance may support investment and growth; need depends on cash flow.", "External finance may support expansion; need depends on cash flow.", ["D1", "T1"], "Model runway, cash generation and financing needs separately."]], "default": 2, "metrics": [["Active transacting consumers", "Orders per active consumer", "Contribution profit per order"], ["Active restaurant locations", "Payment volume per location", "Merchant acquisition payback"]], "interaction": "Toast announced direct POS integrations with DoorDash and other delivery platforms in November 2021. They can cooperate in fulfilment while competing for control of digital orders. Integration dependence and platform bargaining power could still create common exposure.", "irefs": ["T2"], "counter": "Neither business is immune to restaurant weakness, financing conditions or platform bargaining power. They are overlapping, adjacent competitors, not interchangeable head-to-head startups.", "learning": "Delivery contribution and retention of restaurant software are different questions. Underwrite each independently; learning from one does not validate the other.", "later": []}, {"id": "mobility", "label": "Shared micromobility", "names": ["Bird", "Lime"], "colors": ["#345c8b", "#697329"], "thesis": "Short urban trips can be served economically by shared electric vehicles.", "headline": "Different operators, overlapping economic hypothesis", "roles": ["Shared rentals with fleet-manager operations", "Shared rentals with hardware and fleet operations"], "facts": ["2021 results emphasized ride economics and utilization. Original non-GAAP ride profit after vehicle depreciation: $41.5m.", "2020 Gen 4 announcement emphasized replaceable batteries and improved operating efficiency. No comparable audited Lime ride-profit series established here."], "refs": [["B1"], ["L1"]], "factors": [["On-demand rides", "Rent a shared vehicle for short trips.", 5, 5, ["B1", "L1"]], ["Vehicle availability", "Make vehicles available where riders need them.", 5, 5, ["B1", "L1"]], ["Vehicle durability", "Design vehicles to survive repeated fleet use.", 4, 5, ["B1", "L1"]], ["Battery servicing", "Reduce operational burden of maintaining charge.", null, 5, ["L1"]], ["Fleet-manager model", "Rely on local fleet managers to handle operations.", 5, null, ["B1"]], ["City access", "Acquire and retain authority to operate.", 5, 5, ["M1"]]], "deps": [["Demand for paid rides", "System", 2, 2, "Paid rides are the core rental demand.", "Paid rides are the core rental demand.", ["B1", "L1"], "Measure paid trips at sustainable prices across seasons."], ["Municipal access", "System", 2, 2, "Permits and caps constrain deployment.", "Permits and caps constrain deployment.", ["M1"], "Track permit renewals, local restrictions and geographic concentration."], ["Lifetime vehicle economics", "Business model", 2, 2, "Vehicle lifetime revenue must cover fleet and operating costs.", "Durability and efficient battery servicing must translate into lifetime economics.", ["B1", "L1"], "Track cohorts through retirement: collected fare less all deployment, service and replacement costs."], ["Paid utilization", "Business model", 2, 2, "Paid rides per deployed vehicle determine revenue productivity.", "Paid rides per deployed vehicle determine revenue productivity.", ["B1", "L1"], "Reconcile paid rides to settled receipts and deployed vehicle-days."], ["Servicing costs", "Business model", 2, 2, "Charging, repair and redistribution consume ride revenue.", "Charging, repair and redistribution consume ride revenue.", ["B1", "L1"], "Measure cash costs per vehicle-day, including local labor and maintenance."], ["Fleet financing", "Financing", 1, 1, "Fleet replacement requires funding from cash flow or financing.", "Fleet replacement requires funding from cash flow or financing.", ["B1", "L1"], "Stress cash runway and replacement capex; actual financing differs by company."], ["Fleet-manager execution", "Company", 2, null, "The disclosed fleet-manager approach relies on partner execution.", "Comparable exposure not established by available contemporaneous evidence.", ["B1"], "Check operator quality and economics; obtain Lime-specific evidence before classifying."]], "default": 2, "metrics": [["Paid rides per vehicle-day", "Economically useful vehicle lifetime", "Fully loaded fleet cash return"], ["Paid rides per vehicle-day", "Economically useful vehicle lifetime", "Fully loaded fleet cash return"]], "interaction": "Municipal caps can make access zero-sum within a city. Saint Paul approved both companies in 2021 under a combined cap. One operator’s gains may displace another’s, so common business-model risk is not identical to company-specific outcome risk.", "irefs": ["M1"], "counter": "Operating skill, financing and city-level access may differ enough to justify an execution hedge. A single operator’s failure cannot disprove the whole category.", "learning": "One company can provide evidence on paid utilization and lifetime economics, but only where results transfer across cities, fleets and operating models. Reserve capital or wait if the shared premise is unresolved; do not assume confidential data can be shared.", "later": [["2022 restatement", "Bird’s original 2021 non-GAAP ride profit after vehicle depreciation of $41.5m was restated to $26.9m (about 35% lower). Not overall profitability.", ["B1", "B2"]], ["June 2023", "San Francisco reallocated Bird’s 1,500 permitted scooters between Lime and Spin after Bird surrendered its permit.", ["M2"]], ["December 2023", "Bird commenced voluntary Chapter 11. This does not establish that the category failed or that concentration would have improved returns.", ["B3"]]]}]}, S=DATA.sources, C=DATA.cases, esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), ref=keys=>keys.map(k=>`<a class="sourceTag" target="_blank" rel="noopener" href="${esc(S[k][2])}" title="${esc(S[k][0])}">[${k}]</a>`).join(''), money=x=>'$'+(Math.abs(x)<1e-8?0:x).toLocaleString('en-US',{maximumFractionDigits:2})+'m', pct=x=>(x*100).toFixed(1)+'%', name=(c,i)=>esc(c.names[i]), status=v=>v===2?'Critical':v===1?'Supporting':v===0?'Limited direct':'Unknown', cls=v=>v===2?'critical':v===1?'support':v===0?'limited':'unknown';

function chart(c){const f=c.factors, w=780,h=316, left=65,right=744,dx=(right-left)/(f.length-1),y=v=>212-(v-1)*39;let svg=`<svg class="plot" viewBox="0 0 ${w} ${h}" role="img" aria-label="Qualitative strategic emphasis; accessible data table below">`;const bands=c.id==='restaurants'?[['Demand & fulfilment',0,2],['Merchant infrastructure',3,5],['Integration',6,6]]:[['Rider offering',0,1],['Fleet operations',2,4],['Access',5,5]];bands.forEach(([l,a,b],i)=>{let x=Math.max(48,left+a*dx-dx*.47),end=Math.min(755,left+b*dx+dx*.47);svg+=`<rect x="${x}" y="35" width="${end-x}" height="192" fill="${i%2?'#e9dfc8':'#f3ead5'}" opacity=".35"/><text x="${(x+end)/2}" y="22" font-size="12" font-weight="650" text-anchor="middle" fill="#53636a">${l}</text>`});for(let i=1;i<=5;i++)svg+=`<line x1="48" x2="755" y1="${y(i)}" y2="${y(i)}" stroke="#d9d0bb" stroke-dasharray="3 4"/><text x="35" y="${y(i)+4}" fill="#53636a" font-size="13" text-anchor="end">${i}</text>`;let curves=[{v:f.map(r=>r[2]),c:c.colors[0],dash:'',shape:0},{v:f.map(r=>r[3]),c:c.colors[1],dash:'6 4',shape:1}];if(state.custom[state.case])curves.push({v:state.custom[state.case],c:'#252525',dash:'2 5',shape:2});curves.forEach((s,j)=>{if(j<2&&!state.visible[j])return;let seg=[];const flush=()=>{if(seg.length>1)svg+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${s.c}" stroke-width="3" stroke-dasharray="${s.dash}"/>`;seg=[]};s.v.forEach((v,i)=>{if(v===null){flush();return}seg.push(`${left+i*dx},${y(v)}`)});flush();s.v.forEach((v,i)=>{if(v===null)return;const x=left+i*dx;svg+=j===1?`<rect x="${x-4}" y="${y(v)-4}" width="8" height="8" fill="${s.c}"/>`:`<circle cx="${x}" cy="${y(v)}" r="4.5" fill="${s.c}"/>`})});f.forEach((r,i)=>{let words=r[0].split(' '),lines=words.length>1?[words.slice(0,Math.ceil(words.length/2)).join(' '),words.slice(Math.ceil(words.length/2)).join(' ')]:words;lines.forEach((l,j)=>svg+=`<text x="${left+i*dx}" y="${244+j*17}" text-anchor="middle" fill="#35474b" font-size="13">${esc(l)}</text>`)}); function scoreTable(c){return `<details><summary>Factor definitions, ratings and sources</summary><div class="table-scroll"><table><thead><tr><th>Competitive factor</th>${c.names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${c.factors.map(f=>`<tr><td><strong>${esc(f[0])}</strong><br><span class="subtle">${esc(f[1])}${ref(f[4])}</span></td><td>${f[2]??'Unknown'}</td><td>${f[3]??'Unknown'}</td></tr>`).join('')}</tbody></table></div></details>`}
function strategy(c){return `<div class="eyebrow">Competitive position</div><h3>${esc(c.headline)}</h3><p>${esc(c.thesis)}</p><p class="subtle">Historical information cutoff: 31 March 2022. Not a reconstruction of early-stage deal terms.</p>${chooser(c)}${pairs(c)}${legend(c)}<div class="plot-scroll" tabindex="0" aria-label="Scrollable strategy canvas" data-plot>${chart(c)}</div><p class="scrollhint subtle">Swipe to explore the full curve.</p><p class="subtle">Adapted Blue Ocean canvas: strategic emphasis across overlapping offerings, not measured buyer value, capability or quality. Ratings are analyst judgments from cited disclosures. Unknowns are not zeros. Lime’s durability and battery-servicing ratings reflect announced priorities, not independently verified superiority. Lime reported a cash-flow-positive quarter in November 2020; that supports investigating the shared economics, not assuming durable profitability.</p>${scoreTable(c)}<details><summary>Explore another route to value</summary><div><p>Sketch an alternative emphasis, then identify its buyer, revenue mechanism and trade-offs. A different curve does not establish unmet demand.</p><button type="button" data-custom="1">${state.custom[state.case]?'Reset alternative curve':'Add alternative curve'}</button><div class="curveedit" data-custom-fields>${customFields(c)}</div></div></details>`}
function customFields(c){return state.custom[state.case]?c.factors.map((f,i)=>`<label>${esc(f[0])} <output data-curve-val="${i}">${state.custom[state.case][i]}</output><input aria-label="${esc(f[0])}" type="range" min="1" max="5" value="${state.custom[state.case][i]}" data-curve="${i}"></label>`).join('')+`<label>Buyer and revenue mechanism<input type="text" placeholder="Who pays, and for what?" value="${esc(state.customNotes[state.case].buyer)}" data-customnote="buyer"></label><label>What would you deliberately not offer?<input type="text" value="${esc(state.customNotes[state.case].tradeoff)}" data-customnote="tradeoff"></label>`:''}
function metrics(c){return `<div class="eyebrow">Economic mechanisms</div><h3>What would we measure?</h3>${chooser(c)}<div class="pair">${c.names.map((n,i)=>`<div style="--color:${c.colors[i]}"><strong>${esc(n)}</strong>${c.metrics[i].map((m,j)=>`<div class="metric"><span class="eyebrow">${j===2?'Backstop':'Leading metric '+(j+1)}</span><br>${esc(m)}</div>`).join('')}${ref(c.refs[i])}</div>`).join('')}</div><p class="subtle">Proposed diligence metrics, not necessarily reported metrics. Their causal links to recurring gross profit or cash return require validation.</p>`}
function dependency(c,edit=false){return `<div class="eyebrow">Dependency map</div><h3>What could make both bets fail?</h3>${chooser(c)}<p class="subtle">Select a condition to trace exposure. Critical means necessary to the modeled core mechanism; supporting means relevant but not necessarily indispensable. Unknown indicates missing evidence.</p><div class="table-scroll" tabindex="0" aria-label="Dependency table"><table><thead><tr><th>Condition</th>${c.names.map(n=>`<th>${esc(n)}</th>`).join('')}<th>Shared?</th></tr></thead><tbody>${c.deps.map((d,i)=>{let v=state.edits[state.case][i];return `<tr data-deprow="${i}" class="${state.scenario[state.case]===i?'selected':''}"><td><button class="rowbtn" type="button" data-scenario="${i}">${esc(d[0])}</button><br><span class="subtle">${esc(d[1])}${ref(d[6])}</span></td>${v.map((n,j)=>`<td>${edit?`<select aria-label="${esc(d[0])}, ${name(c,j)}" data-dep="${i},${j}">${[2,1,0,null].map(x=>`<option value="${x===null?'u':x}" ${x===n?'selected':''}>${status(x)}</option>`).join('')}</select>`:`<span class="cell ${cls(n)}">${status(n)}</span>`}</td>`).join('')}<td>${v.includes(null)?'Unknown':v[0]===2&&v[1]===2?'Both critical':v.includes(2)?'One critical':'Neither critical'}</td></tr>`}).join('')}</tbody></table></div><div class="stress" data-stress>${stress(c)}</div><details><summary>Competitive responses and counterargument</summary><div><p>${esc(c.interaction)}${ref(c.irefs)}</p><p><strong>What could reverse the judgment?</strong> ${esc(c.counter)}</p></div></details><details><summary>What would we need to learn?</summary><div><p>${esc(c.learning)}</p>${c.later.length?`<div class="note"><strong>Later evidence · excluded from the 2022 underwriting view</strong>${c.later.map(r=>`<p class="space"><b>${esc(r[0])}</b> — ${esc(r[1])}${ref(r[2])}</p>`).join('')}</div>`:''}</div></details>`}
function classify(c){let v=state.edits[state.case][state.scenario[state.case]], shares=state.alloc;let totals=[0,0,0,0,Math.max(0,1-shares[0]-shares[1])];v.forEach((x,i)=>totals[x===2?0:x===1?1:x===0?2:3]+=shares[i]);return totals}
function stress(c){let idx=state.scenario[state.case],d=c.deps[idx],v=state.edits[state.case][idx];return `<label>Failure scenario<select data-scenario-select>${c.deps.map((r,i)=>`<option value="${i}" ${i===idx?'selected':''}>${esc(r[0])}</option>`).join('')}</select></label><div class="decision">${v.includes(null)?'Evidence is incomplete.':v.every(x=>x===2)?'A second position does not diversify this condition.':v.includes(2)?'A different mechanism may reduce this particular exposure.':'Neither core mechanism is classified as critically dependent.'}</div><div class="pair compact">${c.names.map((n,j)=>`<div style="--color:${c.colors[j]}"><h4>${esc(n)} · ${status(v[j])}</h4><p>${v[j]!==d[2+j]?`<b>Edited judgment.</b> Original rationale (${status(d[2+j])}): `:""}${esc(d[4+j])}${ref(d[6])}</p></div>`).join('')}</div><div class="note"><strong>Decisive evidence:</strong> ${esc(d[7])}</div>${allocation(c)}<p class="subtle">Exposure is a classification of invested capital, not loss probability, expected loss or estimated return correlation. Supporting and unknown exposures remain separate.</p>`}
function allocation(c){if(!Number.isFinite(state.budget)||state.budget<=0)return `<p class="error">Enter valid available capital in the ownership model.</p>`;let a=state.alloc, t=classify(c), labels=['Critical','Supporting','Limited direct','Unknown','Reserved'], colors=['#a14535','#ac913e','#568273','#85817b','#d5cbb6'];return `<div class="sliderline"><label>Available capital ($m)</label><b>${money(state.budget)}</b></div><div class="switch" aria-label="Allocation presets">${[['Both equally',.5,.5],['Only '+c.names[0],1,0],['Only '+c.names[1],0,1],['Pilot '+c.names[0]+' + reserve',.5,0],['Pilot '+c.names[1]+' + reserve',0,.5],['Reserve all',0,0]].map((p,i)=>`<button type="button" data-alloc="${p[1]},${p[2]}" aria-pressed="${Math.abs(a[0]-p[1])<1e-9&&Math.abs(a[1]-p[2])<1e-9}">${esc(p[0])}</button>`).join('')}</div><div class="subtle">${name(c,0)} ${money(a[0]*state.budget)} · ${name(c,1)} ${money(a[1]*state.budget)} · reserve ${money(Math.max(0,1-a[0]-a[1])*state.budget)}</div><div class="bar" role="img" aria-label="${t.map((x,i)=>labels[i]+' '+money(x*state.budget)).join(', ')}">${t.map((x,i)=>`<div style="width:${x*100}%;background:${colors[i]}"></div>`).join('')}</div><div class="key">${t.map((x,i)=>`<span><i class="dot" style="background:${colors[i]}"></i>${labels[i]} <b>${money(x*state.budget)}</b></span>`).join('')}</div>`}
function inputs(){return `<div class="fields"><label>Available capital ($m)<input type="number" min="0.01" step="0.5" data-num="budget" value="${state.budget}"></label><label>Fund size ($m)<input type="number" min="0.01" data-num="fund" value="${state.fund}"></label></div>`}
function calc(c){return `<div class="eyebrow">Ownership economics</div><h3>What does the second check cost?</h3><p>Hypothetical terms, not historical deal prices. Fixed capital, two equity positions, no follow-on capital or liquidation preferences.</p>${inputs()}<div class="twocol">${c.names.map((n,i)=>`<div class="deal" style="border-top:3px solid ${c.colors[i]}"><h4>${esc(n)}</h4><label>Post-money valuation ($m)<input type="number" min="0.01" data-num="entry,${i}" value="${state.entry[i]}"></label><label>Subsequent dilution (%)<input type="number" min="0" max="100" data-num="dilution,${i}" value="${state.dilution[i]}"></label><label>Success: distributable exit proceeds ($m)<input type="number" min="0" data-num="exit,${i}" value="${state.exit[i]}"></label></div>`).join('')}</div><label class="space">Holding period (years)<input type="number" min="0.1" step="1" data-num="years" value="${state.years}"></label><div data-econ>${economics(c)}</div>`}
function economics(c){const {budget:B,fund:F,entry:E,dilution:D,exit:X,years:Y}=state;let valid=[B,F,Y,...E,...D,...X].every(Number.isFinite)&&B>0&&F>0&&Y>0&&E.every(x=>x>0)&&D.every(x=>x>=0&&x<=100)&&X.every(x=>x>=0);if(!valid)return '<p class="error">Enter valid positive capital, fund, valuation and holding period; dilution 0–100%; nonnegative exits.</p>';let rows=[[c.names[0]+' only',1,0],[c.names[1]+' only',0,1],['Equal split',.5,.5],['Pilot '+c.names[0]+' + reserve',.5,0],['Pilot '+c.names[1]+' + reserve',0,.5],['Wait',0,0],['Selected allocation',...state.alloc]];return `<p class="subtle">Gross investment proceeds, not net fund returns. Reserved capital is shown separately, not counted as investment proceeds. Failure assumes zero recovery; no scenario probabilities are implied.</p><div class="table-scroll" tabindex="0"><table><thead><tr><th>Capital allocation</th><th>Only ${name(c,0)} succeeds</th><th>Only ${name(c,1)} succeeds</th><th>Both succeed</th><th>Both fail</th><th>Reserve</th></tr></thead><tbody>${rows.map(r=>{let checks=[r[1]*B,r[2]*B];if(checks.some((x,i)=>x>E[i]))return `<tr><td>${esc(r[0])}</td><td colspan="5" class="error">Check exceeds post-money valuation</td></tr>`;let own=checks.map((x,i)=>x/E[i]*(1-D[i]/100)),p=own.map((x,i)=>x*X[i]),inv=checks[0]+checks[1],res=Math.max(0,B-inv),fmt=x=>`${money(x)}<br><span class="subtle">${pct(x/F)} of fund</span>`;return `<tr><td><strong>${esc(r[0])}</strong><br><span class="subtle">${pct(own[0])} / ${pct(own[1])} at exit</span></td><td>${fmt(p[0])}</td><td>${fmt(p[1])}</td><td>${fmt(p[0]+p[1])}</td><td>${fmt(0)}</td><td>${money(res)}</td></tr>`}).join('')}</tbody></table></div><p class="subtle">Assuming feasible entry checks, modeled gross single-deal MOIC on success: ${E.map((x,i)=>(X[i]/x*(1-D[i]/100)).toFixed(1)+'×').join(' / ')}. Single-check, single-exit annualized returns: ${E.map((x,i)=>pct(Math.pow(X[i]/x*(1-D[i]/100),1/Y)-1)).join(' / ')}. Not a multi-cash-flow IRR.</p>`}
function compactCalc(c){return `<div class="eyebrow">Ownership economics</div><h3>One winner. Two possible ownership outcomes.</h3><p>Hypothetical venture terms, not historical entry prices. Compare concentrating capital with splitting it evenly.</p>${inputs()}<div class="twocol">${c.names.map((n,i)=>`<div class="deal" style="border-top:3px solid ${c.colors[i]}"><h4>${esc(n)}</h4><div class="fields"><label>Post-money ($m)<input type="number" min="0.01" data-num="entry,${i}" value="${state.entry[i]}"></label><label>Dilution (%)<input type="number" min="0" max="100" data-num="dilution,${i}" value="${state.dilution[i]}"></label></div><label>Success exit proceeds ($m)<input type="number" min="0" data-num="exit,${i}" value="${state.exit[i]}"></label></div>`).join('')}</div><div data-compact-econ>${compactEconomics(c)}</div><p class="subtle">Assumes no follow-on checks, proportional equity distributions and zero recovery from a failed company. No probabilities or preferences are modeled.</p>`}
function compactEconomics(c){let {budget:B,fund:F,entry:E,dilution:D,exit:X}=state;if(![B,F,...E,...D,...X].every(Number.isFinite)||B<=0||F<=0||E.some(x=>x<=0)||D.some(x=>x<0||x>100)||X.some(x=>x<0))return '<p class="error">Enter valid capital, valuations, dilution and exit values.</p>';return `<div class="table-scroll space"><table><thead><tr><th>If only this company succeeds</th><th>Full check</th><th>Equal split</th></tr></thead><tbody>${c.names.map((n,i)=>{let o=B/E[i]*(1-D[i]/100),g=o*X[i];let cell=(f)=>B*f>E[i]?'<span class="error">Check exceeds valuation</span>':`<b>${money(g*f)}</b><br><span class="subtle">${pct(o*f)} ownership · ${pct(g*f/F)} of fund</span>`;return `<tr><td>${esc(n)}</td><td>${cell(1)}</td><td>${cell(.5)}</td></tr>`}).join('')}</tbody></table></div>`}
function evidence(c){return `<div class="eyebrow">Learning</div><h3>What evidence would change the decision?</h3>${chooser(c)}<p>${esc(c.learning)}</p><details><summary>Evidence ledger and later outcomes</summary><div>${c.deps.map(d=>`<div class="metric"><h4>${esc(d[0])}</h4><p>${esc(d[7])}${ref(d[6])}</p></div>`).join('')}${c.later.map(r=>`<div class="note"><b>After cutoff · ${esc(r[0])}</b><p>${esc(r[1])}${ref(r[2])}</p></div>`).join('')}</div></details>`}
function ledger(c){return `<details><summary>Sources and limitations</summary><div class="sources"><p>Information cutoff: March 31, 2022. Later developments are separately marked. Case assessments checked November 25, 2026. Three companies were already public by the cutoff; this is a historical business-model exercise, not simultaneous venture deal reconstruction. Sources are mostly company disclosures; Lime data are less complete. Classifications and proposed metrics are inferred, not verified measurements.</p><ul>${Object.entries(S).filter(([k])=>c.refs.flat().includes(k)||c.deps.some(d=>d[6].includes(k))||c.irefs.includes(k)||c.later.some(r=>r[2].includes(k))).map(([k,s])=>`<li><b>${k}</b> · <a target="_blank" rel="noopener" href="${esc(s[2])}">${esc(s[0])}</a> (${esc(s[1])}). ${esc(s[3])}</li>`).join('')}</ul></div></details>`}
function evidenceEditor(c){let i=state.scenario[state.case],d=c.deps[i],r=state.evidenceNotes[state.case][i]||{};return `<details open><summary>Record your underwriting judgment for the selected condition</summary><div data-evidence-editor>${evidenceFields(c)}</div></details>`}
function evidenceFields(c){let i=state.scenario[state.case],d=c.deps[i],r=state.evidenceNotes[state.case][i]||{};return `<h4>${esc(d[0])}</h4><p class="subtle">These are your judgments, not measured probabilities. The economic impact and evidence may differ by company.</p><div class="twocol">${c.names.map((n,j)=>`<div class="deal" style="border-top:3px solid ${c.colors[j]}"><h4>${esc(n)}</h4>${[['uncertainty','Uncertainty',['Not assessed','Low','Moderate','High']],['consequence','Consequence if false',['Not assessed','Manageable','Material','Existential']],['substitution','Alternative mechanism',['Not assessed','Available','Plausible but unproven','None identified']]].map(([key,l,opts])=>`<label>${l}<select data-evidence="${j}-${key}">${opts.map(v=>`<option ${r[j+'-'+key]===v?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}<label>Evidence and rationale<textarea data-evidence="${j}-rationale" placeholder="Link or summarize supporting and contradictory evidence">${esc(r[j+'-rationale']||'')}</textarea></label></div>`).join('')}</div><label class="space">Next decisive test / cost of learning / cost of waiting<textarea data-evidence="test" placeholder="What would change your decision, at what cost?">${esc(r.test||'')}</textarea></label>`}
function workspace(c){return `<div class="eyebrow">Underwriting workspace · illustrative historical cases</div><h3>Does the second position earn its capital?</h3>${chooser(c)}${pairs(c)}<div class="note"><p><b>Separate the market, mechanism, team and deal.</b> Change dependency assumptions; compare fixed-capital scenarios; record what would change your judgment.</p></div>${strategy(c)}<div class="divider"></div>${dependency(c,true)}<div class="divider"></div><h4>Custom commitment</h4><p class="subtle">Set the percentage of available capital committed to each company. The remainder stays reserved.</p><div class="fields"><label>${name(c,0)} (%)<input type="number" min="0" max="100" data-share="0" value="${state.alloc[0]*100}"></label><label>${name(c,1)} (%)<input type="number" min="0" max="100" data-share="1" value="${state.alloc[1]*100}"></label></div><p data-share-error class="error" hidden>Commitments must be nonnegative and total no more than 100%. Results still reflect the last valid allocation.</p><div class="divider"></div>${calc(c)}<div class="divider"></div>${evidence(c)}${evidenceEditor(c)}<label>Investment committee notes<textarea data-notes placeholder="What evidence supports the thesis? What would change the decision? What information can be learned from one company, and what must be independently tested?">${esc(state.notes[state.case])}</textarea></label><button type="button" data-export>Export case analysis (JSON)</button><button type="button" data-reset>Reset case assumptions</button>${ledger(c)}`}
function render(root){const c=current(),kind=root.dataset.bets;const content=kind==='strategy'?strategy(c):kind==='metrics'?metrics(c):kind==='dependencies'?dependency(c):kind==='ownership'?compactCalc(c):kind==='learning'?evidence(c):workspace(c);e(root,'.bets-content').innerHTML=content+(kind==='strategy'||kind==='dependencies'?ledger(c):'');root.classList.add('js-ready')}
function all(){roots.forEach(render)}function refresh(){roots.forEach(r=>{const c=current();r.querySelectorAll('[data-stress]').forEach(x=>x.innerHTML=stress(c));r.querySelectorAll('[data-econ]').forEach(x=>x.innerHTML=economics(c));r.querySelectorAll('[data-compact-econ]').forEach(x=>x.innerHTML=compactEconomics(c));r.querySelectorAll('[data-evidence-editor]').forEach(x=>x.innerHTML=evidenceFields(c));r.querySelectorAll('[data-deprow]').forEach(x=>x.classList.toggle('selected',+x.dataset.deprow===state.scenario[state.case]))})}
roots.forEach(root=>{root.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;let d=b.dataset;if(d.case!==undefined){state.case=+d.case;all();root.querySelector(`[data-case="${state.case}"]`)?.focus({preventScroll:true})}else if(d.visible!==undefined){state.visible[+d.visible]=!state.visible[+d.visible];root.querySelectorAll('[data-visible]').forEach(x=>x.setAttribute('aria-pressed',state.visible[+x.dataset.visible]));e(root,'[data-plot]').innerHTML=chart(current())}else if(d.scenario!==undefined){state.scenario[state.case]=+d.scenario;refresh();if(matchMedia('(max-width:640px)').matches)e(root,'[data-stress]').scrollIntoView({block:'nearest'})}else if(d.alloc){state.alloc=d.alloc.split(',').map(Number);root.querySelectorAll('[data-share]').forEach(x=>x.value=state.alloc[+x.dataset.share]*100);let err=e(root,'[data-share-error]');if(err)err.hidden=true;refresh()}else if(d.custom){state.custom[state.case]=current().factors.map(()=>3);state.customNotes[state.case]={buyer:"",tradeoff:""};e(root,'[data-custom-fields]').innerHTML=customFields(current());e(root,'[data-plot]').innerHTML=chart(current());b.textContent='Reset alternative curve'}else if(d.reset!==undefined){state.edits[state.case]=current().deps.map(r=>[r[2],r[3]]);state.custom[state.case]=null;state.customNotes[state.case]={buyer:'',tradeoff:''};state.notes[state.case]='';state.evidenceNotes[state.case]={};state.budget=4;state.fund=100;state.entry=[40,40];state.dilution=[50,50];state.exit=[2000,2000];state.alloc=[.5,.5];state.years=8;all()}else if(d.export!==undefined){let blob=new Blob([JSON.stringify({case:current(),sources:S,cutoff:DATA.cutoff,assumptions:state.edits[state.case],alternative:state.custom[state.case],alternativeNotes:state.customNotes[state.case],allocation:state.alloc,budget:state.budget,fund:state.fund,entry:state.entry,dilution:state.dilution,exit:state.exit,years:state.years,notes:state.notes[state.case],conditionJudgments:state.evidenceNotes[state.case]},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='underwriting-'+current().id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});root.addEventListener('change',ev=>{let t=ev.target,d=t.dataset;if(d.scenarioSelect!==undefined){state.scenario[state.case]=+t.value;refresh()}else if(d.dep){let [i,j]=d.dep.split(',').map(Number);state.edits[state.case][i][j]=t.value==='u'?null:+t.value;let row=t.closest('tr'),v=state.edits[state.case][i];row.lastElementChild.textContent=v.includes(null)?'Unknown':v.every(x=>x===2)?'Both critical':v.includes(2)?'One critical':'Neither critical';refresh()}});root.addEventListener('input',ev=>{let t=ev.target,d=t.dataset;if(d.curve!==undefined){let i=+d.curve;state.custom[state.case][i]=+t.value;e(root,`[data-curve-val="${i}"]`).textContent=t.value;e(root,'[data-plot]').innerHTML=chart(current())}else if(d.share!==undefined){let values=[...root.querySelectorAll('[data-share]')].map(x=>x.value===''?NaN:Number(x.value));let invalid=values.some(x=>!Number.isFinite(x)||x<0||x>100)||values.reduce((a,b)=>a+b,0)>100+1e-9;e(root,'[data-share-error]').hidden=!invalid;if(!invalid){state.alloc=values.map(x=>x/100);refresh()}}else if(d.num){let [k,i]=d.num.split(','),n=t.value===''?NaN:Number(t.value);if(i===undefined)state[k]=n;else state[k][+i]=n;refresh()}else if(d.notes!==undefined)state.notes[state.case]=t.value;else if(d.customnote)state.customNotes[state.case][d.customnote]=t.value;else if(d.evidence){let idx=state.scenario[state.case];(state.evidenceNotes[state.case][idx]??={})[d.evidence]=t.value}})});all();
})();
</script></body></html>
