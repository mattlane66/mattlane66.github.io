mechanics, much more efficiently than classical computers. While they may help us understand aspects of life and reality at a fundamental level, their current and near-future capabilities are far from simulating all of life or reality itself. \n\nQuantum computing has **potential** for agent-based modeling in areas where:\n\n- Interactions are probabilistic or highly complex.\n- Large-scale optimization problems arise.\n- Quantum properties of the agents or system are significant.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/8cf00d1d-c088-456c-9fd9-f1073dd2caa7_2048x2048.heic)","discussion":"","replyCount":0,"excerpt":"Quantum computers, in theory, have the potential to simulate certain complex systems, particularly those governed by quantum mechanics, much more efficiently than classical computers. While they may help us understand aspects of life and reality at a fundamental level, their current and near-future capabilities are far from simulating all of life or reality ","words":88},{"id":"81675112","date":"2024-12-15","title":"Agent Action Spaces","summary":"Agent Action Spaces In the coming years, we may move away from the human-computer interaction model and toward an “agent","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Design, software, and systems","source":"https://substack.com/@mattlane/note/c-81675112","body":"In the coming years, we may move away from the human-computer interaction model and toward an “agent-action space” model.\n\nWe’ll need to start thinking about how action-space design patterns work best for “agentic intent” rather than human actors alone. It’ll be generative plus parametric.\n\nAgent Affordances: Interfaces must convey what agents can do in context, akin to showing affordances for physical objects. People will need clarity on the agent’s toolset.\n\nThis vision suggests a radical shift where interaction is less about doing and more about guiding intent, delegating to intelligent agents, and refining results. Designing for such systems will require new mental models, interaction paradigms, and an embrace of co-creative dynamics.","discussion":"","replyCount":0,"excerpt":"In the coming years, we may move away from the human-computer interaction model and toward an “agent-action space” model. We’ll need to start thinking about how action-space design patterns work best for “agentic intent” rather than human actors alone. It’ll be generative plus parametric. Agent Affordances: Interfaces must convey what agents can do in contex","words":111},{"id":"81413216","date":"2024-12-13","title":"As a product strategist and conceptual software designer, I reach for Miro a lot.","summary":"As a product strategist and conceptual software designer, I reach for Miro a lot. The work I do in it feels effortlessly","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-81413216","body":"The work I do in it feels effortlessly lightweight. And a sign of work being lightweight is when throwing it away feels like progress. Miro has the right mix of primitives that support thinking in action.\n\nI can effectively provide enough latitude in it to enable breakthroughs, i.e., to enable my future self and others to work within rough, schematic constraints while leaving the specifics open according to the realities of the project.\n\nFigma feels right once affordances are wired up to code and we are ready to add the finishing touches. This is a different intent than what it was designed for and how it is often used. I see Figma not as the ideal pre-development tool, but as a good fit for in-development work.\n\nAlso, Miro’s action space is the perfect general framework to easily build various ways of working conventions. It ensures communication is spatial (on the work where the work is) and thinking artifacts are contextually maintained on its substrate. I can easily replace Google Docs and Slides (and the like), most of Sheets, and most, if not all, project management tools while supporting visual reasoning along the way.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/568f2780-d621-42c6-a490-49fd1d9af3b2_1333x1215.heic)","discussion":"","replyCount":0,"excerpt":"The work I do in it feels effortlessly lightweight. And a sign of work being lightweight is when throwing it away feels like progress. Miro has the right mix of primitives that support thinking in action. I can effectively provide enough latitude in it to enable breakthroughs, i.e., to enable my future self and others to work within rough, schematic constrai","words":195},{"id":"81404365","date":"2024-12-13","title":"Identity-Based Transformation","summary":"Identity-Based Transformation Lasting change comes from aligning your habits with your desired identity. Instead of focu","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-81404365","body":"Lasting change comes from aligning your habits with your desired identity. Instead of focusing on what you want to achieve, consider who you wish to become. This shift is profound—like the difference between saying \"I'm trying to quit smoking\" and \"I'm not a smoker.\"\n\nTo understand this, imagine two people trying to get fit. The first thinks, \"I want to lose weight,\" while the second thinks, \"I'm becoming an athlete.\" The second perspective naturally leads to decisions that align with that identity, making consistent exercise more likely.\n\n**The Art of Habit Stacking**\n\nThink of your existing habits as a chain of behaviors. Habit stacking is like adding new links to this chain, connecting new behaviors to established ones. For example, \"After I pour my morning coffee (existing habit), I will write one paragraph (new habit).\"\n\nThis works because your brain already has strong neural pathways for existing habits. By connecting new habits to these established pathways, you're like a mountain climber using existing handholds to reach new heights.\n\n**Keep this in mind:** Don’t build a prison made of your habits. Make sure you leave some room for things to go haywire.","discussion":"","replyCount":0,"excerpt":"Lasting change comes from aligning your habits with your desired identity. Instead of focusing on what you want to achieve, consider who you wish to become. This shift is profound—like the difference between saying \"I'm trying to quit smoking\" and \"I'm not a smoker.\" To understand this, imagine two people trying to get fit. The first thinks, \"I want to lose ","words":191},{"id":"81369569","date":"2024-12-13","title":"Happiness is the easiest thing to take for granted and the hardest thing to get right.","summary":"Happiness is the easiest thing to take for granted and the hardest thing to get right.","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-81369569","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"81369757","date":"2024-12-13","title":"https://fs.blog/chestertons-fence/","summary":"Note 81369757","sourceCategory":"References, images, and found objects","category":"Life & learning","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-81369757","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"80909114","date":"2024-12-10","title":"Topic of Emergence Chemistry to Biology: Emergence of Life Key Point: Life introduces concepts like…","summary":"Topic of Emergence Chemistry to Biology: Emergence of Life Key Point: Life introduces concepts like metabolism, reproduc","sourceCategory":"Science, emergence, and reality","category":"AI & future work","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-80909114","body":"```\nTopic of Emergence\n```\n\n**Chemistry to Biology: Emergence of Life**\n\n**Key Point**: Life introduces concepts like metabolism, reproduction, and evolution, which transcend chemical reactions.\n\n- **Emergent Properties**: Life is not just a collection of chemical reactions but a system where these reactions are organized to sustain, replicate, and evolve.\n\n    - **Metabolism**: Emerges as a network of self-sustaining chemical reactions, maintaining far-from-equilibrium states.\n    - **Reproduction**: Requires coordination of information (e.g., genetic material) and chemistry, creating systems capable of copying themselves.\n    - **Evolution**: Introduces time and variation, enabling systems to adapt, which has no direct analog at the chemical level.\n- **How Emergence Explains It**: The complexity of molecular interactions reaches a threshold where new rules or principles—like homeostasis or genetic inheritance—become meaningful at the biological level. These new principles are shaped by the constraints of chemistry but are not determined solely by them.\n**Physics to Chemistry: Emergence of Reactivity and Stability**\n\n**Key Point**: Chemical reactions involve properties like reactivity and stability that aren't directly apparent from quantum mechanics.\n\n- **Emergent Properties**:\n\n    - **Reactivity**: Atoms and molecules gain characteristics like electronegativity and bonding preferences, which emerge from but are not obvious in their quantum mechanical wavefunctions.\n    - **Stability**: Molecules exhibit stable structures like water's bent shape or the helical nature of DNA, driven by energetic minima in multidimensional landscapes.\n- **How Emergence Explains It**: Quantum mechanical interactions provide the substrate (e.g., electrons, nuclei), but chemical behavior emerges through complex interactions at the molecular scale, leading to properties governed by thermodynamic principles and patterns of electron distribution.\n**What Emergence Adds to These Transitions**\n\n1. **Irreducibility of Novel Properties**: Properties like metabolism or reactivity aren't evident when analyzing subatomic particles or quantum states alone. Instead, they manifest when components interact at higher levels of organization.\n\n    - Example: DNA's role in heredity is not just a chemical fact but depends on its sequence encoding information—a concept absent in physics or chemistry.\n2. **New Organizational Rules**: Each layer of reality operates under new rules that are built on but are not wholly defined by lower levels:\n\n    - Chemistry operates within the framework of physics but introduces concepts like molecular orbitals and bond energies.\n    - Biology operates within the framework of chemistry but introduces systems thinking (e.g., feedback loops, self-organization).\n3. **Threshold Effects**: Emergence often requires critical complexity. For example, life emerged when molecular systems reached a threshold of complexity enabling self-replication and evolution.\n4. **Nonlinear and Context-Dependent Interactions**: Properties depend on collective behaviors, not individual parts.\n\n    - In biology, the environment and system interactions play a massive role in shaping emergent behavior (e.g., a single DNA strand doesn't \"live\" without a cellular context).\n**What Remains Open for Exploration**\n\n1. **What defines the thresholds of emergence?** For example, what level of molecular complexity is needed for life-like behavior to emerge?\n2. **How deterministic is emergence?** Are these transitions inevitable given the right conditions, or do they rely on specific historical contingencies?\n3. **Are emergent properties computationally describable?** Can we simulate emergence fully, or are there irreducibly qualitative aspects?","discussion":"","replyCount":0,"excerpt":"Topic of Emergence Chemistry to Biology: Emergence of Life Key Point: Life introduces concepts like metabolism, reproduction, and evolution, which transcend chemical reactions. - Emergent Properties: Life is not just a collection of chemical reactions but a system where these reactions are organized to sustain, replicate, and evolve. - Metabolism: Emerges as","words":500},{"id":"80204572","date":"2024-12-05","title":"There’s no nav in software product design and development.","summary":"There’s no nav in software product design and development. There are phases. You do something, and then you see the next","sourceCategory":"Product strategy and development","category":"Products & systems","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-80204572","body":"There’s no nav in software product design and development. There are phases. You do something, and then you see the next step. It is incremental, not monotonic. You need to be ready to make decisions at any point in time.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/440b1b48-da7f-4ca9-81ed-a3100646b43f_1024x439.jpeg)","discussion":"","replyCount":0,"excerpt":"There’s no nav in software product design and development. There are phases. You do something, and then you see the next step. It is incremental, not monotonic. You need to be ready to make decisions at any point in time. Attachments 1.","words":42},{"id":"80203864","date":"2024-12-05","title":"The Solution Changes, But the Job Remains the Same","summary":"The Solution Changes, But the Job Remains the Same What changes are our expectations for quality and performance. This i","sourceCategory":"Product strategy and development","category":"Products & systems","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-80203864","body":"What changes are our expectations for quality and performance.\n\nThis is tue across seemingly different segments of the population.\n\nOnce we managed to tame boredom on the subway commute by reading the newspaper. Now, for better or worse, it’s the smartphone. The solution changed, the job/task remained the same, i.e., ward off boredom for commuters traveling by train.\n\nRarely are there new needs. It’s just the same need with an increased expectation for satisfaction.\n\n**Situations \u003e Market Segments**\n\nMarketing Examples:\n\nAd 1: You see someone watching a movie, gets the impulse for food, easily finds food near them, and then easily calls the restaurant. These jobs touch each other and help form a situational segment.\n\nAd 2: It’s about features, attributes, attitude, style and tone. All are geared for one particular type of customer — one type of market. The creators of this ad are thinking in terms of customer or market segments.\n\nCut up customers not by personas but by situational segments.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/91e093e7-c10c-4118-875c-11a1bba00c24_1024x1169.webp)","discussion":"","replyCount":0,"excerpt":"What changes are our expectations for quality and performance. This is tue across seemingly different segments of the population. Once we managed to tame boredom on the subway commute by reading the newspaper. Now, for better or worse, it’s the smartphone. The solution changed, the job/task remained the same, i.e., ward off boredom for commuters traveling by","words":164},{"id":"80202589","date":"2024-12-05","title":"Define your product’s competitive sets and what makes them suitable for different hiring moments.","summary":"Define your product’s competitive sets and what makes them suitable for different hiring moments. Avoid defining the “pr","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-80202589","body":"Define your product’s competitive sets and what makes them suitable for different hiring moments. Avoid defining the “product category”, as that’s outsourcing your strategy to the past.","discussion":"","replyCount":0,"excerpt":"Define your product’s competitive sets and what makes them suitable for different hiring moments. Avoid defining the “product category”, as that’s outsourcing your strategy to the past.","words":27},{"id":"80202193","date":"2024-12-05","title":"Four types of product work:","summary":"Four types of product work: 1. Improving a feature (increase customer satisfaction). 2. Getting more people to use it (i","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Work, collaboration, and organizations","source":"https://substack.com/@mattlane/note/c-80202193","body":"1. Improving a feature (increase customer satisfaction).\n\n2. Getting more people to use it (increase % adoption).\n\n3. Getting people to use it more (increase frequency).\n\n4. New feature/product to support a new workflow (increase customers).","discussion":"","replyCount":0,"excerpt":"1. Improving a feature (increase customer satisfaction). 2. Getting more people to use it (increase % adoption). 3. Getting people to use it more (increase frequency). 4. New feature/product to support a new workflow (increase customers).","words":36},{"id":"80200926","date":"2024-12-05","title":"A helpful to-do list structure:","summary":"A helpful to-do list structure: Dump initial tasks into the Dump without worrying about relationships. Affinitize task","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Work, collaboration, and organizations","source":"https://substack.com/@mattlane/note/c-80200926","body":"- Dump initial tasks into the Dump without worrying about relationships.\n- Affinitize tasks (cluster like with like), then name the task groups to avoid contriving the names of your lists/groups. Task groups should generally not exceed 5 business days (think of 4 days as the time box for each slice).\n- Sequence unknowns/risky task group elements first and create inputs and outputs from one cluster to another if doing one set helps you do another (start with things with more outputs than inputs)\n- Visualize state movement across: Not started, Unsolved, Solved, and Finished. You can indicate that using colors.\nKanban is great for disjointed ticket (reactive) work. Dumplink is excellent for whole and discrete project (meaningfully large and strategically important proactive) work, like new features or chunks of new products.\n\nThis is a great tool when kicking off a project on day one for development so PMs and developers can ensure they are seeing what is in each other's heads.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/9753580a-0f71-4a30-850e-335b7c34bc4f_1456x494.png)","discussion":"How task groups relate to code: [https://prodsense.substack.com/p/mapping-parts-of-a-project-to-code?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true](https://prodsense.substack.com/p/mapping-parts-of-a-project-to-code?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true)\n\n**Second Order To-Do List Structure (Affinity + Sequencing + Visual States)**\n\n**Key Idea:** Group tasks by affinity, tackle unknowns/risks first, and track tasks visually (e.g., Not Started → Unsolved → Solved → Finished).\n\n- **Decomposition:**\n  \n    - Breaking down shaped work into tasks.\n- **Abstraction:**\n  \n    - Roll tasks into groups to track progress at a second-order view to avoid getting stuck in the weeds of exact technical details at the outset.\n- **Pattern Recognition:**\n  \n    - Grouping tasks reveals **common themes** or recurring “types” of work.\n    - Helps you see patterns like repeated integration tasks or repeated design tasks.\n    - Identifies logical steps where finishing one cluster enables work on another.\n- **Algorithm/Procedure:**\n  \n    - Provides a **prioritization workflow**: do the risky/unknown tasks first and track through states (Not Started → Unsolved → Solved → Finished).\n    - Visualizing states keeps the team aligned on what’s next in a structured manner.","replyCount":0,"excerpt":"- Dump initial tasks into the Dump without worrying about relationships. - Affinitize tasks (cluster like with like), then name the task groups to avoid contriving the names of your lists/groups. Task groups should generally not exceed 5 business days (think of 4 days as the time box for each slice). - Sequence unknowns/risky task group elements first and cr","words":164},{"id":"80230132","date":"2024-12-05","title":"Systems can be interconnected at all levels even when each plane consists of differing logic.","summary":"Systems can be interconnected at all levels even when each plane consists of differing logic. When a computer executes a","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-80230132","body":"When a computer executes a program, the underlying logic gates and circuits don't change in their physical makeup; they follow the paths and states dictated by the abstract software loaded onto the computer.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/32e61eeb-6859-46e4-a7c0-7cabe2c2f35e_320x180.gif)","discussion":"","replyCount":0,"excerpt":"When a computer executes a program, the underlying logic gates and circuits don't change in their physical makeup; they follow the paths and states dictated by the abstract software loaded onto the computer. Attachments 1.","words":35},{"id":"80229496","date":"2024-12-05","title":"Specify Relationships Over Forms","summary":"Specify Relationships Over Forms Design should capture relationships between elements, not fixed forms. Describing &quot;a pl","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-80229496","body":"Design should capture relationships between elements, not fixed forms. Describing \"a place to pause near the entryway\" is adaptable across diverse environments, giving room for designers to respond to specific spatial or contextual constraints. This focus on relationships lets the design align with both the intent and the surroundings, balancing guidance with flexibility.","discussion":"","replyCount":0,"excerpt":"Design should capture relationships between elements, not fixed forms. Describing \"a place to pause near the entryway\" is adaptable across diverse environments, giving room for designers to respond to specific spatial or contextual constraints. This focus on relationships lets the design align with both the intent and the surroundings, balancing guidance wit","words":53},{"id":"80205781","date":"2024-12-05","title":"Simplicity is achieved by being less abstract and by turning big things into small things.","summary":"Simplicity is achieved by being less abstract and by turning big things into small things.","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-80205781","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"80203902","date":"2024-12-05","title":"Zoom in and out, from meta to matter.","summary":"Zoom in and out, from meta to matter. Use each scale to refine the other.","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-80203902","body":"Zoom in and out, from meta to matter. Use each scale to refine the other.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/6e3d82f2-457d-43f6-bd74-f133bbea5dd3_240x240.png)","discussion":"","replyCount":0,"excerpt":"Zoom in and out, from meta to matter. Use each scale to refine the other. Attachments 1.","words":17},{"id":"80202998","date":"2024-12-05","title":"What things have the fewest configurations where there will be a good fit?","summary":"What things have the fewest configurations where there will be a good fit? Knowing which things are most sensitive, we c","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-80202998","body":"What things have the fewest configurations where there will be a good fit? Knowing which things are most sensitive, we can then select things that we know relate to the centers of the form of other structures well or not.\n\nThe whole comes first. Then gives birth to the parts by differentiating space in a sensible sequence.\n\nDesign (or prompting, or planning) isn’t about forcing disjointed pieces together. Instead, it’s about letting a coherent whole unfold in a natural sequence, starting with the most sensitive constraints and adding each new layer in a way that supports, rather than disrupts, what’s already there.\n\nIn AI prompting—just as in architecture or gardening or software design—this leads to more organic, purposeful, and satisfying results.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/66eab2ce-3e64-409e-b356-6846f2d577d3_600x214.heic)","discussion":"","replyCount":0,"excerpt":"What things have the fewest configurations where there will be a good fit? Knowing which things are most sensitive, we can then select things that we know relate to the centers of the form of other structures well or not. The whole comes first. Then gives birth to the parts by differentiating space in a sensible sequence. Design (or prompting, or planning) i","words":123},{"id":"80228190","date":"2024-12-05","title":"Reactive work and planned work mages, and found objects","source":"https://substack.com/@mattlane/note/c-80214325","body":"Beware of enthymemes—arguments with hidden assumptions. They can mislead unless you reconstruct them.\n\n**Example**\n\n\"He's rich, so he must be smart.\"\n\nReconstruct it:\n\nPremise: He’s rich.\n\nFormerly Unstated Premise: Rich people are smart.\n\nConclusion: He’s smart.\n\nNow, you can challenge: Is wealth a measure of intelligence?\n\nEnthymemes are everywhere. Fucking everywhere!\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/43ca79a4-a8f7-461f-8725-6e3b7509c014_298x363.heic)","discussion":"","replyCount":0,"excerpt":"Beware of enthymemes—arguments with hidden assumptions. They can mislead unless you reconstruct them. Example \"He's rich, so he must be smart.\" Reconstruct it: Premise: He’s rich. Formerly Unstated Premise: Rich people are smart. Conclusion: He’s smart. Now, you can challenge: Is wealth a measure of intelligence? Enthymemes are everywhere. Fucking everywhere","words":53},{"id":"80205325","date":"2024-12-05","title":"The more we work on a thing (the more we are \"working it\") the more bloated and complicated that thing gets.","summary":"The more we work on a thing (the more we are &quot;working it&quot;) the more bloated and complicated that thing gets. Deletion is","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Work, collaboration, and organizations","source":"https://substack.com/@mattlane/note/c-80205325","body":"Deletion is the ultimate revision. \n\nImportant things come back.","discussion":"","replyCount":0,"excerpt":"Deletion is the ultimate revision. Important things come back.","words":9},{"id":"80205090","date":"2024-12-05","title":"Debating","summary":"Debating First, determine if an argument is worth having. If your interlocutor cannot imagine they would change their mi","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-80205090","body":"First, determine if an argument is worth having. If your interlocutor cannot imagine they would change their mind under any circumstances then the debate is not worth having. You can't reason somebody out of a position they didn't reason themselves into.\n\nAsk: Under what circumstances would we change our minds? Ask: What definitions are we using for key terms in our discussion? Ask: What do you mean by that? Ask: Why do you think that? In other words: What has caused you to think that and what are your reasons for thinking that?\n\nNo productive conversation can take place if there is a disagreement on definitions of key terms, underlying assumptions are hidden, and an interlocutor is not open to updating prior hypotheses.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/f5ac4c13-dd15-4ad7-95a9-b79a1e522d79.heic)","discussion":"","replyCount":0,"excerpt":"First, determine if an argument is worth having. If your interlocutor cannot imagine they would change their mind under any circumstances then the debate is not worth having. You can't reason somebody out of a position they didn't reason themselves into. Ask: Under what circumstances would we change our minds? Ask: What definitions are we using for key terms","words":125},{"id":"80204835","date":"2024-12-05","title":"Contrast.","summary":"Contrast. We like edges. We like seeing edges in our ideas next to each other that are different. That helps to improve","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-80204835","body":"Contrast. We like edges. We like seeing edges in our ideas next to each other that are different. That helps to improve our thinking.\n\nOur perception is involuntarily, directed by edges.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/717b3e09-abfb-4e25-b38b-2d9d11a3facf_1500x950.heic)","discussion":"","replyCount":0,"excerpt":"Contrast. We like edges. We like seeing edges in our ideas next to each other that are different. That helps to improve our thinking. Our perception is involuntarily, directed by edges. Attachments 1.","words":33},{"id":"80204503","date":"2024-12-05","title":"Networks not Chains","summary":"Networks not Chains There is rarely ever a single root cause of a problem. There is rarely ever a single symptom (effect","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-80204503","body":"There is rarely ever a single root cause of a problem. There is rarely ever a single symptom (effect) of a problem. Causality is not a chain, but a network. There may be faster and cheaper places to intervene than the root cause. \n\n- **Why** do I think the root cause is the best place to fix this problem?\n- **Why** do I think I should only intervene at a single location?\n- **Why** do I think the best intervention point will remain static?\n- **What** other important causes and effects are entering and exiting my causal chain?","discussion":"","replyCount":0,"excerpt":"There is rarely ever a single root cause of a problem. There is rarely ever a single symptom (effect) of a problem. Causality is not a chain, but a network. There may be faster and cheaper places to intervene than the root cause. - Why do I think the root cause is the best place to fix this problem? - Why do I think I should only intervene at a single locati","words":98},{"id":"80204395","date":"2024-12-05","title":"People get mixed up and think that they should reframe problems.","summary":"People get mixed up and think that they should reframe problems. But effective/useful reframing happens at a level above","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-80204395","body":"People get mixed up and think that they should reframe problems. But effective/useful reframing happens at a level above and below an empirically identified problem.","discussion":"","replyCount":0,"excerpt":"People get mixed up and think that they should reframe problems. But effective/useful reframing happens at a level above and below an empirically identified problem.","words":25},{"id":"80202838","date":"2024-12-05","title":"If you sense you’re not making tradeoffs, you’re doing something wrong.","summary":"If you sense you’re not making tradeoffs, you’re doing something wrong.","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-80202838","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"80200365","date":"2024-12-05","title":"Why “Mutual Exclusivity” Is Not Always Desirable","summary":"Why “Mutual Exclusivity” Is Not Always Desirable Many strategy consultants highlight “MECE thinking”—ensuring no overlap","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-80200365","body":"Many strategy consultants highlight “MECE thinking”—ensuring no overlap (ME) and covering all possibilities (CE). While this framework can help structure analyses or categories, it sometimes leads to artificially **excluding** options that could be combined advantageously. For instance:\n\n- Increasing Revenues vs. Reducing Costs: There is no inherent reason you must choose *only one* if doing both is feasible. This pair of approaches are *not *mutually exclusive in the strict sense (you can do both simultaneously), nor do they interfere in the sense that doing one automatically prevents doing the other. Thus, they are “independent” in practical business terms.\n- Mutual exclusivity is usually dictated by real-world constraints (budget, time, physical impossibility), not by a rigid analytical mindset.","discussion":"","replyCount":0,"excerpt":"Many strategy consultants highlight “MECE thinking”—ensuring no overlap (ME) and covering all possibilities (CE). While this framework can help structure analyses or categories, it sometimes leads to artificially excluding options that could be combined advantageously. For instance: - Increasing Revenues vs. Reducing Costs: There is no inherent reason you mu","words":117},{"id":"80185822","date":"2024-12-05","title":"Frequentist Hypothesis Testing: In frequentist hypothesis testing, we begin with the null hypothesis (H0),…","summary":"Frequentist Hypothesis Testing: In frequentist hypothesis testing, we begin with the null hypothesis (H0), which often r","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Design, software, and systems","source":"https://substack.com/@mattlane/note/c-80185822","body":"Frequentist Hypothesis Testing:\n\nIn **frequentist** hypothesis testing, we begin with the **null hypothesis** (H0), which often represents no effect or no difference (e.g., “A is equivalent to B”). We assume H0 is true and gather data to see whether the observed evidence is sufficiently unlikely under H0. Our goal is **not** to prove H0​ true; rather, we want to see if we can **reject** H0​ in favor of the **alternative hypothesis** (Ha​), which posits a difference or effect (e.g., “A is not B”).\n\nWe do not aim to confirm or “prove” H0; instead, we attempt to falsify it. **Failing to reject** H0​ does **not** mean H0​ is true—it only indicates that the data do not provide sufficient evidence to discard H0​.\n\nThe decision to reject or fail to reject H0​ typically depends on the **p-value**, which is the probability of observing data at least as extreme as what we observed, given H0​. A **small p-value** (often \u003c 0.05) suggests that such data would be unlikely if H0​ were true, so we **reject** H0​ in favor of Ha. A **larger p-value** indicates insufficient evidence to reject H0​.\n\n1. **Assume** H0​ is true.\n2. **Seek evidence** that would be unlikely under H0​ (this underlies the p-value calculation).\n3. **Reject** H0​ if the evidence is strong (i.e., p-value \u003c your chosen significance level), providing support for Ha​.\n4. If we **cannot reject** H0​, we are **not** proving it; we simply lack sufficient evidence to falsify it.\nA Note on Bayesian Methods:\n\nBy contrast, in **Bayesian** inference, probability reflects a *degree of belief*. Bayesian methods incorporate **prior** beliefs about parameters or hypotheses and then **update** those beliefs as data are observed, yielding a **posterior** probability of the hypothesis itself. Whereas frequentist methods focus on the probability of the **data** given H0​, Bayesian approaches directly quantify the probability of H0​ (or other hypotheses), given the data and prior. This leads to different ways of interpreting evidence but does not negate the utility of frequentist p-values as a widely used decision criterion.\n\nExample\n\nSimple A/B (Headache Medication) Test:\n\nImagine you’ve developed a new headache medication. You gather 100 volunteers with chronic headaches and randomly assign 50 to receive the new medication and 50 to receive a placebo (sugar pill).\n\n- **Null Hypothesis (H0):** The new medication has **no** effect; pain relief in the treatment group is no different from that in the placebo group.\n- **Alternative Hypothesis (Ha):** The new medication **does** relieve headaches more effectively than a placebo.\nYou measure each volunteer’s pain score after treatment and compute a p-value—i.e., the probability of observing such a difference (or a bigger one) **if** the new medication was no better than placebo.\n\n- If the **p-value** is very low (e.g., \u003c 0.05), you **reject** H0​, suggesting the medication is likely more effective than the placebo.\n- If the **p-value** is not below your threshold, you **fail to reject** H0​. This doesn’t prove the medication is ineffective; it only means you lack enough evidence to conclude otherwise.\nTwo Other Notable Testing Methods:\n\n- **Multi-Armed Bandit**: Dynamic, adaptive allocation emphasizing regret minimization and continuous learning, rather than a single end-of-test analysis.\n- **Multivariate/Orthogonal Array**: Systematic testing of multiple variables/factors at once, leveraging experimental design principles to detect main and interaction effects more efficiently than multiple separate A/B tests.","discussion":"","replyCount":0,"excerpt":"Frequentist Hypothesis Testing: In frequentist hypothesis testing, we begin with the null hypothesis (H0), which often represents no effect or no difference (e.g., “A is equivalent to B”). We assume H0 is true and gather data to see whether the observed evidence is sufficiently unlikely under H0. Our goal is not to prove H0​ true; rather, we want to see if w","words":549},{"id":"80229098","date":"2024-12-05","title":"Language is the original code for hacking reality","summary":"Language is the original code for hacking reality The world is composed of description, and meaning is only found in lan","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-80229098","body":"The world is composed of description, and meaning is only found in language.\n\nTo find the words that map to what we observe is a kind of alchemy.\n\nThe goal is not to turn the world into words. The goal is to get your words as close as you can to the materiality of the world you’re noticing.\n\nWriting isn't just a transcription of pre-f o":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-80204876","body":"It is the craft of thinking. The most durable of all skills.\n\nToday, philosophy is more relevant than ever—a growth industry in a world that demands higher-order reasoning. While science progresses incrementally, rarely upending its foundational frameworks, philosophy equips us to confront paradigm shifts and rethink our assumptions. As we face complex challenges and guide the choices of artificial intelligence, biotech, fusion energy development, quantum computing, economic democracy, education reform, and so on, philosophy offers the tools to ask and answer the toughest questions.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/14de356a-634b-4755-8d94-ba3eb6e9c41f_1100x500.heic)","discussion":"","replyCount":0,"excerpt":"It is the craft of thinking. The most durable of all skills. Today, philosophy is more relevant than ever—a growth industry in a world that demands higher-order reasoning. While science progresses incrementally, rarely upending its foundational frameworks, philosophy equips us to confront paradigm shifts and rethink our assumptions. As we face complex challe","words":86},{"id":"80204681","date":"2024-12-05","title":"There’s knowing how to use a tool, and then there’s knowing when to use a tool.","summary":"There’s knowing how to use a tool, and then there’s knowing when to use a tool.","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-80204681","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"80194258","date":"2024-12-05","title":"The mind spans many branches of history.","summary":"The mind spans many branches of history. It forces a consistency condition to give the impression there is one thread of","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-80194258","body":"The mind spans many branches of history. It forces a consistency condition to give the impression there is one thread of experience.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/a9b864b2-f733-4f99-9d3e-605849977b8d_1030x580.webp)","discussion":"","replyCount":0,"excerpt":"The mind spans many branches of history. It forces a consistency condition to give the impression there is one thread of experience. Attachments 1.","words":24},{"id":"80193505","date":"2024-12-05","title":"Time is irreducible.","summary":"Time is irreducible. We have to live the time. No jumping ahead. We can lack free will, but we can never predict what we","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-80193505","body":"Time is irreducible. We have to live the time. No jumping ahead. We can lack free will, but we can never predict what we are going to do.\n\nSo…I guess it all works out.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/c314e1e3-a573-4a0e-88f1-78aab3f27dec_440x150.gif)\n2. ![image](https://substack-post-media.s3.amazonaws.com/public/images/da5a2bbf-9e50-4b61-807a-f3e03a2a6d35_295x260.gif)","discussion":"","replyCount":0,"excerpt":"Time is irreducible. We have to live the time. No jumping ahead. We can lack free will, but we can never predict what we are going to do. So…I guess it all works out. Attachments 1. 2.","words":37},{"id":"80245840","date":"2024-12-05","title":"Capitalism needs an operating system update.","summary":"Capitalism needs an operating system update. Call it, Capitalism 6.0. As I see it, the three main concurrent issues are:","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-80245840","body":"Capitalism needs an operating system update. Call it, *Capitalism 6.0*. As I see it, the three main concurrent issues are: Crony capitalism, monopolies, and banks socializing losses and privatizing gains.\n\nWe need universal access to essential and affordable services, many of which can be provided efficiently through automation and modern infrastructure. These services should ensure a strong foundation for individuals and communities, including:\n\n- **An ultra-high-speed transportation system** to enhance efficiency and connectivity between rural communities and metropolitan hubs.\n- **One-year retraining programs** to support, e.g., workers displaced by industry shifts or technological advancements.\n- **Basic transportation** services are accessible to all.\n- **High-speed internet access** is essential for participation in the modern economy and society.\n- **Affordable, sustainable, and robust housing** to ensure citizens have a safe place to live.\n- **Basic nutritional food** to support the health and well-being of all living things.\n- **Basic healthcare**, guaranteeing access to essential medical services, potentially offered through a public option initiative alongside private alternatives, while also creating a game-saving relationship between insurance providers, healthcare professions, and pharmaceutical businesses around preventive care initiatives.\n- **Restore the unitary banking system **and run it alongside the existing network of private banks where loan officers, as public officials, have their remunerations tied to the performance of the loans they sanction, where some banks function as state banks and some operate a complementary currency system.\n- **Make alternative energy cheap**, such as fission, micropower, geothermal, tidal, CCUS, and ideally fusion and distributive solar.\nIn addition to these, forward-thinking policies should be enacted.\n\n- **Inject top teaching talent** into our public school systems, paying them well, and ensuring they are teaching critical thinking as a cornerstone of education to foster informed and engaged citizens.\n- **Provide incentives to convert existing businesses into worker-owned companies (e.g., ESOPs)**, particularly in industries dominated by monopolies that need to be broken up to encourage competition and innovation, and where the principles of economic democracy eventually lead to the development of Community Investment Trusts (CITs) for local economic development.\n- **Improved state and federal voting algorithms** into something more akin to Score Voting or STAR Voting.\nCapitalism must provide equal opportunity, not equal outcomes. If it does not provide equal opportunity, the design of it has failed. After all…capitalism is inescapability a political ideology and thus must work well for all hard-working citizens.","discussion":"","replyCount":0,"excerpt":"Capitalism needs an operating system update. Call it, Capitalism 6.0. As I see it, the three main concurrent issues are: Crony capitalism, monopolies, and banks socializing losses and privatizing gains. We need universal access to essential and affordable services, many of which can be provided efficiently through automation and modern infrastructure. These ","words":392},{"id":"80239952","date":"2024-12-05","title":"We should expect to receive rewards and benefits for using our skills and abilities according to the rules of…","summary":"We should expect to receive rewards and benefits for using our skills and abilities according to the rules of society. H","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-80239952","body":"We should expect to receive rewards and benefits for using our skills and abilities according to the rules of society. However, it seems misguided and arrogant to believe that we inherently deserve a society that highly values the specific qualities we possess.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/0f69c51e-680a-4b78-9add-9970126af383_1040x427.webp)","discussion":"","replyCount":0,"excerpt":"We should expect to receive rewards and benefits for using our skills and abilities according to the rules of society. However, it seems misguided and arrogant to believe that we inherently deserve a society that highly values the specific qualities we possess. Attachments 1.","words":44},{"id":"80198429","date":"2024-12-05","title":"Quality cannot exist without humanity, and dignity generates responsibility.","summary":"Quality cannot exist without humanity, and dignity generates responsibility. Human beings must be at the center of the w","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-80198429","body":"Quality cannot exist without humanity, and dignity generates responsibility. Human beings must be at the center of the work, and valued as the indivisible parts of the product that they are.","discussion":"","replyCount":0,"excerpt":"Quality cannot exist without humanity, and dignity generates responsibility. Human beings must be at the center of the work, and valued as the indivisible parts of the product that they are.","words":31},{"id":"80194221","date":"2024-12-05","title":"Climate scientists correctly identified the problem, but their solutions do not welcome growing countries…","summary":"Climate scientists correctly identified the problem, but their solutions do not welcome growing countries where people a","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-80194221","body":"Climate scientists correctly identified the problem, but their solutions do not welcome growing countries where people are simply trying to get out of poverty. \n\nAdditionally, the metrics are not personal. Here are some high-level ideas:\n\nWater/Food quality → GI health, nutritional status, hydration.\n\nAQI → Lung function, oxygen saturation, respiratory symptoms.\n\nEtc.","discussion":"","replyCount":0,"excerpt":"Climate scientists correctly identified the problem, but their solutions do not welcome growing countries where people are simply trying to get out of poverty. Additionally, the metrics are not personal. Here are some high-level ideas: Water/Food quality → GI health, nutritional status, hydration. AQI → Lung function, oxygen saturation, respiratory symptoms.","words":52},{"id":"80229775","date":"2024-12-05","title":"Works of art are rarely unique.","summary":"Works of art are rarely unique. What is unique is the style they embody.","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-80229775","body":"Works of art are rarely unique. What is unique is the style they embody.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/df0888d8-aa16-455b-9349-576dd49f7ffa_700x460.jpeg)","discussion":"","replyCount":0,"excerpt":"Works of art are rarely unique. What is unique is the style they embody. Attachments 1.","words":16},{"id":"78850964","date":"2024-11-25","title":"Some of what I think are the most important ideas in product development.","summary":"Some of what I think are the most important ideas in product development.","sourceCategory":"Product strategy and development","category":"Products & systems","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-78850964","body":"##### Attachments\n\n1. [Prioritizing Under Highl function inline(s){let x=escapeHtml(s);x=x.replace(/!\[([^\]]*)\]\((https?:\/\/[^)]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');x=x.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');x=x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(?<!\*)\*([^*\n]+)\*/g,'<em>$1</em>').replace(/_([^_\n]+)_/g,'<em>$1</em>');return x}
function md(s){if(!s)return"";return String(s).replace(/\r/g,"").split(/\n\s*\n/).map(b=>{const t=b.trim();if(!t)return"";const hm=t.match(/^(#{1,5})\s+([\s\S]*)$/);if(hm)return'<h'+hm[1].length+'>'+inline(hm[2])+'</h'+hm[1].length+'>';const ls=t.split("\n");if(ls.every(l=>/^[-*]\s+/.test(l)))return'<ul>'+ls.map(l=>'<li>'+inline(l.replace(/^[-*]\s+/,''))+'</li>').join('')+'</ul>';if(ls.every(l=>/^\d+\.\s+/.test(l)))return'<ol>'+ls.map(l=>'<li>'+inline(l.replace(/^\d+\.\s+/,''))+'</li>').join('')+'</ol>';if(/^>\s?/.test(t))return'<blockquote>'+inline(t.replace(/^>\s?/gm,'')).replace(/\n/g,'<br>')+'</blockquote>';return'<p>'+inline(t).replace(/\n/g,'<br>')+'</p>'}).join("")}

function cls(n){return n.words<18?"short":n.words>170?"long":n.words>65?"medium":""}
function cleanFeedText(s){let x=String(s||"");x=x.replace(/!\[([^\]]*)\]\((https?:\/\/[^)]+)\)/gi," $1 ");x=x.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/gi,(m,label)=>/^https?:\/\//i.test(label.trim())?"":" "+label+" ");x=x.replace(/https?:\/\/[^\s<>)\]]+/gi," ");x=x.replace(/\bAttachments?\b(?:\s+\d+\.?)+/gi," ");x=x.replace(/\bAttachments?\b/gi," ");x=x.replace(/\s+([,.;:!?])/g,"$1").replace(/\s+/g," ").trim();x=x.replace(/^[|·,:;\-–—\s]+|[|·,:;\-–—\s]+$/g,"").trim();return x}
function titleFromUrl(s){try{const u=new URL(String(s||""));let slug=u.pathname.split("/").filter(Boolean).pop()||u.hostname.replace(/^www\./,"");slug=decodeURIComponent(slug).replace(/\.[a-z0-9]{2,5}$/i,"").replace(/[-_]+/g," ").trim();return slug?slug.replace(/\b\w/g,m=>m.toUpperCase()):u.hostname.replace(/^www\./,"")}catch{return""}}
function feedTitle(n){for(const raw of [n.title,n.summary,n.excerpt]){const x=cleanFeedText(raw);if(x&&!/^note\s+\d+$/i.test(x)&&x.toLowerCase()!=="image")return x}const body=cleanFeedText(plainNoteText(n.body));if(body)return body.slice(0,180).trim();return titleFromUrl(n.title)||"Untitled note"}
function feedExcerpt(n,title){for(const raw of [n.excerpt,n.summary,plainNoteText(n.body)]){let x=cleanFeedText(raw);if(!x||/^note\s+\d+$/i.test(x)||x.toLowerCase()==="image")continue;if(title&&x.toLowerCase().startsWith(title.toLowerCase()))x=x.slice(title.length).replace(/^[\s:;,.–—-]+/,"").trim();if(x.length<4||/^(or|and|pen|marker)$/i.test(x))continue;return x.slice(0,420).trim()}return""}

const dlg=document.getElementById("dialog");function openNote(n){if(!n)return;document.getElementById("dcat").textContent=n.category;document.getElementById("ddate").textContent=n.date;document.getElementById("dtitle").textContent=n.title;document.getElementById("dbody").innerHTML=md(n.body);const rel=document.getElementById("relation");if(n.relation){rel.hidden=false;rel.innerHTML=escapeHtml(n.relation.label)+': <a href="'+n.relation.href+'">'+escapeHtml(n.relation.text)+' →</a>'}else rel.hidden=true;const disc=document.getElementById("discussion");disc.hidden=!n.discussion;document.getElementById("dcomments").innerHTML=n.discussion?md(n.discussion):"";dlg.showModal();history.replaceState(null,"","#note-"+n.id)}

function directNoteId(n,i){const raw=String(n.id||[n.date,n.title,i].join("-"));return raw.toLowerCase().replace(/[^a-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"")||("direct-"+i)}
function plainNoteText(s){return String(s||"").replace(/!\[[^\]]*\]\([^)]*\)/g," ").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/[*_#>`~-]/g," ").replace(/\s+/g," ").trim()}
function normalizeDirectNote(n,i){if(!n||typeof n!=="object"||!n.title||!n.date)return null;const body=String(n.body||"");const plain=plainNoteText(body);return {...n,id:directNoteId(n,i),date:String(n.date),title:String(n.title),summary:String(n.summary||n.title),sourceCategory:String(n.sourceCategory||"Direct"),category:String(n.category||"Uncategorized"),also:String(n.also||""),source:String(n.source||""),body,discussion:String(n.discussion||""),replyCount:Number(n.replyCount||0),excerpt:String(n.excerpt||plain.slice(0,360)||n.title),words:Number.isFinite(Number(n.words))?Number(n.words):(plain?plain.split(/\s+/).length:0)}}
async function loadNotes(){try{const r=await fetch("./direct-notes.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const direct=await r.json();if(!Array.isArray(direct))throw new Error("direct-notes.json must contain a JSON array");const byId=new Map(NOTES.map(n=>[String(n.id),n]));direct.map(normalizeDirectNote).filter(Boolean).forEach(n=>byId.set(String(n.id),n));NOTES=[...byId.values()].sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id)))}catch(err){console.error("Could not load direct Notes:",err)}const hid=location.hash.match(/^#note-([^#?]+)$/);if(hid){const n=NOTES.find(n=>String(n.id)===hid[1]);if(n)setTimeout(()=>openNote(n),0)}document.documentElement.dataset.notesTotal=String(NOTES.length);render()}
loadNotes();
</script></body></html>
