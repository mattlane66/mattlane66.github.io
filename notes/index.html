at a computer and crafting material. Instead, he focuses on jotting down single words or short phrases that spark ideas. These serve as triggers for on-stage improvisation. Writing is research/journaling, not preemptive/formal joke writing. Writing jokes offstage comes out “writer”.\n\nOn-Stage Development: Louis believes comedy is best developed in front of a live audience. He uses the stage as a laboratory, experimenting with ideas and refining them based on audience reactions. This iterative process allows him to discover what works and what doesn't.\n\nSelf-Reflection: Listening to recordings allows Louis to analyze his performance and identify areas where he can improve. He may notice pacing issues, repetitive jokes, or missed opportunities for audience engagement.\n\nMaterial Development: Sometimes, Louis will listen to recordings in search of material for future performances. He may stumble upon a joke or observation that he forgot about or didn't fully develop at the moment.\n\nOverall, Louis C.K.'s philosophy on comedy is that it's a living, breathing thing that evolves in the moment and never veers from its center as a spoken art (the process is unadulterated). He believes that the best comedy comes from a place of authenticity and connection and that the comedian's job is to be present and responsive to the audience.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/f5c6bcb1-74b8-47f2-bd1c-0f973e1e7bde_680x453.png)","discussion":"","replyCount":0,"excerpt":"Louis C.K. says that comedy is a spoken art and that the words should come from your speech center, not from writing them down. He explains that when you write jokes down, you're using your hand to write, your eyes to read, and then your mouth to say them, which disrupts the natural flow of the material. He believes that the best comedy comes from the moment","words":387},{"id":"82932288","date":"2024-12-24","title":"Criteria for a sound education:","summary":"Criteria for a sound education: Independent Inquiry and Creation: A good education fosters the ability to ask questions,","sourceCategory":"Learning, education, and curiosity","category":"Life & learning","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-82932288","body":"- **Independent Inquiry and Creation:** A good education fosters the ability to ask questions, think critically, and create new ideas without relying on external guidance.\n- **Resourcefulness:** It equips individuals with the knowledge and skills to find information, formulate questions, and pursue their learning paths.\n- **Critical Thinking:** A good education encourages questioning of established ideas and doctrines, promoting independent thought and the development of original perspectives.\n- **Lifelong Learning:** It cultivates a love of learning and a desire to continuously expand one's knowledge and understanding throughout life.\n- **Collaboration and Solidarity:** A good education emphasizes the importance of working with others, sharing knowledge, and building a community of learners.\nAnd this excellence reveals itself in a **clear intellect** and a **noble character**.\n\nTrade school/training programs can certainly benefit from those attributes while developing a specific durable skill remains the top priority.\n\n**Tweaks to the public curriculum could be more personalized and engaging:**\n\n1. **Mathematics**: Math classes should prioritize practical applications, ensuring students see how mathematical concepts connect to real-world problems and everyday life. By linking abstract theories to tangible outcomes, students develop both understanding and utility.\n2. **Writing**: Writing assignments should balance personal expression with technical skill-building. By crafting assignments that are relevant to students' lives and interests, educators can foster articulate, confident communicators who are adept at both creative and technical writing.\n3. **History**: History education should focus on teaching students how to research, analyze, and verify facts, rather than merely memorizing them. This emphasis on critical thinking and information literacy equips students to navigate and interpret the complexities of the modern world.\n4. **Science**: Science classes should nurture curiosity about the natural world while teaching the scientific method—how to test hypotheses and evaluate results. Personalized approaches can deepen engagement by connecting lessons to students’ interests and experiences.\n5. **Arts**: Every student should engage in an art form of their choosing—be it drawing, music, poetry, or literature. This practice develops creative skills, fosters self-expression, and cultivates discipline in the pursuit of taste-building.\n6. **Physical Education**: Beyond physical activity, students should learn about personal health, including preventive measures, longevity strategies, and safe practices to maintain and improve their well-being. This focus equips students with the knowledge to make informed choices about their health.\n7. **Collaboration Across Disciplines**: Every class should incorporate collaborative elements, teaching students how to interact constructively, build relationships, work in teams, and resolve conflicts. These skills are essential for developing emotional intelligence and preparing for personal and professional life.\nIt’s not just about “learning about” but about “becoming”/“thinking like”. \n\nWe don’t just learn about history but become historians. So on and so forth.","discussion":"","replyCount":0,"excerpt":"- Independent Inquiry and Creation: A good education fosters the ability to ask questions, think critically, and create new ideas without relying on external guidance. - Resourcefulness: It equips individuals with the knowledge and skills to find information, formulate questions, and pursue their learning paths. - Critical Thinking: A good education encourag","words":437},{"id":"82933386","date":"2024-12-24","title":"Rationality","summary":"Rationality What to safeguard: Empirical testing and peer reviews Checks and balances in power systems Fact-checking Adv","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-82933386","body":"What to safeguard:\n\n- Empirical testing and peer reviews\n- Checks and balances in power systems\n- Fact-checking\n- Adversarial proceedings\n- Freedom of inquiry and open debate\nHow to safeguard:\n\n- Acknowledge fallibility\n- Show work (don't rely on authority)\n- Avoid politicization\nWhy we fail:\n\n- Rather win versus learn\n- Depend only on our intuitions\n- Distrust rationality\n- Moral positions are fervently held beliefs and not empirical hypotheses","discussion":"","replyCount":0,"excerpt":"What to safeguard: - Empirical testing and peer reviews - Checks and balances in power systems - Fact-checking - Adversarial proceedings - Freedom of inquiry and open debate How to safeguard: - Acknowledge fallibility - Show work (don't rely on authority) - Avoid politicization Why we fail: - Rather win versus learn - Depend only on our intuitions - Distrust","words":72},{"id":"82923660","date":"2024-12-24","title":"Generating Ideas","summary":"Generating Ideas There’s no repeatable or universal method for exploiting the imagination. It comes when it comes. It’s","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-82923660","body":"There’s no repeatable or universal method for exploiting the imagination. It comes when it comes. It’s maddening.\n\nGenerally, the creative cycle has two parts: to take in new or existing knowledge and then let our minds do associative magic.\n\nBreaking monotony, or finding refuge in routine. Whatever you do, it’s all a test of fitting habits into form. Though, I suspect more than half the time you think something works…it’s likely a placebo, which is good enough and the best you can hope for.","discussion":"","replyCount":0,"excerpt":"There’s no repeatable or universal method for exploiting the imagination. It comes when it comes. It’s maddening. Generally, the creative cycle has two parts: to take in new or existing knowledge and then let our minds do associative magic. Breaking monotony, or finding refuge in routine. Whatever you do, it’s all a test of fitting habits into form. Though, ","words":84},{"id":"82879899","date":"2024-12-24","title":"Acting Beautifully","summary":"Acting Beautifully Harmony Perfection Finding Keeping Sincerity Seriousness Curiosity Certainty Resilience Fra","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-82879899","body":"Harmony \u003e Perfection \n\nFinding \u003e Keeping\n\nSincerity \u003e Seriousness\n\nCuriosity \u003e Certainty\n\nResilience \u003e Fragility\n\nAdaptability \u003e Rigidity\n\nHumility \u003e Pride\n\n[https://substack.com/@mattlane/note/c-82672828?r=ad6w7&utm_medium=ios&utm_source=notes-share-action](https://substack.com/@mattlane/note/c-82672828?r=ad6w7&utm_medium=ios&utm_source=notes-share-action)\n\n##### Attachments\n\n1. [We cannot set knowing the truth as the standard for choosing, or the standard among the models we can produce. These are often tricky endeavors—too tricky for mortals.](https://substack.com/@mattlane/note/c-82672828)","discussion":"","replyCount":0,"excerpt":"Harmony Perfection Finding Keeping Sincerity Seriousness Curiosity Certainty Resilience Fragility Adaptability Rigidity Humility Pride https://substack.com/@mattlane/note/c-82672828?r=ad6w7&utmmedium=ios&utmsource=notes-share-action Attachments 1. We cannot set knowing the truth as the standard for choosing, or the standard among the models we can produce. T","words":45},{"id":"82797324","date":"2024-12-23","title":"Similarities in delegating/prompting to both humans and AI systems","summary":"Similarities in delegating/prompting to both humans and AI systems People and models excel at understanding and respondi","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Science, emergence, and reality","source":"https://substack.com/@mattlane/note/c-82797324","body":"People and models excel at understanding and responding to succinct, clear instructions without the need for extensive guidance. Keep prompts simple and direct. Unfold as you go.\n\nSince people and models perform reasoning quite well, prompting either to \"think step by step\" is unnecessary. Avoid chain-of-thought prompts and instead, you (the human) must provide step-by-step adaptations as new information emerges.\n\nBy starting small, refining in steps (adding layers of specificity), preserving coherence (evaluating each time), and embracing emergence, we can expect better results. Delegation/prompting is not a one-shot-and-run kind of thing.","discussion":"","replyCount":0,"excerpt":"People and models excel at understanding and responding to succinct, clear instructions without the need for extensive guidance. Keep prompts simple and direct. Unfold as you go. Since people and models perform reasoning quite well, prompting either to \"think step by step\" is unnecessary. Avoid chain-of-thought prompts and instead, you (the human) must provi","words":91},{"id":"82718672","date":"2024-12-23","title":"There’s nothing scientific about collecting data and trying to make inductive generalizations from it.","summary":"There’s nothing scientific about collecting data and trying to make inductive generalizations from it. That gets us nowh","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-82718672","body":"There’s nothing scientific about collecting data and trying to make inductive generalizations from it. That gets us nowhere. You need to inquire about the world. Craft the questions worth uttering you expect will surface valuable data and insights from running experiments. Synthesize learnings into new knowledge about the phenomena observed in the world.\n\n[https://substack.com/@mattlane/note/c-80185822?r=ad6w7&utm_medium=ios&utm_source=notes-share-action](https://substack.com/@mattlane/note/c-80185822?r=ad6w7&utm_medium=ios&utm_source=notes-share-action)\n\n##### Attachments\n\n1. [Frequentist Hypothesis Testing:](https://substack.com/@mattlane/note/c-80185822)","discussion":"","replyCount":0,"excerpt":"There’s nothing scientific about collecting data and trying to make inductive generalizations from it. That gets us nowhere. You need to inquire about the world. Craft the questions worth uttering you expect will surface valuable data and insights from running experiments. Synthesize learnings into new knowledge about the phenomena observed in the world. htt","words":59},{"id":"82778057","date":"2024-12-23","title":"Expertise.","summary":"Expertise.","sourceCategory":"Learning, education, and curiosity","category":"Life & learning","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-82778057","body":"##### Attachments\n\n1. [Wisdom doesn’t come from experience. It comes from reflecting on experience.](https://substack.com/@adamgrant/note/c-80333021)","discussion":"","replyCount":0,"excerpt":"Attachments 1. Wisdom doesn’t come from experience. It comes from reflecting on experience.","words":13},{"id":"82830574","date":"2024-12-23","title":"Many decisions are made unconsciously (see Benjamin Libet’s experiment).","summary":"Many decisions are made unconsciously (see Benjamin Libet’s experiment). Many things are happening that are just not acc","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-82830574","body":"Many decisions are made unconsciously (see Benjamin Libet’s experiment). Many things are happening that are just not accessible to consciousness. Why should they be?\n\nThat’s why we have art, literature, poetry, music, and so on. To say that which can’t easily be said.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/16fe5b67-8368-4dbf-a1f3-e3091fc53b95_632x281.heic)","discussion":"","replyCount":0,"excerpt":"Many decisions are made unconsciously (see Benjamin Libet’s experiment). Many things are happening that are just not accessible to consciousness. Why should they be? That’s why we have art, literature, poetry, music, and so on. To say that which can’t easily be said. Attachments 1.","words":45},{"id":"82672828","date":"2024-12-22","title":"We cannot set knowing the truth as the standard for choosing, or the standard among the models we can produce.","summary":"We cannot set knowing the truth as the standard for choosing, or the standard among the models we can produce. These are","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-82672828","body":"We cannot set knowing the truth as the standard for *choosing*, or the standard among the *models* we can produce. These are often tricky endeavors—too tricky for mortals.\n\nHow do we recognize “the true enough”?\n\nThe final call is aesthetic.\n\nFor humans, those things are easier to discern.\n\nDeveloping taste is a skill. To notice the subtle and ineffable. To know what needs to be obvious and what doesn’t. To know what to ignore and what to pay attention to.\n\nThere is a consistent, observable pattern in how nature unfolds, even without any conscious planning or decision-making.\n\nTrees follow certain natural processes—seeds germinate, roots extend, trunks form, branches reach for sunlight, and leaves emerge when conditions allow.\n\nRivers follow the pull of gravity—water flows from higher to lower ground, meandering around obstacles and carving paths through landscapes.\n\nSeasons occur due to the Earth’s tilt and orbit—it’s a regular, cyclical shift in climate and daylight that repeats year after year.\n\nNone of these phenomena “decide” or “choose.” They happen because of underlying structures and observable regularities in the way things behave—physical, chemical, and biological. There is this spontaneous, self-organizing aspect to the universe.\n\nBeauty is the underlying *pattern *that’s so of itself. Kant calls this a harmonious play, a dance of our senses with our understanding. We just need to cultivate our taste and character to experience it.\n\nThe intense concentration of a selection and the planning process should push away unnecessary thoughts. The meditative state of relaxed attention unites us with our environment. We can truly take in what is here and now, and experience its beauty deep in our hearts.\n\nAppreciation for beauty is universal, and good taste can connect us.\n\nSet the compass toward beauty. Life follows as a natural consequence.\n\nIt leads us to truth and goodness.\n\n\u003e **Beauty was not simply something to behold; it was something one could do.**\n\u003e \n\u003e — Toni Morrison, The Bluest Eye (1970)\n\n[https://substack.com/@mattlane/note/c-84306761](https://substack.com/@mattlane/note/c-84306761)\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/94dd6062-d5ee-451c-ad1b-51c89b59ba74_500x260.heic)\n2. [Research in neuroscience (Zeki, 1999) shows that the brain responds more positively to patterns and structures reflecting the Golden Ratio.](https://substack.com/@mattlane/note/c-84306761)","discussion":"","replyCount":0,"excerpt":"We cannot set knowing the truth as the standard for choosing, or the standard among the models we can produce. These are often tricky endeavors—too tricky for mortals. How do we recognize “the true enough”? The final call is aesthetic. For humans, those things are easier to discern. Developing taste is a skill. To notice the subtle and ineffable. To know wha","words":344},{"id":"82693009","date":"2024-12-22","title":"If only all research papers were written like this…","summary":"If only all research papers were written like this one:","sourceCategory":"References, images, and found objects","category":"Life & learning","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-82693009","body":"If only all research papers were written like this one: [https://www.chm.bris.ac.uk/sillymolecules/birds.pdf](https://www.chm.bris.ac.uk/sillymolecules/birds.pdf)\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/67883f4f-5db6-4c0f-bede-0d0293e91698_320x180.gif)","discussion":"","replyCount":0,"excerpt":"If only all research papers were written like this one: https://www.chm.bris.ac.uk/sillymolecules/birds.pdf Attachments 1.","words":13},{"id":"82461837","date":"2024-12-20","title":"Conceptual Design Background:","summary":"Conceptual Design Background: A Bundle of Conceptual Software Design Tools For Collaborative Problem Solving: Prioritizi","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-82461837","body":"[https://substack.com/@mattlane/note/c-89315279](https://substack.com/@mattlane/note/c-89315279)\n\n**A Bundle of Conceptual Software Design Tools For Collaborative Problem Solving:**\n\n**Prioritizing: **[https://substack.com/@mattlane/note/c-82300617](https://substack.com/@mattlane/note/c-82300617)\n\n**Path-finding: **[https://substack.com/@mattlane/note/c-82452179](https://substack.com/@mattlane/note/c-82452179)\n\n**Writing: **[https://substack.com/@mattlane/note/c-83080441?r=ad6w7&utm_medium=ios&utm_source=notes-share-action](https://substack.com/@mattlane/note/c-83080441?r=ad6w7&utm_medium=ios&utm_source=notes-share-action)\n\n**Affordance Mapping: **[https://substack.com/@mattlane/note/c-82451399](https://substack.com/@mattlane/note/c-82451399)\n\n**Focal Sketching: **[https://substack.com/@mattlane/note/c-82451632](https://substack.com/@mattlane/note/c-82451632)\n\n**Packaging: **[https://substack.com/@mattlane/note/c-82928716](https://substack.com/@mattlane/note/c-82928716)\n\n**Tracking: **[https://substack.com/profile/17411623-matt-lane/note/c-80200926](https://substack.com/profile/17411623-matt-lane/note/c-80200926)\n\n**Additional Topics:**\n\n**Interplay Model: **[https://substack.com/@mattlane/note/c-89034495](https://substack.com/@mattlane/note/c-89034495)\n\n**Appetites: **[https://substack.com/@mattlane/note/c-88166226](https://substack.com/@mattlane/note/c-88166226)\n\n**Blue Ocean Strategy (High-level Design): **[https://substack.com/@mattlane/note/c-86447328](https://substack.com/@mattlane/note/c-86447328)\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/51a0e5be-8bcc-4cf6-b9bc-9dd96ba2bd76_4150x963.png)","discussion":"","replyCount":0,"excerpt":"https://substack.com/@mattlane/note/c-89315279 A Bundle of Conceptual Software Design Tools For Collaborative Problem Solving: Prioritizing: https://substack.com/@mattlane/note/c-82300617 Path-finding: https://substack.com/@mattlane/note/c-82452179 Writing: https://substack.com/@mattlane/note/c-83080441?r=ad6w7&utmmedium=ios&utmsource=notes-share-action Affo","words":43},{"id":"82451632","date":"2024-12-20","title":"Focal Sketches","summary":"Focal Sketches Arrangement of elements in a two-dimensional space: Fat marker sketch at large scale = Fine marker sketch","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-82451632","body":"Arrangement of elements in a two-dimensional space: Fat marker sketch at large scale = Fine marker sketch at small scale. These annotated focal sketches can be arranged along a flow or be more targeted to a specific page/screen/place (on a lightweight annotated affordance map). This tool is critical when we need to communicate an idea when words can’t, since words can be too abstract, and we do not want to waste time on wireframes or unnecessary fidelity. This also helps you avoid the weight of a Figma spec while providing direction for developers and designers to implement together.\n\nWhen you draw something, you are forced to be specific, at least with what needs to be obvious and what doesn’t—the key centers of the action space.\n\nI recommend getting an iPad Pro and Apple Pencil Pro.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/b60d22f6-e90c-4167-bfba-ff00c1653ba4_1635x1375.heic)","discussion":"**2D Arrangement (Fat Marker Sketches)**\n\n**Key Idea:** Create rapid spatial layouts (big marker drawings, focal sketches) to clarify essential elements and their placement.\n\n- **Decomposition:**\n  \n    - Segments the design surface into distinct regions (header, footer, sidebars, focal zones).\n    - Forces you to decide *what* belongs *where* in broad strokes.\n- **Abstraction:**\n  \n    - Large-scale sketches avoid detail; they capture the *essence* of placement rather than exact UI design.\n    - Keeps your attention on main structures and user flow, not pixel-level tweaks (what needs to be obvious).\n- **Pattern Recognition:**\n  \n    - Lining up multiple targeted sketches regarding one screen side by side helps you *see repeated layout patterns* or common user interface “hotspots.”\n    - Shared visual structures become clearer (e.g., a consistent top menu across sketches).\n- **Algorithm/Procedure:**\n  \n    - While not a code-like algorithm, these sketches **inform** user flow or design steps.\n    - They can evolve into a *sequence of screens* or states once you clarify how elements interact.","replyCount":0,"excerpt":"Arrangement of elements in a two-dimensional space: Fat marker sketch at large scale = Fine marker sketch at small scale. These annotated focal sketches can be arranged along a flow or be more targeted to a specific page/screen/place (on a lightweight annotated affordance map). This tool is critical when we need to communicate an idea when words can’t, since","words":137},{"id":"82451399","date":"2024-12-20","title":"Interaction Schematics","summary":"Interaction Schematics Lightweight text-based notation connects interface screens/pages/states with listed affordances (","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-82451399","body":"Lightweight text-based notation connects interface screens/pages/states with listed affordances (\"affordances” are the parts of the interface that users can interact with, such as buttons, fields, and other interactive elements) in each so you can quickly see the macro relationships before worrying about how affordances and other elements must be placed in the interface. Screens/states are places you get to always via some affordance.\n\nAn Interaction Schematic is a UI shorthand that distinguishes between affordances in the interface and actions in the code. Because the columns show the interface endpoints, the arrow labels are available exclusively to explain what happens between what the users see. Additionally, you can also switch to the system language. We can do this below the captured affordances to call out technical complexities under the surface of the design to find time bombs and get a bit more precise about the circuit.\n\nWiring up affordances and places/screens this way early on communicates critical interaction patterns at the right level of abstraction. With a detailed flow (e.g., a Figma file), we just see boxes. When we zoom in, we see a lot of detail, but only about one place. With an Interaction Schematic, we can see all the parts and how they are connected, and easily iterate our way to the right circuit.\n\nYou can use digital sticky notes with connection lines in an online collaborative whiteboard. You can use one color for screens/states (orange), another for affordances (yellow), and one more for system language (red).\n\nTwo Advanced Techniques:\n\nPartials: Sometimes there are too many affordances to list under a single screen. When you need to list all the affordances on a screen, indicate that the same affordances repeat in each row, or distinguish the affordances for navigation from the topic row affordances, prepend the _affordance with an underscore (“_”).\n\nA solid line to separate alternate actions: For example, there's only one login screen, but there are multiple possible actions (affordances) on that screen. The line appears above each additional affordance. Think of it as \"or\". When there are multiple actions, the arrows point from an action to a new screen.\n\n**A NOTE ON SYSTEM LANGUAGE:**\n\n**Definition:** System Language is the internal vocabulary, logic, and structural naming used in a product’s implementation—how things are defined, composed, and rendered in the codebase or design system. Unlike user-facing text, System Language reflects the real architecture beneath the surface. It’s the raw material of product construction.\n\n**Purpose:** Using System Language during early-stage work, like shaping or framing, anchors abstract ideas in technical reality. It helps teams uncover hidden complexity, validate assumptions, and spot potential risks before metastasizing into late-breaking surprises or costly refactors. Let devs in a shaping session know they own those red cards for any given screen/state.\n\n**How It’s Used:**\n\n- **Affordance-to-implementation mapping:** For any new UI element or interaction, ask: *What does this correspond to in the current system?* Is it a known component, a new variant, or a fresh path in the logic?\n\n    - For example:\n\n          - UI affordance: “Tap to Pay”\n          - System Language: `initiateApplePaySession(amount, breakdown, metadata)`\n- **Probing for hidden complexity:** Use implementation-oriented questions to surface edge cases and integration risks. As questions like:\n\n    - *How is this condition defined in code?*\n    - *What data structures or states are involved?*\n    - *Does this hook into existing flows or create new logic branches?*\n- **Clarifying types of unknowns:** Distinguish between:\n\n    - Questions you can answer in the room (e.g., by reading source or scanning schemas)\n    - Questions that require follow-up (e.g., spiking, pairing, deeper investigation)\n- **Moving beyond yes/no feasibility:** The goal isn't just to ask *“Can we build this?”* but to arrive at a partial diagnosis: What’s known, what’s murky, and what needs work? Even rough findings inform better decisions than blind optimism.\n**Why It Matters:** Bringing System Language into early discussions gives product, design, and engineering teams shared traction. It prevents wishful thinking, exposes integration risks early, and builds shared understanding of cost and structure, not just possibility. By grounding creative ideas in technical truth, teams shape work that’s not only ambitious but also executable.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/1162acf0-fd5a-46cb-ae9f-46ff9ea300a4_4096x1346.jpeg)\n2. ![image](https://substack-post-media.s3.amazonaws.com/public/images/d985ec8c-e6d2-4ce2-a145-abcb5d108eb7_1915x1151.heic)\n3. ![image](https://substack-post-media.s3.amazonaws.com/public/images/a5d02634-f923-4881-9533-0b6e2bc77134_2477x1042.jpeg)\n4. ![image](https://substack-post-media.s3.amazonaws.com/public/images/25aade2c-de2b-47ca-8255-d1356379f43e_1577x1093.png)\n5. ![image](https://substack-post-media.s3.amazonaws.com/public/images/253c3f46-6de1-4e75-bac2-9ce2b932fe20_2566x1232.jpeg)\n6. ![image](https://substack-post-media.s3.amazonaws.com/public/images/c2a7e304-5231-4f08-afb6-d55368a60747_1970x1908.png)","discussion":"**Lightweight Text-Based Notation (Interaction Schematics)**\n\n**Key Idea:** Use a simple, text-oriented diagram of screens/pages/places along with lists of possible user actions (“affordances”) to show macro-level relationships.\n\n- **Decomposition:**\n  \n    - Breaks the interface or system into discrete “screens” (or states) and the *affordances* (actions) available on each.\n    - Separates what the user sees (screen) from what the user can do (interaction options).\n- **Abstraction:**\n  \n    - Avoids details of visual design or pixel-perfect layout; focuses on the *structure* of interactions.\n    - Stays high-level, clarifying who does what and in which order, without over-specifying the interface.\n- **Pattern Recognition:**\n  \n    - By mapping out screens and actions, you can *spot common flows* (e.g., “Most user journeys go from Screen A → B → C”).\n    - Repeated or bottleneck interactions often stand out.\n- **Algorithm/Procedure:**\n  \n    - Can lead to a formal **state machine** if you detail the transitions and conditions between screens.\n    - Helps you define the logic of how users move through the system.","replyCount":0,"excerpt":"Lightweight text-based notation connects interface screens/pages/states with listed affordances (\"affordances” are the parts of the interface that users can interact with, such as buttons, fields, and other interactive elements) in each so you can quickly see the macro relationships before worrying about how affordances and other elements must be placed in t","words":688},{"id":"82389527","date":"2024-12-20","title":"Generative Design Writing","summary":"Generative Design Writing Describing relationships provides latitude for interpretation and innovation. Specifying relat","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-82389527","body":"Describing relationships provides latitude for interpretation and innovation.\n\nSpecifying relationships also sets boundaries and helps prioritize elements (around the *centers*) inside the project.\n\nFocusing on the relationships between elements, rather than rigidly defining their forms from the outset, leads to more adaptable, creative, and ultimately more successful designs.\n\nBelow is an example of the Spotify app and how it is today versus how it could be tomorrow should there have been a more generative approach to design.\n\n**Approach 1: Form-Focused/Prescriptive (Current Spotify-like System)**\n\n1. **Collect User Data:** Track explicit \"likes,\" saved songs, followed artists, and completed playlists. Also track implicit data like play counts, skip rates, and listening time.\n2. **Genre Classification:** Categorize songs into predefined genres and sub-genres using metadata and audio analysis.\n3. **Similarity Calculation:** Calculate song similarity based on genre, tempo, key, and other audio features.\n4. **Recommendation Generation:**\n\n    - **Collaborative Filtering:** Recommend songs liked by users with similar tastes (based on likes and listening history).\n    - **Content-Based Filtering:** Recommend songs similar to those the user has liked or listened to frequently.\n5. **Playlist Creation:** Generate personalized playlists based on genre, mood, or activity (e.g., \"Daily Mix,\" \"Discover Weekly\").\n6. **Presentation:** Display recommendations as lists of songs or albums with album art, ordered by relevance or popularity.\n**Key Characteristics of Approach 1:**\n\n- **Static Preferences:** Relies on fixed signals like \"likes\" and past listening history.\n- **Genre-Centric:** Heavily emphasizes genre classifications, which can be limiting.\n- **One-Size-Fits-All Algorithms:** Uses general-purpose algorithms that don't fully capture individual nuances.\n- **Limited Adaptability:** Struggles to adapt to evolving tastes and moods.\n**Approach 2: Generative/Relationship-Focused (Proposed System with Dynamic Preferences)**\n\n1. **Collect User Data:** In addition to the data collected in Approach 1, track:\n\n    - **Dynamic Preference Signals:** Implement \"more/less\" buttons or sliders with decay factors to capture changes in desired play frequency.\n    - **Contextual Data:** Gather information about the user's context (time of day, location, activity) to understand the situational relevance of music.\n    - **Emotional Response Data (Optional):** Explore using biofeedback (via, e.g., an Apple Watch) or other methods to infer emotional responses to music.\n2. **Relationship Modeling:**\n\n    - **Dynamic Preference Modeling:** Model how user preferences change over time based on the \"more/less\" signals and decay.\n    - **Contextual Relationship Modeling:** Model the relationship between context and music preference.\n    - **Emotional Relationship Modeling (Optional):** Model the relationship between music features and emotional responses.\n3. **Recommendation Generation:**\n\n    - **Dynamic Preference-Based Recommendations:** Prioritize songs that align with the user's current desired direction of change in listening habits.\n    - **Context-Aware Recommendations:** Recommend music that is appropriate for the user's current context.\n    - **Mood-Based Recommendations (Optional):** Recommend music that evokes desired emotional responses.\n4. **Adaptive Playlist Creation:** Generate playlists that adapt to the user's changing preferences and context. The playlists themselves could even have \"more/less\" controls.\n5. **Interactive Presentation:** Present recommendations more interactively and dynamically, perhaps using visualizations to represent mood, energy, or other relevant factors.\n**Key Characteristics of Approach 2:**\n\n- **Dynamic Preferences:** Uses dynamic signals to capture evolving tastes and moods.\n- **Relationship-Centric:** Focuses on the relationships between music, user context, and desired listening experiences.\n- **Personalized Algorithms:** Uses more sophisticated algorithms that adapt to individual user behavior.\n- **High Adaptability:** Easily adapts to changing tastes, moods, and contexts.\nShifting from static \"likes\" to dynamic \"more/less\" signals with decay is a perfect example of \"Specify Relationships Over Forms.\" It shifts the focus from the *form* of a fixed preference to the *relationship* between current and desired future listening behavior, leading to a more adaptive and personalized music recommendation experience. This directly addresses the UX problem of algorithmic ruts by capturing the dynamic nature of human taste and creating life (emergence and adjacent possible niches) in design.\n\nFor more on this kind of writing:\n\n[https://prodsense.substack.com/p/schematic-writing?utm_source=profile&utm_medium=reader2](https://prodsense.substack.com/p/schematic-writing?utm_source=profile&utm_medium=reader2)\n\n[https://prodsense.substack.com/p/designing-generative-systems?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true](https://prodsense.substack.com/p/designing-generative-systems?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true)\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/898ddba8-5aca-422e-89ae-f1de860baef1_1383x619.heic)","discussion":"","replyCount":0,"excerpt":"Describing relationships provides latitude for interpretation and innovation. Specifying relationships also sets boundaries and helps prioritize elements (around the centers) inside the project. Focusing on the relationships between elements, rather than rigidly defining their forms from the outset, leads to more adaptable, creative, and ultimately more succ","words":624},{"id":"82455544","date":"2024-12-20","title":"Parkinson's Law extends beyond time.","summary":"Parkinson&x27;s Law extends beyond time.","sourceCategory":"Work, collaboration, and organizations","category":"Products & systems","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-82455544","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"82452179","date":"2024-12-20","title":"Pathfinding (Fit Check)","summary":"Pathfinding (Fit Check) Sometimes when we don&x27;t know how to go forward in the solution space, we can use a counterintuit","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-82452179","body":"Sometimes when we don't know how to go forward in the solution space, we can use a counterintuitive technique. It can be easier to come up with three or more ways to do something instead of just one way. That's because when we make room for many options we can allow ourselves a bad option. Articulating what doesn't work can spark new and reframed ideas simply by contrast.\n\nWe like seeing edges in our ideas next to each other that are different. That helps to improve our thinking. Also, design is never about one thing, it is about many things.\n\nIn the possible paths *P x C* tool, the rows are the criteria (C), the columns are the paths/approaches (P), and the cells are the aspects (A). We also want to include a succinct description of the problem/decision being taken.\n\nExample here: [https://docs.google.com/spreadsheets/d/1IA_AJdzIuSW7h8peUoGeWoGGTJVIjQYFu3lDZCPzWVA/edit?usp=sharing](https://docs.google.com/spreadsheets/d/1IA_AJdzIuSW7h8peUoGeWoGGTJVIjQYFu3lDZCPzWVA/edit?usp=sharing)\n\nTemplate here: [https://docs.google.com/spreadsheets/d/1JN3w7E8f12TYmc836eXGvTY0UPrnuwFc3dVueBWcgtc/edit?usp=sharing](https://docs.google.com/spreadsheets/d/1JN3w7E8f12TYmc836eXGvTY0UPrnuwFc3dVueBWcgtc/edit?usp=sharing)","discussion":"**Multiple Solutions (P × C Tool)**\n\n**Key Idea:** Generate three or more solution paths and compare them across a set of criteria (Paths × Criteria) to expose trade-offs and spark fresh thinking.\n\n- **Decomposition:**\n  \n    - Splits the problem space into *criteria* (rows) and *possible solutions* (columns).\n    - Makes it easier to evaluate each solution’s strengths and weaknesses in smaller, comparable parts.\n- **Abstraction:**\n  \n    - Focuses on high-level “criteria” such as user value, cost, complexity, or feasibility rather than diving into detailed specs.\n    - Maintains a conceptual overview that helps avoid getting lost in too many specifics too early.\n- **Pattern Recognition:**\n  \n    - Seeing multiple approaches side by side highlights *recurring themes*—e.g., common shortfalls or repeated benefits.\n    - Identifies which criteria consistently prove most challenging or most beneficial across solutions.\n- **Algorithm/Procedure:**\n  \n    - Often involves a **scoring or selection** procedure (e.g., weighting criteria, ranking solutions via color coding).\n    - Provides a systematic method for making decisions on which path to pursue or refine further.","replyCount":0,"excerpt":"Sometimes when we don't know how to go forward in the solution space, we can use a counterintuitive technique. It can be easier to come up with three or more ways to do something instead of just one way. That's because when we make room for many options we can allow ourselves a bad option. Articulating what doesn't work can spark new and reframed ideas simpl","words":146},{"id":"82423460","date":"2024-12-20","title":"Types of bad anecdotal data:","summary":"Types of bad anecdotal data: Compliments (usually mistaken for commitment). Fluff (generics, hypotheticals, and the futu","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Science, emergence, and reality","source":"https://substack.com/@mattlane/note/c-82423460","body":"- Compliments (usually mistaken for commitment).\n- Fluff (generics, hypotheticals, and the future).\n- Generic claims (“I usually”, “I always”, “I never”).\n- Future-tense promises (“I would, “I will”).\n- Hypothetical maybes (“I might”, “I could”).\nGo deep and ask story-based (space and time) causal questions to avoid the left-brain interpreter effect.\n\n[https://people.psych.ucsb.edu/gazzaniga/PDF/Hemispheric%20differences%20in%20mnemonic%20processing.%20The%20effects%20of%20left%20hemisphere%20interpretation%20(1992).pdf](https://people.psych.ucsb.edu/gazzaniga/PDF/Hemispheric%20differences%20in%20mnemonic%20processing.%20The%20effects%20of%20left%20hemisphere%20interpretation%20(1992).pdf)","discussion":"","replyCount":0,"excerpt":"- Compliments (usually mistaken for commitment). - Fluff (generics, hypotheticals, and the future). - Generic claims (“I usually”, “I always”, “I never”). - Future-tense promises (“I would, “I will”). - Hypothetical maybes (“I might”, “I could”). Go deep and ask story-based (space and time) causal questions to avoid the left-brain interpreter effect. https:/","words":53},{"id":"82400423","date":"2024-12-20","title":"Use examples as metaphors.","summary":"Use examples as metaphors. Then, apply those metaphors to your situation.","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-82400423","body":"Use examples as metaphors. Then, apply those metaphors to your situation.","discussion":"","replyCount":0,"excerpt":"Use examples as metaphors. Then, apply those metaphors to your situation.","words":11},{"id":"82423738","date":"2024-12-20","title":"A belief should be understood as a self-limiting function.","summary":"A belief should be understood as a self-limiting function. That&x27;s my belief.","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Science, emergence, and reality","source":"https://substack.com/@mattlane/note/c-82423738","body":"That's my belief.\n\n[https://journals.sagepub.com/doi/10.1177/17456916221148147](https://journals.sagepub.com/doi/10.1177/17456916221148147)","discussion":"","replyCount":0,"excerpt":"That's my belief. https://journals.sagepub.com/doi/10.1177/17456916221148147","words":4},{"id":"82423979","date":"2024-12-20","title":"Your gut is a source of intuition to tap into and hone through experience.","summary":"Your gut is a source of intuition to tap into and hone through experience. Nerve ganglia represent an important evolutio","sourceCategory":"Science, emergence, and reality","category":"AI & future work","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-82423979","body":"Your gut is a source of intuition to tap into and hone through experience. Nerve ganglia represent an important evolutionary step - serving as simple but effective centers for managing basic physiological responses like moving towards, e.g., food, or away from potential harm.\n\nInaction is irreversible.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/f687d770-f62d-4422-ad19-253d336f528a_1351x1031.heic)","discussion":"","replyCount":0,"excerpt":"Your gut is a source of intuition to tap into and hone through experience. Nerve ganglia represent an important evolutionary step - serving as simple but effective centers for managing basic physiological responses like moving towards, e.g., food, or away from potential harm. Inaction is irreversible. Attachments 1.","words":48},{"id":"82416013","date":"2024-12-20","title":"You can hit the ground sooner than you usually think you can.","summary":"You can hit the ground sooner than you usually think you can.","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-82416013","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"82401522","date":"2024-12-20","title":"Do what you hate not doing, do what scares you, and ignore goals unless they change your present behavior.","summary":"Do what you hate not doing, do what scares you, and ignore goals unless they change your present behavior.","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Work, collaboration, and organizations","source":"https://substack.com/@mattlane/note/c-82401522","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"82300617","date":"2024-12-19","title":"PRIORITIZING PRODUCTS/FEATURES: HOW-TOS","summary":"PRIORITIZING PRODUCTS/FEATURES: HOW-TOS A learning goal or research question starts by asking: What are people already d","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-82300617","body":"A learning goal or research question starts by asking: *What are people already doing that we want to better understand?* It’s not about what we think they need, but about deepening our curiosity around their current behavior and approach.\n\n**First, get into the physics of a business opportunity and frame it up. You should ask people in your ideal customer segment (and sometimes yourself if the motivation is internal):**\n\n1. When did you buy/start using Path X?\n2. When did you have the first thought that you might need something like Path X?\n3. What were you doing in that period before adopting Path X?\n4. Why did you not just continue with what you were doing before but instead adopt Path X, (*especially if there was a time elapsed between the thought of the struggle and the adoption of Path X*)?\n5. What is bad about that (what you were doing before)?\n6. Before you used/bought Path X, what were you picturing would be different after you used/bought Path X?\n**What we ask ourselves:**\n\n- Does this address a high-level focus area/theme of the business? If not, why do this now?\n- Do we feel comfortable, or do we feel uncomfortable, about shaping this framed opportunity?\nThis step is critical because it helps us falsify—it helps us to find out **what to say no to**, not by describing the *good* that will happen by solving xyz problems/opportunities but **by knowing what goes wrong when we *****don't***** do something** about xyz problems/opportunities.\n\n**We ask the following questions when we are trying to decide which shaped solutions to select next:**\n\n- Does this problem/opportunity still matter?\n- Does the time budget feel right?\n- Is the solution attractive/does it satisfy the key criteria laid out when shaping (does it address its fitness function well, i.e., when the current outcome improves, then the solution works.)?\n- Are the right people available?\n- Can we deliberately allocate talent to this project for the time we want to spend on it without dragging them into too much unplanned/reactive work?\n**For more on this:**\n\n[https://prodsense.substack.com/p/prioritizing-under-highly-variable?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true](https://prodsense.substack.com/p/prioritizing-under-highly-variable?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true)\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/a321c730-54ba-464b-898e-b28dccc72bf2_1118x1449.png)\n2. [Prioritizing Under Highly Variable Conditions](https://prodsense.substack.com/p/prioritizing-under-highly-variable)","discussion":"**Prioritizing Products/Features (Business and Customer Alignment)**\n\n**Key Idea:** Dig into user context, business goals, and feasibility to filter and shape product ideas.\n\n- **Decomposition:**\n  \n    - Breaks large opportunities (needs, unrealized needs, and desires) into smaller sub-systems, e.g., a set of specific struggling moments.\n    - Separates strategic themes from individual features, clarifying what the business is solving for while addressing the customer strategy.\n- **Abstraction:**\n  \n    - Focuses on *why* a decision matters and whether it aligns with broader business goals, not on the final, detailed solution.\n    - Frames the problem at a conceptual level first (“What is the specific pain for the user and when does it occur?”).\n- **Pattern Recognition:**\n  \n    - Over multiple interviews or product discussions, you start to see **repeated user motivations** or obstacles that fit under a single theme.\n    - Recurring reasons users adopt or abandon solutions become clearer.\n- **Algorithm/Procedure:**\n  \n    - Often integrated into a *sequencing* approach: “If it doesn’t solve a major user issue, set it aside.”\n    - This ensures a consistent, methodical approach to deciding what gets shaped and built next.","replyCount":0,"excerpt":"A learning goal or research question starts by asking: What are people already doing that we want to better understand? It’s not about what we think they need, but about deepening our curiosity around their current behavior and approach. First, get into the physics of a business opportunity and frame it up. You should ask people in your ideal customer segmen","words":358},{"id":"82298182","date":"2024-12-19","title":"The bicycle is a perfect blend of form and function, evolving into a living structure that adapts to human…","summary":"The bicycle is a perfect blend of form and function, evolving into a living structure that adapts to human needs. It sea","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-82298182","body":"The bicycle is a perfect blend of form and function, evolving into a living structure that adapts to human needs. It seamlessly connects us to nature, offers an intimate relationship between rider and machine, and empowers freedom while maintaining ecological harmony.\n\nAnother amazing thing about bikes is that reducing effort drastically doesn’t slow you down much because of the exponential relationship between speed and energy. Drag increases with the square of the speed, meaning higher speeds demand exponentially more effort. At full effort, the person is riding faster, but the energy consumption is disproportionately higher due to drag.\n\nYou can chill while getting from A to B, and quickly.\n\nIt is one of our greatest achievements in systems design.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/98cd04ac-dbc7-4ee5-9a8e-d27a55c456f3_2159x1309.heic)\n2. ![image](https://substack-post-media.s3.amazonaws.com/public/images/50600722-8007-4cb8-b58f-20116dedecfd_770x513.jpeg)","discussion":"","replyCount":0,"excerpt":"The bicycle is a perfect blend of form and function, evolving into a living structure that adapts to human needs. It seamlessly connects us to nature, offers an intimate relationship between rider and machine, and empowers freedom while maintaining ecological harmony. Another amazing thing about bikes is that reducing effort drastically doesn’t slow you down","words":122},{"id":"82247330","date":"2024-12-19","title":"Historically, tools have expanded human capabilities, but there’s always a trade-off—convenience can erode…","summary":"Historically, tools have expanded human capabilities, but there’s always a trade-off—convenience can erode critical skil","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Science, emergence, and reality","source":"https://substack.com/@mattlane/note/c-82247330","body":"Historically, tools have expanded human capabilities, but there’s always a trade-off—convenience can erode critical skills. The stakes become higher when the tool isn’t just assisting but replacing foundational human experiences like decision-making.\n\nIt begs the question: *What is the value of imperfection?* Decision-making isn’t just about outcomes but also about the process, which builds resilience, empathy, and innovation. A life entirely optimized might become monotonous, losing its richness and depth.\n\nThe unsettling realization would be: *If our best tools can simulate us, what distinguishes the simulated from the “real”?* This could spark existential questions about free will, purpose, and the nature of reality.\n\nTechnology like quantum computing has the potential to expand our understanding of the universe and ourselves, but it must be guided by a clear vision of what we value as a species. Balancing the efficiencies of technology with the irreplaceable aspects of human experience will likely be one of the greatest distant challenges of the future that’s worthy enough to consider today.\n\nIn this future, our role might not be about control but about ensuring the systems we create align with a vision of humanity that respects our intrinsic value.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/7e590bb6-bc6f-4afc-bd09-9dcd228ab2ad_3000x2250.png)","discussion":"","replyCount":0,"excerpt":"Historically, tools have expanded human capabilities, but there’s always a trade-off—convenience can erode critical skills. The stakes become higher when the tool isn’t just assisting but replacing foundational human experiences like decision-making. It begs the question: What is the value of imperfection? Decision-making isn’t just about outcomes but also a","words":195},{"id":"82300040","date":"2024-12-19","title":"Don’t Outsource Your Thinking","summary":"Don’t Outsource Your Thinking We&x27;ll be signing off on slop as we lean too much on AI writing for us rather than teaching","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-82300040","body":"We'll be signing off on slop as we lean too much on AI writing for us rather than teaching us how to improve. Writing well is thinking well.","discussion":"","replyCount":0,"excerpt":"We'll be signing off on slop as we lean too much on AI writing for us rather than teaching us how to improve. Writing well is thinking well.","words":28},{"id":"82256850","date":"2024-12-19","title":"Creating is the most honest and highest form of consumption.","summary":"Creating is the most honest and highest form of consumption. The consumption of “doing a process” and finding what’s new","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-82256850","body":"Creating is the most honest and highest form of consumption. The consumption of “doing a process” and finding what’s new from what’s already there is an act of art.","discussion":"","replyCount":0,"excerpt":"Creating is the most honest and highest form of consumption. The consumption of “doing a process” and finding what’s new from what’s already there is an act of art.","words":29},{"id":"82256015","date":"2024-12-19","title":"Art/engineering, philosophy/science, and relationships.","summary":"Art/engineering, philosophy/science, and relationships. The highest pursuits.","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-82256015","body":"Art/engineering, philosophy/science, and relationships. The highest pursuits.","discussion":"","replyCount":0,"excerpt":"Art/engineering, philosophy/science, and relationships. The highest pursuits.","words":7},{"id":"82161923","date":"2024-12-19","title":"It was an uncomplicated making process, sophisticated only in its simplicity.","summary":"It was an uncomplicated making process, sophisticated only in its simplicity.","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-82161923","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"82255567","date":"2024-12-19","title":"Traits that define us—resilience, creativity, and adaptability.","summary":"Traits that define us—resilience, creativity, and adaptability.","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-82255567","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"81846020","date":"2024-12-17","title":"Arthur Schopenhauer, in his essay “The Art of Being Right: 38 Ways to Win an Argument,” uses tools that are…","summary":"Arthur Schopenhauer, in his essay “The Art of Being Right: 38 Ways to Win an Argument,” uses tools that are ideally only","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-81846020","body":"Arthur Schopenhauer, in his essay “The Art of Being Right: 38 Ways to Win an Argument,” uses tools that are ideally only used to remove very bad actors when all else (reasoning) has failed. \n\nVery dangerous stuff.","discussion":"","replyCount":0,"excerpt":"Arthur Schopenhauer, in his essay “The Art of Being Right: 38 Ways to Win an Argument,” uses tools that are ideally only used to remove very bad actors when all else (reasoning) has failed. Very dangerous stuff.","words":37},{"id":"81851233","date":"2024-12-17","title":"i","summary":"i You don&x27;t &quot;make&quot; your heart beat any more than you &quot;make&quot; the sun shine. You are not a small, isolated being but a loc","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Science, emergence, and reality","source":"https://substack.com/@mattlane/note/c-81851233","body":"You don't \"make\" your heart beat any more than you \"make\" the sun shine.\n\nYou are not a small, isolated being but a localized expression of the entire cosmos sampling itself subjectively.\n\nBy realizing that circulating blood and the shining sun are equally involuntary and spontaneous, you begin to see yourself as a continuation of universal phenomena rather than apart from them. This fosters a sense of profound kinship with all existence. The voluntary and involuntary bleed into one another.\n\n**Premise (P1):** In most (if not all) conscious experiences, there is a universal sense of “I-ness” (i.e., the “I” that is aware).\n\n**Premise (P2):** This sense of “I-ness” remains identical in kind regardless of the content of the experience (e.g., happy thoughts, sad thoughts, memories)—thus, it is *independent of specific content*.\n\n**Premise (P3):** Any universal feature of consciousness that exists independently of particular contents implies an *underlying continuity or unity* of that feature.\n\n- *Justification:* If it does not change with specific instances, then we have reason to believe it is one “singular” phenomenon expressing itself in multiple contexts (analogous to how space remains one continuous entity despite being “partitioned” by objects).\n**Conclusion (C1):** Therefore, the recurring sense of “I” across different (and even newly born) conscious beings *reflects* the continuity of a single underlying consciousness, rather than separate, isolated “I’s.”\n\n- In other words, the same “I-ness” is *manifesting* anew, not being created from nothing each time.\n[https://substack.com/profile/17411623-matt-lane/note/c-81952912](https://substack.com/profile/17411623-matt-lane/note/c-81952912)\n\n[https://prodsense.substack.com/p/death-and-the-eternal-i?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true](https://prodsense.substack.com/p/death-and-the-eternal-i?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true)\n\n##### Attachments\n\n1. [A Universal Memory](https://prodsense.substack.com/p/death-and-the-eternal-i)\n2. ![image](https://substack-post-media.s3.amazonaws.com/public/images/7ac94607-fe52-4df9-b7a3-670a77b869c3_453x1000.png)","discussion":"Detailed version:\n\n**Premise 1 (Empirical):** Consciousness exhibits consistent patterns across all known instances:\n\n- **Neuroscientific Evidence**: Neuroscience identifies similar neural correlates of consciousness across species, particularly the *default mode network (DMN)*. When the DMN is active, self-referential thinking and introspection occur; when disrupted, these capacities diminish, demonstrating a causal relationship between neural activity and conscious experience.\n- **Structural Features**: All conscious experiences share three fundamental characteristics:\n  \n    - **Unity**: Experiences are integrated into a single field of awareness.\n    - **Temporality**: Experiences occur in a perceived sequence.\n    - **First-person Perspective**: Experiences are inherently subjective.\nThese features persist across altered states (e.g., meditation, psychedelics), varying levels of consciousness (sleep, anesthesia), and species with similar neural architecture.\n\n**Premise 2 (Phenomenological):** Pure awareness—the capacity for experience itself—can be distinguished from its contents:\n\n- **Definition**: Pure awareness is the capacity to experience, independent of specific mental content (thoughts, sensations, emotions).\n- **Evidence**:\n  \n    - Meditation research documents states of *\"witness consciousness\"*—bare awareness without conceptual content.\n    - Clinical cases show preserved self-awareness despite profound changes:\n      \n          - *Amnesia patients* maintain moment-to-moment awareness despite lost memories.\n          - *Split-brain patients* retain unified consciousness despite divided cognitive processes.\nThe stability of this observing awareness across radical changes in mental content demonstrates its independence from particular contents.\n\n**Premise 3 (Logical):** A phenomenon is fundamental when it is:\n\n1. **Universal** across all instances,\n2. **Irreducible**—attempting to analyze it into parts destroys its nature (e.g., awareness cannot be divided), and\n3. **Identity-Preserving** despite changing contents.\nFundamentality implies **unity** because:\n\n- Multiple instances would require differentiating features.\n- Differentiating features imply complexity, which contradicts fundamentality.\n**Bridge Premise:** Fundamental phenomena in nature exhibit unity:\n\n- **Space-time** appears divided but remains a mathematically unified field.\n- **Quantum fields** underlie seemingly distinct particles.\n- **Fundamental forces** (e.g., gravity, electromagnetism) manifest in varied ways but stem from unified origins.\n**Applicability to Consciousness**: The principles of fundamentality and unity are metaphysical, not strictly physical, and therefore apply logically to consciousness.\n\n**Supporting Evidence:**\n\n1. **Biological Continuity**: Life arises as a continuation of a prior life. Consciousness, being tied to biological processes, likely follows similar patterns of continuity.\n2. **Theoretical Support**: Integrated Information Theory (IIT) mathematically demonstrates how consciousness could be unified yet locally manifesting, mirroring fundamental physical fields.\n3. **Phenomenological Consistency**: Mystical experiences, deep meditation, and near-death reports across cultures consistently point to an underlying unity of awareness.\n**Analogy**: Just as space appears fragmented by objects but remains singular and continuous, consciousness may appear divided by individual experiences while being fundamentally unified.\n\n**Conclusion:** Consciousness is more likely a unified field that manifests locally because:\n\n- It exhibits features of fundamental phenomena (universality, irreducibility, identity-preservation).\n- Fundamental phenomena are necessarily unified.\n- Multiple lines of empirical, logical, and phenomenological evidence support this unity.\nWhile probabilistic rather than deductive, this conclusion offers a rational basis for accepting consciousness's underlying unity.\n\nI say this while acknowledging the limits of current understanding.","replyCount":0,"excerpt":"You don't \"make\" your heart beat any more than you \"make\" the sun shine. You are not a small, isolated being but a localized expression of the entire cosmos sampling itself subjectively. By realizing that circulating blood and the shining sun are equally involuntary and spontaneous, you begin to see yourself as a continuation of universal phenomena rather th","words":246},{"id":"81850429","date":"2024-12-17","title":"Worker-owned cooperatives are an effort to replace wage labor.","summary":"Worker-owned cooperatives are an effort to replace wage labor.","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-81850429","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"81850310","date":"2024-12-17","title":"In an ideal state, status and prosperity derive from how much one gives rather than hoards.","summary":"In an ideal state, status and prosperity derive from how much one gives rather than hoards.","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Science, emergence, and reality","source":"https://substack.com/@mattlane/note/c-81850310","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"81850558","date":"2024-12-17","title":"Psychedelics are now being medically described as tools for de-conditioning from societal constraints,…","summary":"Psychedelics are now being medically described as tools for de-conditioning from societal constraints, promoting unity,","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Science, emergence, and reality","source":"https://substack.com/@mattlane/note/c-81850558","body":"Psychedelics are now being medically described as tools for de-conditioning from societal constraints, promoting unity, and broadening one's perception of reality: Desynchronization ([https://pmc.ncbi.nlm.nih.gov/articles/PMC10493007/](https://pmc.ncbi.nlm.nih.gov/articles/PMC10493007/))\n\n##### Attachments\n\n1. [Psilocybin desynchronizes brain networks - PMC](https://pmc.ncbi.nlm.nih.gov/articles/PMC10493007/)","discussion":"","replyCount":0,"excerpt":"Psychedelics are now being medically described as tools for de-conditioning from societal constraints, promoting unity, and broadening one's perception of reality: Desynchronization (https://pmc.ncbi.nlm.nih.gov/articles/PMC10493007/) Attachments 1. Psilocybin desynchronizes brain networks - PMC","words":31},{"id":"81850268","date":"2024-12-17","title":"Virtual reality could allow individuals to share their innermost thoughts, dreams, and visions, akin to…","summary":"Virtual reality could allow individuals to share their innermost thoughts, dreams, and visions, akin to inviting someone","sourceCategory":"References, images, and found objects","category":"Life & learning","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-81850268","body":"Virtual reality could allow individuals to share their innermost thoughts, dreams, and visions, akin to inviting someone into your inner world, much like the way octopi display their \"minds\" externally.\n\nBest use case to this day, which I think is close to the original intent.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/b5bdac17-881b-45e8-90ab-555c6ecfa5a1_2048x2048.jpeg)\n2. 20250104\\_1411\\_Dreams of Vibrant Octopi\\_simple\
