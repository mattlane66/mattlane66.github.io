cal bottlenecks from forming around specialized resources.\n\n**4. Decentralized Local Control for Faster Flow**\n\nTo minimize the transaction cost of repeated handoffs and approvals, each development team is granted local decision-making authority within the defined constraints of their project. This autonomy removes hierarchical layers that typically stall progress and generate hidden queues. Local control shortens feedback loops, allowing on-the-spot scope adjustments without re-entering a global prioritization queue, thus maintaining continuous flow.\n\n**5. Structured Slack (“Ramp-Up”) Between Cycles**\n\nA production system running at 100% utilization has zero buffer for handling variability (or office hours for shaping what to bet on next), leading to gridlock when unexpected tasks arise. By scheduling an inter-cycle “Ramp-Up” period—often one or two weeks—teams address emergent issues, refine future project ideas, and manage minor tasks without overloading the main development pipeline. This intentional slack reduces overall lead time across projects by preventing hidden queues from building up.\n\n**6. Visualizing Unknowns to Front-Load Discovery**\n\nUncertainties translate directly into risk and rework. To highlight the progression from exploration to execution, seeing what WIP is unsolved and solved can be used, distinguishing the “uphill” phase (where unknowns must be clarified) from the “downhill” phase (where implementation is straightforward). This makes intangible queues and hidden risks explicit, encouraging earlier resolution of blockers and smoother downstream flow.\n\n**7. Timewall as Real Options Control**\n\nProjects should be treated as real options that can be paused, pivoted, or killed if the Cost of Delay becomes too high or if new information undermines the project’s initial rationale. Introducing a “Timeewall” mechanism within each cycle (end-of-cycle event) ensures no team is forced to continue investing once it’s clear the ROI or feasibility is compromised. This guards against sunk-cost fallacies and frees up capacity for higher-value work.\n\n**8. Economic Prioritization Through “Betting”**\n\nTo maximize the throughput of the highest-value work, a periodic “betting” process, usually during Ramp-Up periods, is used to select which initiatives enter the next time-boxed cycle. Projects compete based on their economic impact, urgency, and strategic fit, preventing a backlog from growing unchecked. By explicitly constraining the number of active projects, the organization reduces overall queues, ensuring teams can concentrate on fewer, more valuable bets at a time.\n\n**9. Minimizing Transaction Costs via Lightweight Collaboration**\n\nExcessive overhead—from frequent status meetings, overly detailed documentation, or excessive handoffs—creates additional queues that slow the system and raise Cost of Delay. Instead, use streamlined documentation (brief “shaping” schematics: sketches, state diagrams, etc.) and minimal recurring meetings. This approach keeps the focus on high-leverage tasks, lowering the *transaction cost* of coordination so that flow remains uninterrupted.\n\n**10. Cross-Functional Pods to Reduce Functional Queues**\n\nSiloed functions generate accumulative queues: a design queue, a development queue, a QA queue, etc. Forming small, cross-functional pods—where design, coding, and domain expertise coexist—collapses these silos into a single flow. Work items do not bounce between multiple departments, drastically cutting lead times and enabling teams to deliver without waiting for sequential sign-offs.\n\n**Integrated Summary**\n\nBy incorporating time-limited cycles, front-loaded shaping, single-threaded bets, local control, and visible slack, this system manages the variables that commonly extend lead times. Each principle leverages core flow-based economics—such as limiting WIP, reducing transaction costs, treating projects as real options, and explicitly addressing uncertainty—to ensure that the product pipeline for feature development remains fluid, adaptive, and consistently oriented toward the highest-value outcomes.","discussion":"Put aphoristically:\n\n1. **Time-Limited Cycles with Variable Scope**\n  \n    - \"Constrain your cycle to a set span, and let scope flex; small batches keep delay at bay and truth revealed early.\"\n    - \"Short, fixed periods force focus on core value, ensuring swift validation and lean progress.\"\n2. **Proactive Risk Shaping Before Committing to Build**\n  \n    - \"Shape risk before you build; uncover uncertainties early to spare later cost and chaos.\"\n    - \"Front-load risk management so the work flows free from the burden of hidden pitfalls.\"\n3. **Single-Threaded “Bets” to Limit WIP**\n  \n    - \"One bet at a time keeps distractions at bay; concentrate effort, and the process runs smooth.\"\n    - \"Avoid splitting focus—single-threaded projects cut lead times and banish bottlenecks.\"\n4. **Decentralized Local Control for Faster Flow**\n  \n    - \"Grant teams the power to decide locally; quick choices dissolve bureaucratic delays.\"\n    - \"When decision-making is near the work, progress accelerates and flow remains unbroken.\"\n5. **Structured Slack (“Ramp-Up”) Between Cycles**\n  \n    - \"A deliberate pause between cycles is not idle time but a buffer against the unexpected.\"\n    - \"Allow for slack, and your system adapts gracefully to change without gridlock.\"\n6. **Visualizing Unknowns to Front-Load Discovery**\n  \n    - \"Bring uncertainties into the light—visualize unknowns to clear the path from exploration to execution.\"\n    - \"By mapping the uphill of mystery from the downhill of implementation, hidden risks become conquerable.\"\n7. **Timewall as Real Options Control**\n  \n    - \"Treat projects as real options; know when to pause, pivot, or cease to avoid the trap of sunk cost.\"\n    - \"A timewall stops wasteful persistence, freeing resources for ventures that truly matter.\"\n8. **Economic Prioritization Through “Betting”**\n  \n    - \"Wager on value—choose projects by their economic impact and strategic fit, not by default.\"\n    - \"Focused bets prevent backlog bloat and ensure energy is spent on the highest-return ideas.\"\n9. **Minimizing Transaction Costs via Lightweight Collaboration**\n  \n    - \"Trim the fat from meetings and documentation; lean collaboration keeps the workstream fluid.\"\n    - \"When overhead is minimal, the transaction cost of progress falls, and the flow endures.\"\n10. **Cross-Functional Pods to Reduce Functional Queues**\n  \n    - \"Break down silos by uniting diverse talents; a cross-functional team erases waiting lines.\"\n    - \"When design, code, and expertise converge, the journey from idea to delivery speeds along.\"\n**Integrated Summary**\n\n- \"By setting strict time bounds, uncovering risk early, and betting on one thread at a time, you sculpt a product pipeline that flows with agility.\"\n- \"Empower local decisions, allow intentional slack, and illuminate uncertainties so that every element of work moves in harmony toward high value.\"","replyCount":0,"excerpt":"1. Time-Limited Cycles with Variable Scope Controlling cycle time is crucial to reducing Cost of Delay and feedback latency. By fixing a short time window (e.g., six weeks) and allowing scope to flex rather than extending the deadline, work batches remain small, queuing is minimized, and results get validated faster. This accelerates learning and prevents pr","words":752},{"id":"92042323","date":"2025-02-08","title":"Three Main Types of Arguments","summary":"Three Main Types of Arguments Deductive arguments are most useful when you can confidently establish the truth of your p","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-92042323","body":"- **Deductive** arguments are most useful when you can confidently establish the truth of your premises and desire a definitive conclusion.\n- **Inductive** arguments help you move from examples or data toward a general (though not certain) rule.\n- **Abductive** arguments guide you toward the most likely or most reasonable explanation among several possibilities, especially when information is limited or still evolving.\n**Let’s break them down:**\n\n**Deductive**\n\n- **Definition / Goal**: Aim for certainty. If the argument is logically valid and all premises are true, the conclusion follows with 100% certainty (soundness).\n- **Example**:\n\n    1. Premise 1: All mammals have lungs.\n    2. Premise 2: All dogs are mammals.\n    3. Conclusion: Therefore, all dogs have lungs.\n- **When to Use**:\n\n    - When the premises can be stated with near‐absolute certainty and you want a guaranteed conclusion (e.g., in mathematics, formal logic, or highly structured fields).\n    - Ideal for “if these premises hold true, then the conclusion must follow” scenarios.\n**Inductive**\n\n- **Definition / Goal**: Aim for likelihood or probability. Even if all premises are true, the conclusion can still be false—though you can support the conclusion more or less strongly depending on the breadth and quality of the evidence.\n- **Example**:\n\n    1. Premise 1: A sample of 1,000 dogs (various breeds & ages) were each observed to have four legs.\n    2. Conclusion: It is highly probable that the next dog you observe will also have four legs.\n- **When to Use**:\n\n    - When you want to generalize from specific observations to a broader conclusion or pattern (e.g., scientific experiments, polling data).\n    - Especially useful when you cannot achieve certainty but can bolster the likelihood of a claim with accumulated evidence.\n**Abductive**\n\n- **Definition / Goal**: Aim to find the best explanation among competing hypotheses. The conclusion is plausible or likely given the premises but can be revised if new data appear.\n- **Example**:\n\n    1. Premise 1: There are scratching sounds in the attic every night.\n    2. Premise 2: A common cause of repeated attic scratching is rodent infestation.\n    3. Premise 3: No other likely causes fit these patterns.\n    4. Conclusion: Mice are the best explanation for the nightly scratching sounds.\n- **When to Use**:\n\n    - When you have incomplete information and must select the most plausible explanation out of several (e.g., detective work, medical diagnoses, product strategy).\n    - Helpful for strategic reasoning when you must form a “best guess” hypothesis and refine it if new evidence arises (e.g., “Given the data, this product strategy is our best bet”).","discussion":"","replyCount":0,"excerpt":"- Deductive arguments are most useful when you can confidently establish the truth of your premises and desire a definitive conclusion. - Inductive arguments help you move from examples or data toward a general (though not certain) rule. - Abductive arguments guide you toward the most likely or most reasonable explanation among several possibilities, especia","words":417},{"id":"91944732","date":"2025-02-08","title":"Beyond Programming","summary":"Beyond Programming Computational thinking is about looking for underlying computational processes and modeling them. The","sourceCategory":"Science, emergence, and reality","category":"AI & future work","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-91944732","body":"Computational thinking is about looking for underlying computational processes and modeling them. The key insight of computational thinking: Sometimes, the best way to understand a system is to run it and observe its evolution rather than trying to “solve” it analytically.\n\nWe reframe problems in terms of computation. This means:\n\n- **Algorithmic Thinking:** Breaking problems down into algorithms, even if the process is iterative or exploratory.\n- **Formal Instructions:** Using the precision of formal, often computer-based languages to express these algorithms.\n- **Simulation as a Tool:** Emphasizing the role of simulation to explore the behavior of systems that may be too complex for traditional methods.\nThis perspective invites us to see the world through the lens of computation, where simple, local rules can give rise to the rich complexity we observe.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/865d65dd-8032-48d6-9d1d-4222853206c4_1920x1080.png)","discussion":"","replyCount":0,"excerpt":"Computational thinking is about looking for underlying computational processes and modeling them. The key insight of computational thinking: Sometimes, the best way to understand a system is to run it and observe its evolution rather than trying to “solve” it analytically. We reframe problems in terms of computation. This means: - Algorithmic Thinking: Break","words":133},{"id":"92113489","date":"2025-02-08","title":"Make Malleable","summary":"Make Malleable Act it. Be it. Obsess it. That’s the alchemical formula.","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-92113489","body":"Act it. Be it. Obsess it.\n\nThat’s the alchemical formula.","discussion":"","replyCount":0,"excerpt":"Act it. Be it. Obsess it. That’s the alchemical formula.","words":10},{"id":"91700227","date":"2025-02-07","title":"It’s Not About Outcomes or Effort Alone","summary":"It’s Not About Outcomes or Effort Alone Effort that isn’t aligned with outcomes feels wasteful while prioritizing outcom","sourceCategory":"Work, collaboration, and organizations","category":"Products & systems","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-91700227","body":"Effort that isn’t aligned with outcomes feels wasteful while prioritizing outcomes over effort leads to conservative, slower decision-making—favoring predictability over progress. True effectiveness comes from balancing both in a way that sustains momentum without sacrificing impact.\n\n1. **Lead with Context, Not Just Outcomes** Focus on understanding the current state and the specific factor you’re trying to improve to meet a desired expectation. Outcomes alone don’t tell the full story—context ensures that effort is directed where it matters most.\n2. **Maintain Even-Paced Momentum** Sustainable, effective execution happens when teams operate with rhythm and clarity, avoiding extremes of overcommitment or stagnation. Achieve this by:\n\n    - Keeping teams small.\n    - Prioritizing trust over rigid accountability structures.\n    - Cultivating a generative culture that enables creativity and adaptability.\n    - Avoiding 100% capacity utilization (allowing for slack/using buffers) leaves room for strategic collaboration and unexpected issues or opportunities that arise.\n    - De-risking options before making decisions and committing close to when executing on that decision is imminent.\n    - Using short-horizon time budgets to cap the downside of a bet.\n    - Trading quantity for quality.\nThis is how you create the conditions for building the best possible product—not just once, but repeatedly. It’s not just about making great products; it’s about designing the system that enables sustained excellence.","discussion":"","replyCount":0,"excerpt":"Effort that isn’t aligned with outcomes feels wasteful while prioritizing outcomes over effort leads to conservative, slower decision-making—favoring predictability over progress. True effectiveness comes from balancing both in a way that sustains momentum without sacrificing impact. 1. Lead with Context, Not Just Outcomes Focus on understanding the current ","words":211},{"id":"91697762","date":"2025-02-07","title":"The poorest use of language is to speak without saying anything at all.","summary":"The poorest use of language is to speak without saying anything at all.","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Ethics, society, and political economy","source":"https://substack.com/@mattlane/note/c-91697762","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"91653598","date":"2025-02-07","title":"You’re not getting less when you cut.","summary":"You’re not getting less when you cut. Cut well, and you exchange quantity for quality.","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-91653598","body":"Cut well, and you exchange quantity for quality.","discussion":"","replyCount":0,"excerpt":"Cut well, and you exchange quantity for quality.","words":8},{"id":"91232188","date":"2025-02-05","title":"Before and Now","summary":"Before and Now The old plans sit on my desk like fallen leaves. I made them with such care then, believing in what I tho","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Work, collaboration, and organizations","source":"https://substack.com/@mattlane/note/c-91232188","body":"The old plans sit on my desk\n\nlike fallen leaves.\n\nI made them with such care then,\n\nbelieving in what I thought I knew.\n\nStrange how we trust\n\nwhat we used to think,\n\nas if being further away\n\nmakes something more true.\n\nWalking this morning\n\nI saw deer tracks in snow—\n\nthey don't follow paths\n\nwe cleared for them.\n\nEach step knows more\n\nthan all our thinking:\n\nthe weight of rain,\n\nthe lean of wind,\n\nthe way things change\n\nwhen we're not looking.\n\nYou can read tomorrow\n\nin any direction.\n\nBut your feet know the earth\n\nright now, right here,\n\ntelling you things\n\nyou couldn't have written down\n\nbefore you came.\n\nJust take the next step.\n\nThat's all you need to know.\n\nThe path will tell you\n\nwhere to go.","discussion":"","replyCount":0,"excerpt":"The old plans sit on my desk like fallen leaves. I made them with such care then, believing in what I thought I knew. Strange how we trust what we used to think, as if being further away makes something more true. Walking this morning I saw deer tracks in snow— they don't follow paths we cleared for them. Each step knows more than all our thinking: the weigh","words":130},{"id":"90731649","date":"2025-02-03","title":"Types of Software Product Operating Rhythms","summary":"Types of Software Product Operating Rhythms 1. Reactive Work Reactive work is driven by immediate needs within the team","sourceCategory":"Work, collaboration, and organizations","category":"Products & systems","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-90731649","body":"1. **Reactive Work**\n\nReactive work is driven by immediate needs within the team or external stakeholders. These tasks are often urgent, labeled as “red alerts,” and managed on a First-In-First-Out (FIFO) queuing basis with Work-in-Progress (WIP) limits. This workflow is a continuous cumulative flow without a defined beginning or end.\n\n2. **Batched Work**\n\nBatched work can be divided into two subcategories:\n\n**A. Disjointed and/or Compiled Ticket Work**\n\n- Involves cleanup tasks, small polishing tweaks, lightweight assumption tests or prototypes, and cross-team efforts within a single cycle.\n- Often iterative, managed with a visual card flow model and WIP limits during cycle intervals.\n**B. Strategic Feature Work**\n\n- It encompasses feature development that is meaningfully large but contained within a single cycle.\n- Typically includes incremental or new product functionalities.\n- Requires framing and shaping before entering the development cycle.\n- Each bet can occupy one-third, two-thirds, or an entire six-week cycle.\n3. **R&D / New Product Development Work**\n\n- Refers to larger, multi-cycle projects or experiments funded using a hybrid stop-loss budgeting model under an innovation risk portfolio allocation percentage.\n- In addition to maintaining highly organized communication and a coherent vision, no additional structure is required.\n- Focuses on projects with significant exploratory components that shape new products or paradigms. Risk is assumed.\nIt’s important to recognize these different value streams and design team topologies that address how they’ll be managed.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/92702783-bc92-4025-a507-09d44c92c3a3_1101x885.png)","discussion":"","replyCount":0,"excerpt":"1. Reactive Work Reactive work is driven by immediate needs within the team or external stakeholders. These tasks are often urgent, labeled as “red alerts,” and managed on a First-In-First-Out (FIFO) queuing basis with Work-in-Progress (WIP) limits. This workflow is a continuous cumulative flow without a defined beginning or end. 2. Batched Work Batched work","words":234},{"id":"90727904","date":"2025-02-03","title":"Say it Well","summary":"Say it Well Every spoken word is a work in progress. A draft in constant flux. Articulating the clarity of our inner tho","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-90727904","body":"Every spoken word is a work in progress. A draft in constant flux.\n\nArticulating the clarity of our inner thoughts demands deliberate effort; we must resist the temptation to shortcut the depth of our understanding. Instead, attune yourself to the flow of your thoughts and commit to expressing that inner dialogue, the central idea, with authenticity.\n\nWhether in debate or casual conversation, be prepared for speech to meander through digressions, imprecise turns of phrase, and non-linear progressions where ideas often vanish as swiftly as they appear.\n\nThe art of speaking is an entirely different science from the measured craft of writing.","discussion":"Awesome and that’s how it should be. But tell it to others","replyCount":0,"excerpt":"Every spoken word is a work in progress. A draft in constant flux. Articulating the clarity of our inner thoughts demands deliberate effort; we must resist the temptation to shortcut the depth of our understanding. Instead, attune yourself to the flow of your thoughts and commit to expressing that inner dialogue, the central idea, with authenticity. Whether ","words":101},{"id":"89507853","date":"2025-01-29","title":"Prioritizing CS Skills: What to Hone and What to Skip","summary":"Prioritizing CS Skills: What to Hone and What to Skip Just my thoughts about the future of this subject area.","sourceCategory":"Learning, education, and curiosity","category":"Life & learning","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-89507853","body":"[https://docs.google.com/spreadsheets/d/1B2RJniIfMa-xCCuHQBfEywcFXsIII9DZAYApGgTfSlM/edit?usp=sharing](https://docs.google.com/spreadsheets/d/1B2RJniIfMa-xCCuHQBfEywcFXsIII9DZAYApGgTfSlM/edit?usp=sharing)\n\nJust my thoughts about the future of this subject area.\n\n##### Attachments\n\n1. [Future CS Topics](https://docs.google.com/spreadsheets/d/1B2RJniIfMa-xCCuHQBfEywcFXsIII9DZAYApGgTfSlM/edit?usp=sharing)","discussion":"","replyCount":0,"excerpt":"https://docs.google.com/spreadsheets/d/1B2RJniIfMa-xCCuHQBfEywcFXsIII9DZAYApGgTfSlM/edit?usp=sharing Just my thoughts about the future of this subject area. Attachments 1. Future CS Topics","words":16},{"id":"89315279","date":"2025-01-28","title":"Designing From 0, 1, n","summary":"Designing From 0, 1, n Draw a boundary between the part of the world you plan to change and the part you will not change","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-89315279","body":"1. Draw a ***boundary*** between the part of the world you plan to change and the part you will not change to isolate the forces acting within the \"designable\" focus area.\n2. Identify the ***forces*** that influence what you intend to design.\n3. Represent and resolve related *forces* in visualizations (e.g., sketches, state diagrams, etc.).\n4. Place the new design (*form*) into its living ***context*** and look for ***misfits ***(design problems) in the ***ensemble*** to improve ***fitness***.\n_______\n\n**Forms**: The **objects** of design.\n\n**Context**: The **system** of forces (**facts** about the world that influence the form).\n\n**Fitness**: The relationship between the *form* and the living *context* of the real world.\n\nRequirements must not be attributes of the thing (*form*) being created; instead, they should describe facts about the world—things we cannot change. These requirements are generally technology-agnostic. This approach centers on designing with *forces* or *patterns* (i.e., recurring sets of *forces*).\n\nStarting with these *forces* is a bottom-up design approach, i.e., focusing on the epicenter. These are the parts we compose from the inside out, the factors we must address to provide the capabilities to people in a specific situation with the best fit. To work this way, it is usually easiest to build with smaller chunks first and then aggregate them into larger wholes.\n\nSome helpful tools:\n\n[https://substack.com/@mattlane/note/c-82461837?r=ad6w7&utm_medium=ios&utm_source=notes-share-action](https://substack.com/@mattlane/note/c-82461837?r=ad6w7&utm_medium=ios&utm_source=notes-share-action)\n\n**The object of design is to work within, identify, and create constraints.**\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/f9e16663-5904-4011-85ea-304bc04d4a28_4800x698.webp)\n2. [Conceptual Design Background:](https://substack.com/@mattlane/note/c-82461837)","discussion":"**Why Function ≠ Ensemble**\n\n1. **Function is Local; Ensemble is Global**\n  \n    - A function is **specific to a form**—it describes what the form does and how it behaves.\n    - The ensemble is **the broader system**—it includes the form, the forces acting upon it, and the relationships between all elements.\n2. **Function is About Role; Ensemble is About Composition**\n  \n    - Function describes **how a form serves a purpose** within a system.\n    - The ensemble describes **how multiple forms and forces interrelate** as a whole.\n3. **Fitness Comes from the Interaction Between Function and Ensemble**\n  \n    - If a function does not fit well within the ensemble, misfits arise.\n    - Adjusting function (or form) improves fitness in relation to the ensemble.\nYou can get some guide to what the function of something is by looking at “charecteristic use”.\n\n**Example: The Shared Family Calendar App**\n\n**Draw a Boundary**\n\n1. **Designable Focus Area**\n  \n    - You’re tasked with improving how a family (household members) manages and shares events, tasks, and schedules digitally.\n    - It might be a mobile app or web app—some digital “calendar” system that’s accessible to all family members.\n2. **Out of Scope**\n  \n    - You cannot change people’s workplaces or school systems (i.e., you can’t force a school to adopt your calendar).\n    - You also can’t alter major cloud platforms (e.g., Google/Apple) if you’re merely integrating with them.\n    - You can’t change broad cultural aspects of how families communicate in general.\nBy **drawing this boundary**, you isolate the realm you can truly influence—the family’s shared tool—and acknowledge broader forces you cannot directly change.\n\n**Identify the Forces**\n\nThink of **context** as the dynamic web of facts and conditions around family life:\n\n1. **Social & Emotional Forces**\n  \n    - **Parent–Child Dynamics**: Parents need oversight of kids’ schedules but also want kids to learn responsibility.\n    - **Family Bonding**: Some families see scheduling as a reflection of quality time or personal values (e.g., scheduling “family dinner”, and balancing chores).\n2. **Functional Forces**\n  \n    - **Reminder & Notification Overload**: People want timely notifications but hate being spammed.\n    - **Offline vs. Online Needs**: Some family members (e.g., grandparents) may prefer minimal tech or might not have smartphones.\n3. **Practical Constraints**\n  \n    - **Varied Tech Savviness**: One sibling might be a tech wizard, and another only checks email occasionally.\n    - **Different Device Ecosystems**: Some on iOS, some on Android, others on a shared home computer.\n    - **Time Zones**: If any family members travel often or live in different locations, time zone differences can confuse scheduling.\n**Requirements** here are not “the app must have a purple UI;” they’re **facts about the world**—such as “Grandma uses a feature phone” or “Kids forget to check their notifications.” You can’t change these truths; you have to accommodate them.\n\n**Represent & Visualize the Forces**\n\nYou might sketch a quick diagram:\n\n- **X-axis**: Level of Technological Comfort (low → high)\n- **Y-axis**: Need for Coordination (few shared events → many shared events)\nMark different family members on this chart. This helps you see potential friction points—e.g., the ones with **low tech comfort** but **high coordination needs** will be a challenge.\n\nAlternatively, you could outline a **state diagram** of how events get created, shared, and updated, and highlight where conflicts or errors occur.\n\n**Put the Current Form (Point A) Into Context & Identify Misfits**\n\n**Current Approach** might be:\n\n- A “patchwork” of solutions:\n  \n    - Mom uses Google Calendar, Dad uses Apple Calendar, kids rely on text messages, and Grandma calls on the phone.\n**Common Misfits** You Might Observe:\n\n1. **Schedule Overlaps**: No single shared view leads to double bookings (Dad books a weekend trip while Mom schedules a family reunion).\n2. **Outdated Information**: Some events get updated in one tool but never cascade to others.\n3. **Uneven Engagement**: Teenagers ignore texts; grandparents never see app notifications.\n4. **Frustration & Blame**: Family members blame each other for “not paying attention” or “not sending the invite.”\nThese **misfits**—where friction is highest—point to areas needing the most urgent design attention.\n\n**Uncover Needs & Insights (Latent Forces)**\n\nBy interviewing family members, you discover deeper motivations:\n\n- **Latent Need 1**: “I want to keep track of everyone’s activities without feeling like a nag.”\n  \n    - **Insight**: Constant reminders or check-ins can feel controlling; a gentle, automated way to update schedules could reduce tension.\n- **Latent Need 2**: “I want our calendar to reflect fun or personal moments, not just chores and appointments.”\n  \n    - **Insight**: A purely functional calendar might miss the emotional aspect of family life—like highlighting birthdays, shared photos, or small wins (e.g., a child’s school achievement).\n- **Latent Need 3**: “I’m worried I’ll miss something important if I don’t see the notification right away.”\n  \n    - **Insight**: People may need a fallback or summary view (e.g., a daily text summary or a quick phone call to older relatives).\nThese **latent needs** go beyond the obvious “We just need one shared Google Calendar.” They reveal emotional, social, and practical forces a solution must address.\n\n**Generate Forms (Explore Radically Different Ideas)**\n\nExplore multiple solutions that might meet these forces:\n\n1. **Unified Family Hub**\n  \n    - A web and mobile app that automatically syncs with Google, Apple, and Outlook calendars in real time.\n    - Each family member sees a single aggregated “family feed” of events.\n    - Allows quick color coding: Red for urgent tasks, Green for fun events, etc.\n2. **Low-Tech Notification Bridge**\n  \n    - In addition to a central app, an automated SMS or phone-call system for members without smartphones (“Grandma Hotline”).\n    - A daily or weekly “digest” call that reads out the upcoming events.\n3. **Gamified Calendar**\n  \n    - Points or stickers for chores or tasks completed, so kids engage.\n    - Family can unlock “rewards” (movie night, pizza coupons) when everyone stays on track for a week.\n4. **Storyboard Calendar**\n  \n    - A digital corkboard + calendar hybrid: You can attach images, notes, or voice clips for events.\n    - A timeline that feels more like a social feed, capturing special moments as well as appointments.\nEach idea addresses different **misfits**—some focus on bridging tech-savvy gaps, others emphasize emotional warmth and fun, and others tackle real-time synchronization.\n\n**Stage the Ensemble: Prototype & Test**\n\n**Prototyping** means you build light, testable versions to see how they fit into real family routines:\n\n1. **Paper or Clickable Mockups**\n  \n    - Create a simple interactive prototype (using tools like Figma or pen-and-paper storyboards) that demonstrates how events are posted, updated, and viewed.\n2. **Role-Play with Family Scenarios**\n  \n    - Write short scripts—Mom needs to schedule a doctor’s appointment, Dad sets a meeting at the same time, the child sees a clash, etc.\n    - Let participants “act it out” using the mockup, noticing where confusion arises.\n3. **Early Beta Testing**\n  \n    - Implement minimal functionality: A basic web app to share events with an SMS reminder option for offline members.\n    - Have a real family try it out for a week and gather feedback on friction points.\n**Misfits** discovered in testing might include:\n\n- Overwhelming color-coding: “I’m color-blind; all these categories look the same.”\n- Confusing reminders: “I got 5 notifications for the same event.”\n- Privacy concerns: “I don’t want extended family to see my medical appointments.”\nThese issues are exactly what you want to reveal in **staging the ensemble** (the interplay of your prototype with the real context).\n\n**Refine Misfits & Iterate**\n\nAddress the most critical or “obtrusive” misfits:\n\n- **Too Many Notifications** → Add a weekly digest or flexible notification settings.\n- **Privacy** → Allow event-level privacy controls or “public” vs “private” designations.\n- **Visual Accessibility** → Offer high-contrast themes and bigger fonts.\nYou continuously adjust **form** (the app) to align it better with **context** (the diverse family needs). Each iteration moves you closer to a solution that “just works” in daily life.\n\n**Achieve a Good Fit**\n\nUltimately, after iterative testing and refinement, you converge on a **Shared Family Calendar App** that:\n\n1. **Syncs Seamlessly** with each family member’s existing system (Google, Apple, etc.).\n2. **Offers SMS Summaries** or simple phone-call reminders for those less comfortable with smartphone apps.\n3. **Balances Fun & Utility** by allowing short notes, photos, or emojis so the calendar reflects family life beyond deadlines.\n4. **Respects Privacy** with straightforward event-sharing controls.\nBecause you **staged and tested** your prototypes in realistic family scenarios, you systematically rooted out misfits. The final ensemble—**form** plus **context**—feels natural and frictionless, creating a genuine sense of **good fit**.\n\nKey Takeaways\n\n1. **Context First**: Real design requirements come from unchangeable facts about the family (ages, tech comfort, daily routines).\n2. **Misfits as Guides**: Let friction points (duplicated appointments, privacy concerns) guide you to where the solution should evolve.\n3. **Multiple Form Explorations**: Don’t settle on “just an app”; test radically different angles (gamification, bridging offline/online, adding emotional warmth).\n4. **Staging the Ensemble**: Actively prototype and observe how the “family plus calendar app” interacts in the real world.\n5. **Iterate for Best Fit**: Each cycle of testing and refining edges you closer to a solution that fits seamlessly into users’ lives.\nThis **Shared Family Calendar App** example demonstrates how to **design from the inside out**—starting with the unchangeable forces (context) and systematically creating forms that eliminate misfits and deliver real value to everyday users.\n\n**Designing From 0, 1, n**\n\n**Key Idea:** Draw a boundary around the part of the world you *will* change (form) and the part you *won’t* (context). Identify forces in the context, place the new form into that environment, and refine any “misfits.”\n\n- **Decomposition:**\n  \n    - Separates **form** (the designed solution) from **context** (constraints, user environment, social/emotional factors).\n    - Identifies sub-forces or specific constraints (e.g., cost limits, user emotional states).\n- **Abstraction:**\n  \n    - Treats the environment as a **force field**—intangible but impactful constraints that guide the form.\n    - “Requirements” become facts about the world that you can’t change; you design the form around these forces.\n- **Pattern Recognition:**\n  \n    - You repeatedly test form against context, noticing **misfits** or friction that emerges in the ensemble.\n    - Over multiple designs, certain recurring friction points become predictable or repeated.\n- **Algorithm/Procedure:**\n  \n    - Follows a **refinement loop**: place the form into the context → observe friction → adjust form → retest.\n    - Continues until you reach a “good fit” or run out of major misfits to address.","replyCount":0,"excerpt":"1. Draw a boundary between the part of the world you plan to change and the part you will not change to isolate the forces acting within the \"designable\" focus area. 2. Identify the forces that influence what you intend to design. 3. Represent and resolve related forces in visualizations (e.g., sketches, state diagrams, etc.). 4. Place the new design (form) ","words":236},{"id":"89365512","date":"2025-01-28","title":"Problems are functional issues or misfits identified within the design ensemble, often rooted in unrealized…","summary":"Problems are functional issues or misfits identified within the design ensemble, often rooted in unrealized needs, wants","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Ethics, society, and political economy","source":"https://substack.com/@mattlane/note/c-89365512","body":"**Problems** are **functional issues** or **misfits** identified within the design ensemble, often rooted in **unrealized needs, wants, or wishes**.\n\n**Struggles** are **social and emotional challenges** we experience in moments of our lives, reflecting the **tension between what is **and **what we desire or expect**.\n\n**Vision** is a view of a **better world**—beyond what most can currently imagine—where **unrealized needs, wants, and wishes** are discovered and **transformed into possibilities** that transcend present limitations.\n\n**All of the above** can inform **error correction** and open the door to new **business opportunities**.","discussion":"","replyCount":0,"excerpt":"Problems are functional issues or misfits identified within the design ensemble, often rooted in unrealized needs, wants, or wishes. Struggles are social and emotional challenges we experience in moments of our lives, reflecting the tension between what is and what we desire or expect. Vision is a view of a better world—beyond what most can currently imagine","words":88,"relation":{"label":"Related tool","text":"Fit Check Error Model","href":"../fit-check/"}},{"id":"89306793","date":"2025-01-28","title":"Good writing seems to be mostly about three main things: noticing, choosing the right words, and using some…","summary":"Good writing seems to be mostly about three main things: noticing, choosing the right words, and using some common sense","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-89306793","body":"Good writing seems to be mostly about three main things: noticing, choosing the right words, and using some common sense.\n\n[https://substack.com/@mattlane/note/c-80229098?utm_source=notes-share-action&r=ad6w7](https://substack.com/@mattlane/note/c-80229098?utm_source=notes-share-action&r=ad6w7)\n\n##### Attachments\n\n1. [Language is the original code for hacking reality](https://substack.com/@mattlane/note/c-80229098)","discussion":"","replyCount":0,"excerpt":"Good writing seems to be mostly about three main things: noticing, choosing the right words, and using some common sense. https://substack.com/@mattlane/note/c-80229098?utmsource=notes-share-action&r=ad6w7 Attachments 1. Language is the original code for hacking reality","words":31},{"id":"89034495","date":"2025-01-27","title":"How Framing (Demand Side) and Shaping (Supply Side) Ping‐Pong Plays Out","summary":"How Framing (Demand Side) and Shaping (Supply Side) Ping‐Pong Plays Out Sometimes you have a problem and no solution. Ot","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-89034495","body":"Sometimes you have a problem and no solution.\n\nOther times you start with a solution, but you haven't yet worked backward to the problem.\n\nThe reality is that it’s not a linear process but a moving back-and-forth motion between problem (demand) and solution (supply).\n\nExample Scenario\n\nLet’s imagine you have the germ of an idea for a new product that automatically **records and transcribes customer calls **for busy sales teams.\n\nDemand Side (Problem)\n\n\u003e **“We always forget important client details from our calls, and it’s awkward typing notes during the call. We want an automatic way to capture calls and quickly find what was said.”**\n\n1. **Initial Observation:**\n\n    - Sales reps complain they can’t fully focus on the conversation because they’re juggling note‐taking.\n    - Managers suspect many follow‐up tasks get dropped because nobody can remember all the action items.\n2. **Research/Questions:**\n\n    - “Are reps already recording calls in some way? If so, do they listen back?”\n    - “How many calls do they have per day? 3–4 or 20+?”\n    - “Would they want full‐length recordings or just a summary of key points?”\n3. **Finding:**\n\n    - 80% of calls are \u003c15 minutes.\n    - The biggest pain is that reps don’t want to sift through a 15‐minute replay for one detail. They just want quick highlights or text search.\nSupply Side (Solution Directions)\n\n\u003e **“We could build a call‐recording and transcription service baked into our existing chat app or as a stand‐alone product.”**\n\n1. **Initial Idea:**\n\n    - **Idea:** Integrate call recording + AI transcription so reps can replay or read a transcript anytime.\n    - **Constraint:** Building an in‐house transcription engine is huge. Might need a third‐party transcription API.\n2. **Prototyping & Feasibility:**\n\n    - “Let’s do a small experiment with an off‐the‐shelf speech‐to‐text API to see if the accuracy is good enough.”\n    - **Discovery:** The API costs $X per minute. For high volume, that might get expensive.\n3. **Refinement:**\n\n    - “Because the main pain is *finding what was said*, we don’t need an ultra‐fancy audio interface. A robust text search might do 90% of the job.”\n    - “We can keep actual audio recordings for a limited time (e.g. 30 days) to save storage costs.”\nReflects a Messy Reality, and That’s Ok\n\n1. **Starting with a Fuzzy Problem:** You begin on the demand side: “Our sales teams can’t keep track of key info from calls.”\n2. **Jumping to a Possible Solution:** Next, you hypothesize: “What if we record and transcribe calls automatically?”\n3. **Going Back to Validate the Problem:** Before building anything, you go back to ask real users: “Do you truly want whole‐call playback, or is searching transcripts enough?”\n4. **Prototyping to Explore Feasibility (Supply):** You try an off‐the‐shelf transcription API to see how accurate it is and weigh costs.\n5. **Refining the Scope:** The new knowledge (costs, user desire for quick search) shapes a narrower solution: you **prioritize text search** as the key feature, with optional audio access for a limited time.\nThroughout, each demand‐side question sets up a new supply‐side prototype or research, and each supply‐side insight triggers further questions on the demand side. This is exactly the iterative shaping process: you **bounce back and forth **until the scope and solution match the real need.\n\nThe back and forth between the supply side and demand side defined a context that made it clear at each step what the question was, why I was asking it, and how the answer affected the work-in-progress solution.\n\nThis also shows Kidlin's Law in action. That the problem and the solution are much closer in kind than we think.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/2408c2fd-82b4-49db-9a08-f615f7ff38c0_1036x1079.png)","discussion":"**Framing (Demand) ↔ Shaping (Supply) Ping-Pong**\n\n**Key Idea:** An iterative, back-and-forth process of clarifying the *problem context* (demand side) and refining potential *solution directions* (supply side).\n\n- **Decomposition:**\n  \n    - Splits the design space into two perspectives: **Problem** (user context, pain points) and **Solution** (prototypes, technology feasibility).\n    - Each side can be investigated in smaller, more focused steps (user research, tech spikes).\n- **Abstraction:**\n  \n    - Remains open-ended at first, focusing on big-picture questions: “What do people really need?” vs. “Which solution directions might address this?”\n    - Avoids locking into a single detailed form too soon.\n- **Pattern Recognition:**\n  \n    - Each iteration reveals **recurring friction points** or consistent user demands.\n    - Repeatedly seeing the same issues helps you refine or discard solution paths more efficiently.\n- **Algorithm/Procedure:**\n  \n    - Involves a **loop**: (1) Clarify the problem → (2) Suggest solution → (3) Validate → (4) Refine → return to (1).","replyCount":0,"excerpt":"Sometimes you have a problem and no solution. Other times you start with a solution, but you haven't yet worked backward to the problem. The reality is that it’s not a linear process but a moving back-and-forth motion between problem (demand) and solution (supply). Example Scenario Let’s imagine you have the germ of an idea for a new product that automatical","words":592},{"id":"89088677","date":"2025-01-27","title":"A piece of writing is always, in some sense, in a draft state.","summary":"A piece of writing is always, in some sense, in a draft state. But before you publish your “final version,” consider ask","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-89088677","body":"A piece of writing is always, in some sense, in a draft state. But before you publish your “final version,” consider asking yourself the following questions:\n\n1. Is it clear from the beginning what the paper is about?\n2. Does each paragraph advance the subject?\n3. Do the important ideas stand out clearly?\n4. Are more details, examples, or anecdotes needed?\n5. Is the information sufficiently clear?\n6. Are there sweeping statements that need to be supported?\n7. Do any technical terms need explanation?\n8. Is there needless repetition?\n9. Is the tone consistent?\n10. Are any of the sentences too involved to follow with ease?\n11. Are any of the words vague?\n12. Are there grammatical errors?\n13. Are there punctuation errors? ​","discussion":"","replyCount":0,"excerpt":"A piece of writing is always, in some sense, in a draft state. But before you publish your “final version,” consider asking yourself the following questions: 1. Is it clear from the beginning what the paper is about? 2. Does each paragraph advance the subject? 3. Do the important ideas stand out clearly? 4. Are more details, examples, or anecdotes needed? 5.","words":124},{"id":"89031832","date":"2025-01-27","title":"A Controversial Take on Lyrics","summary":"A Controversial Take on Lyrics All too often, aesthetics shadow substance. Even when the lyrical content is strong, form","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-89031832","body":"All too often, aesthetics shadow substance. Even when the lyrical content is strong, form tends to be overemphasized—most commonly through rhyme—rather than harnessing the natural rhythm of artfully crafted sentences.","discussion":"","replyCount":0,"excerpt":"All too often, aesthetics shadow substance. Even when the lyrical content is strong, form tends to be overemphasized—most commonly through rhyme—rather than harnessing the natural rhythm of artfully crafted sentences.","words":30},{"id":"88669190","date":"2025-01-26","title":"Skillful Editing","summary":"Skillful Editing Software has no natural boundaries or edges. There are no obvious laws of physics that tell us somethin","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Design, software, and systems","source":"https://substack.com/@mattlane/note/c-88669190","body":"Software has no natural boundaries or edges. There are no obvious laws of physics that tell us something is too big, too heavy, etc. There are no natural pushbacks. Shaping constrains the work so there are clear boundaries around what is in and what is out.\n\nDoing the shaping work well achieves a state of elegance, which is characterized by four key elements—seduction, subtraction, symmetry, and sustainability. Subtraction fascinates me the most. Because what’s “not there” often trumps what is.\n\nIt’s about finding solutions or designs that remove unnecessary complexity while still being deeply effective or evocative.\n\nElegance often requires removing what’s unnecessary, challenging the natural tendency to add (especially in software design and development). Subtraction creates space for interpretation, imagination, and engagement, which often leads to a deeper connection or understanding.\n\nA truly elegant design seamlessly integrates form and function. It serves its purpose while also evoking a sense of beauty or harmony within a specific context.\n\nThe important things are the capabilities you give to people to help them make progress where they can’t, when they aren’t ready to change, or do not know how. Design isn’t a sea of pixels and code isn’t a tangle of functions. The more you see how each piece of design and code supports a specific capability, the easier it is to find order in the chaos of product development.\n\n[https://substack.com/@mattlane/note/c-83177948](https://substack.com/@mattlane/note/c-83177948)\n\n[https://substack.com/profile/17411623-mhl/note/c-86123556?r=ad6w7&utm_medium=ios&utm_source=notes-share-action](https://substack.com/profile/17411623-mhl/note/c-86123556?r=ad6w7&utm_medium=ios&utm_source=notes-share-action)\n\n##### Attachments\n\n1. [Designing Synthesis](https://substack.com/@mattlane/note/c-86123556)\n2. ![image](https://substack-post-media.s3.amazonaws.com/public/images/bb023fec-684c-4a31-b6ce-869b8896ecc7_1024x683.png)","discussion":"","replyCount":0,"excerpt":"Software has no natural boundaries or edges. There are no obvious laws of physics that tell us something is too big, too heavy, etc. There are no natural pushbacks. Shaping constrains the work so there are clear boundaries around what is in and what is out. Doing the shaping work well achieves a state of elegance, which is characterized by four key elements—","words":235},{"id":"88864167","date":"2025-01-26","title":"Opinionated by default, but flexible under the hood.","summary":"Opinionated by default, but flexible under the hood.","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-88864167","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"88867209","date":"2025-01-26","title":"It feels prudent not to decide whether something is practical or impractical by labeling it as good or bad,…","summary":"It feels prudent not to decide whether something is practical or impractical by labeling it as good or bad, or right or","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Ethics, society, and political economy","source":"https://substack.com/@mattlane/note/c-88867209","body":"It feels prudent not to decide whether something is practical or impractical by labeling it as good or bad, or right or wrong. They’re not simply opposite ends of a spectrum.","discussion":"","replyCount":0,"excerpt":"It feels prudent not to decide whether something is practical or impractical by labeling it as good or bad, or right or wrong. They’re not simply opposite ends of a spectrum.","words":31},{"id":"88575745","date":"2025-01-25","title":"A Dialogue Culture Playbook","summary":"A Dialogue Culture Playbook The purpose here is simple: to learn from each other, to gather new perspectives, and to enj","sourceCategory":"Work, collaboration, and organizations","category":"Products & systems","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-88575745","body":"The purpose here is simple: to learn from each other, to gather new perspectives, and to enjoy the process. But simple doesn't mean easy.\n\nBegin with kindness. When disagreeing—and disagreement is valuable—let your words be considerate. Always. This isn't about softening your “truth” but making it more likely to be heard.\n\nTake offense rarely. Reserve it for genuine bigotry and hatred, which have no place here. Even then, seek first to understand—not as you wish to understand, but as others wish to be understood. When true hatred appears, we'll address it directly and, if necessary, part ways with its bearer.\n\nQuestions matter more than answers here. They open doors that declarations leave closed. Bring your ideas, but also your curiosity about them. What might others see that you don't? What assumptions lie hidden in your certainties?\n\nEveryone here guides the conversation toward “truth”. Everyone facilitates. Your role isn't passive but active—building on ideas, connecting threads, drawing out quiet voices.\n\nThough our topics may weigh heavy, our touch need not. Choose a bright sincerity over solemnity, leaving room for wit to bloom.\n\n[https://prodsense.substack.com/p/the-bohm-dialogue?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=false](https://prodsense.substack.com/p/the-bohm-dialogue?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=false)\n\n##### Attachments\n\n1. [The Bohm Dialogue](https://prodsense.substack.com/p/the-bohm-dialogue)","discussion":"","replyCount":0,"excerpt":"The purpose here is simple: to learn from each other, to gather new perspectives, and to enjoy the process. But simple doesn't mean easy. Begin with kindness. When disagreeing—and disagreement is valuable—let your words be considerate. Always. This isn't about softening your “truth” but making it more likely to be heard. Take offense rarely. Reserve it for g","words":187},{"id":"88410616","date":"2025-01-24","title":"Counterintuitively, sometimes—especially in creative problem-solving endeavors—modeling the messiness of…","summary":"Counterintuitively, sometimes—especially in creative problem-solving endeavors—modeling the messiness of reality require","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-88410616","body":"Counterintuitively, sometimes—especially in creative problem-solving endeavors—modeling the messiness of reality requires being imprecise or approximate. Imprecise wiggle room often better reflects what’s truly happening than basing conclusions on a precise but false premise.\n\nThe image presented here shows how this idea can be applied to understanding the progress of a project using the Move the Needle feature in Basecamp.\n\nBut we can apply this logic to almost anything where human systems and innovation are central to the activity.\n\n[https://substack.com/@mattlane/note/c-80228112](https://substack.com/@mattlane/note/c-80228112)\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/5d59ce73-5928-47ce-9d0b-a13d96f1172c_1920x1877.png)\n2. [Metrics do not lie by being wrong about the thing they are measuring, they lie by being wrong about how important something is and how unimportant all the things you can't measure are.](https://substack.com/@mattlane/note/c-80228112)","discussion":"","replyCount":0,"excerpt":"Counterintuitively, sometimes—especially in creative problem-solving endeavors—modeling the messiness of reality requires being imprecise or approximate. Imprecise wiggle room often better reflects what’s truly happening than basing conclusions on a precise but false premise. The image presented here shows how this idea can be applied to understanding the pr","words":115},{"id":"88376148","date":"2025-01-24","title":"Healthy Sources for General News","summary":"Healthy Sources for General News OR","sourceCategory":"References, images, and found objects","category":"Life & learning","also":"Ethics, society, and political economy","source":"https://substack.com/@mattlane/note/c-88376148","body":"[https://www.reuters.com](https://www.reuters.com)\n\n[https://www.ft.com](https://www.ft.com)\n\n[https://www.allsides.com/unbiased-balanced-news](https://www.allsides.com/unbiased-balanced-news)OR [https://ground.news](https://ground.news)\n\n[https://usafacts.org](https://usafacts.org)\n\n[https://www.snopes.com](https://www.snopes.com)\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/8a170884-cc02-4ef6-871f-1a526aa45edd_1975x1215.png)","discussion":"","replyCount":0,"excerpt":"https://www.reuters.com https://www.ft.com https://www.allsides.com/unbiased-balanced-newsOR https://ground.news https://usafacts.org https://www.snopes.com Attachments 1.","words":8},{"id":"88166226","date":"2025-01-23","title":"Appetites, not Estimates","summary":"Appetites, not Estimates Estimates start with a design and end with a number. Appetites start with a number and end with","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-88166226","body":"Estimates start with a design and end with a number. Appetites start with a number and end with a design.\n\nWhat the graphic below shows are two very different ways of deciding how (and *how much*) work gets done:\n\n1. **Estimate** (Fixed Scope, Variable Time)\n\n    - Here, you begin by locking down *everything* you want delivered—the full feature set, requirements, etc.\n    - Because that scope is fixed, the time (and cost) will vary. You might go over budget or stretch deadlines if the project (e.g., a product feature) takes longer than expected.\n    - This approach leads to detailed “how long will it take?” estimates up front, which can be notoriously off-target in software projects unless there are 0 unknowns left or you are doing something for the 10th time and there’s minimal variability in the task.\n2. **Appetite** (Fixed Time, Variable Scope, i.e., time budgets and talent allocation (number of people and their domain experience levels))\n\n    - Instead of guaranteeing *all* possible features, you fix the amount of time you’ll spend—say, six weeks (ideal max time to spend at a time).\n    - Once you have a narrow problem or opportunity defined, you ask yourself: “How much time is it worth spending on this?”.\n    - Then, you shape the project or projects to fit within the Appetite’s time budget, focusing on a *reduced* set of must-have work.\n    - While shaping (not building), if something looks like it would blow the time budget, you cut or simplify that piece so you can still ship on time. You estimate up to a defined constraint, the outermost boundaries, i.e., the Appetite. This is much like you do when planning a vacation, and you know you have, e.g., one week to fill up.\n    - You also use this time budget to guide the development cycle. So, an Appetite is a constraint on planning and building. If you are going to have overruns into the post-launch period (like a cool-down week), ask if there are too many unknowns vs. knowns left. If there are going to be too many unknowns at the end of the budget, consider not giving in to the sunk cost fallacy and asking if this needs to be reshaped or paused for another reason. Preserve optionality!\nWhy **order-of-magnitude estimation** might not be all that helpful in the “Appetite” (time budget) model:\n\n- When you fix time (e.g., “We have six weeks”), it’s no longer about whether a feature is a 2‑week or 10‑week project in a broad sense; you already know your total runway is six weeks at a time.\n- If an idea looks too big—even an “order of magnitude” bigger than you can handle in six weeks—you’re going to cut or reshape it immediately. There’s no real need to fine-tune whether it’s “two or three times bigger” because you’re not going to expand the six-week window. You’ll only ever shrink or simplify the scope.\n- In other words, the *exact* size of the project (even if “big” vs “huge”) isn’t as relevant because you don’t flex the schedule—you flex what you build. Once it’s clear it won’t fit in six weeks, you don’t proceed as-is; you reduce the scope or abandon parts of the idea.\nThis is why, in a fixed-schedule (Appetite) approach, deeply detailed or large-scale estimates add limited value. You’re less concerned with nailing down precise guesses and more focused on shaping the scope to meet your fixed time constraint.\n\nHere’s another way to understand the Appetite.\n\nThere isn’t “one” Time Budget for a project. That would presume that the project is already defined.\n\nInstead, think of how we might consider three different Appetites for the project:\n\nIf we only had two weeks, we’d hack it in like this…\n\nIf we had six weeks, we’d include this, that, and this other thing…\n\nIf we had six months, we’d rewrite that existing service and redo it like this…\n\nPresenting a set of options like this creates contrast and helps decision-makers better see the trade-offs and opportunity costs. Then the Appetite isn’t a different word for an estimate. It’s a decision about how to constrain the types of conversations we are willing to have about something. It is not a question of small, medium, or large; it is about making trade-offs and deciding what is in and what is out.\n\nSometimes there is deeper work or a feature that has too many moving parts that prevent it from being scoped down to one six-week project (like 6 weeks). Even in that case, we scope off the work in such a way that each cycle is expected to be done so that when the next cycle starts, it is just the other parts of the work that were scoped off separately or orthogonal to the parts of the previous cycle(s). We then integrate and ship altogether at the appropriate cycle (different for each project). Because we have a hard time wall to avoid sunk costs, and cycles are not long, prioritizing \"the wrong thing(s)\" is not too big a deal.\n\nThe value here is that one important part of a larger product was designed, implemented, demoed, and settled. The team can feel good about showing tangible progress, even if only the first cycles are shipped internally. And the team and management both felt confident in the overall direction by seeing working pieces more frequently.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/8e99f06f-99e8-459d-957e-29e7ff5f1e09_860x833.png)","discussion":"","replyCount":0,"excerpt":"Estimates start with a design and end with a number. Appetites start with a number and end with a design. What the graphic below shows are two very different ways of deciding how (and how much) work gets done: 1. Estimate (Fixed Scope, Variable Time) - Here, you begin by locking down everything you want delivered—the full feature set, requirements, etc. - Be","words":895},{"id":"87348067","date":"2025-01-20","title":"Personalization in a World of Standardization","summary":"Personalization in a World of Standardization Adaptive learning systems like Large Language Models (LLMs) bridge the gap","sourceCategory":"Learning, education, and curiosity","category":"Life & learning","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-87348067","body":"Adaptive learning systems like Large Language Models (LLMs) bridge the gap between professionals and beginners, creating tools that make knowledge accessible and relatable for all. By tailoring content to students' interests, these systems have the power to transform abstract subjects into engaging, meaningful learning experiences.\n\nLLMs can take personalized education to the next level, fostering an asking-style approach to learning. Through customized projects incorporating computational thinking, LLMs empower students to formalize and bring their ideas to life, making education interactive and personalized at scale.\n\n[https://blogs.worldbank.org/en/education/From-chalkboards-to-chatbots-Transforming-learning-in-Nigeria](https://blogs.worldbank.org/en/education/From-chalkboards-to-chatbots-Transforming-learning-in-Nigeria)\n\n[https://pubmed.ncbi.nlm.nih.gov/36310094/](https://pubmed.ncbi.nlm.nih.gov/36310094/)\n\n[https://substack.com/@mattlane/note/c-82932288](https://substack.com/@mattlane/note/c-82932288)","discussion":"","replyCount":0,"excerpt":"Adaptive learning systems like Large Language Models (LLMs) bridge the gap between professionals and beginners, creating tools that make knowledge accessible and relatable for all. By tailoring content to students' interests, these systems have the power to transform abstract subjects into engaging, meaningful learning experiences. LLMs can take personalized","words":87},{"id":"87029083","date":"2025-01-19","title":"Questioning Without Presuppositions","summary":"Questioning Without Presuppositions Core Idea: Don’t embed unverified assumptions directly in your main question. Practi","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-87029083","body":"- **Core Idea**: Don’t embed unverified assumptions directly in your main question.\n- **Practical Tip**: Turn any unverified assumption into (1) a separate question to establish the fact, or (2) a conditional (“If P then Q?”).\n- **Result**: You maintain logical rigor (no hidden premises) yet still can explore scenarios where a presupposition might *or* might not hold.\nThis is *QUESTION SCIENCE*.\n\n**Treat questions with unestablished presuppositions as conditional or hypothetical** rather than outright *un-askable.* In other words:\n\n1. **Explicitly Acknowledge the Presupposition**\n\n    - Instead of “Do we punish Bob for not returning the library book?” you might say:\n\n      “*If* Bob indeed checked out a book and has not returned it, *then* do we punish Bob?”\n    - This way, you **surface** the presupposition (that Bob checked out a book) instead of **embedding** it in the question.\n2. **Use Conditional or Hypothetical Questions**\n\n    - Formally, pose questions of the form “If P(x, then Q(x)?” rather than presupposing P(x) is true.\n    - This approach is recognized in logic and philosophy as *conditional reasoning* or *hypothetical reasoning.*\n    - When the premise P(x) is verified, you can continue with Q(x). Otherwise, you discard that line of questioning or reframe it.\n3. **Meta-Questions**\n\n    - If you need to explore whether P(x) is true, ask a *meta-question* first: “Is P(x) true?” This clarifies the basis for subsequent lines of questioning.\n    - Only if the meta-question verifies P(x), you then proceed to “Given P(x), Q(x)?”\n4. **Interrogative Logic**\n\n    - In *interrogative logic* (developed by Jaakko Hintikka and others), you systematically separate *search questions* (to verify presuppositions) from *logical inference steps.*\n    - Example:\n\n          - (1) **Search question**: “Is there a King of France?”\n          - (2) **If answer is yes**: “Then what is his name?”\n          - (3) **If answer is no**: “Then does the phrase ‘King of France’ refer to a historical or imaginary role?”\nBy making each presupposition an explicit *if/then* (conditional) or raising it as a separate question, you combine **logical rigor** with **practical flexibility**. You avoid burying unverified assumptions inside your main question while allowing your inquiry to explore uncertain territory—rather than stopping dead whenever a presupposition is not yet established.\n\n[https://prodsense.substack.com/p/good-questions-bad-questions?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=false](https://prodsense.substack.com/p/good-questions-bad-questions?r=ad6w7&utm_campaign=post&utm_medium=web&showWelcomeOnShare=false)\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/0165ccfb-f2d4-4777-a2b1-1b592fa34270_1024x1024.webp)\n2. [Good Questions, Bad Questions](https://prodsense.substack.com/p/good-questions-bad-questions)","discussion":"","replyCount":0,"excerpt":"- Core Idea: Don’t embed unverified assumptions directly in your main question. - Practical Tip: Turn any unverified assumption into (1) a separate question to establish the fact, or (2) a conditional (“If P then Q?”). - Result: You maintain logical rigor (no hidden premises) yet still can explore scenarios where a presupposition might or might not hold. Thi","words":363},{"id":"87152668","date":"2025-01-19","title":"The arts must end up saying something explicit with all their implicitness.","summary":"The arts must end up saying something explicit with all their implicitness.","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-87152668","body":"##### Attachments\n\n1. [Notice What This Poem Is Not Doing by William Stafford](https://allpoetry.com/Notice-What-This-Poem-Is-Not-Doing)","discussion":"","replyCount":0,"excerpt":"Attachments 1. Notice What This Poem Is Not Doing by William Stafford","words":12},{"id":"86844603","date":"2025-01-18","title":"Learn to teach to learn.","summary":"Learn to teach to learn.","sourceCategory":"Learning, education, and curiosity","category":"Life & learning","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-86844603","body":"[https://pubmed.ncbi.nlm.nih.gov/39432340/](https://pubmed.ncbi.nlm.nih.gov/39432340/)\n\n##### Attachments\n\n1. [The paradox of explaining: When feeling unknowledgeable prevents learners from engaging in effective learning strategies - PubMed](https://pubmed.ncbi.nlm.nih.gov/39432340/)","discussion":"","replyCount":0,"excerpt":"https://pubmed.ncbi.nlm.nih.gov/39432340/ Attachments 1. The paradox of explaining: When feeling unknowledgeable prevents learners from engaging in effective learning strategies - PubMed","words":20},{"id":"86920689","date":"2025-01-18","title":"Where Power Rests and How Some Norms Form","summary":"Where Power Rests and How Some Norms Form In Hume’s paradox, it’s puzzling that so many obey so few. Taleb’s “intolerant","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-86920689","body":"In Hume’s paradox, it’s puzzling that so many obey so few. Taleb’s “intolerant minority” clarifies it: a rigid, unyielding few can overrule a more flexible majority. Their uncompromising stance sets norms others conform to, revealing how the many often get governed by the few.","discussion":"","replyCount":0,"excerpt":"In Hume’s paradox, it’s puzzling that so many obey so few. Taleb’s “intolerant minority” clarifies it: a rigid, unyielding few can overrule a more flexible majority. Their uncompromising stance sets norms others conform to, revealing how the many often get governed by the few.","words":44},{"id":"86914721","date":"2025-01-18","title":"Using a custom Transformer with only 21s of fMRI data, researchers predict brain states 5s ahead with 0.997…","summary":"Using a custom Transformer with only 21s of fMRI data, researchers predict brain states 5s ahead with 0.997 correlation.","sourceCategory":"Science, emergence, and reality","category":"AI & future work","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-86914721","body":"Using a custom Transformer with only 21s of fMRI data, researchers predict brain states 5s ahead with 0.997 correlation. Short sequences suffice to capture functional connectivity, enabling accurate short-term forecasts and potential use in time-limited clinical scans.\n\n[https://arxiv.org/abs/2412.19814](https://arxiv.org/abs/2412.19814)\n\n##### Attachments\n\n1. [Predicting Human Brain States with Transformer](https://arxiv.org/abs/2412.19814)","discussion":"","replyCount":0,"excerpt":"Using a custom Transformer with only 21s of fMRI data, researchers predict brain states 5s ahead with 0.997 correlation. Short sequences suffice to capture functional connectivity, enabling accurate short-term forecasts and potential use in time-limited clinical scans. https://arxiv.org/abs/2412.19814 Attachments 1. Predicting Human Brain States with Transfo","words":46},{"id":"86559856","date":"2025-01-16","title":"Planning Evolves Alongside Execution","summary":"Planning Evolves Alongside Execution We expect and long to have the past back and drive what’s next and distrust the pre","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-86559856","body":"We expect and long to have the past back and drive what’s next and distrust the present, which is why we create roadmaps (and backlogs). But they create a feeling of debt. They can become order-dependent, making it hard to drop things if things get stuck, and they are often inflexible once they are shared. They treat strategy as a problem in deduction, which assumes anything worth knowing is already known. The hope is to create some kind of a prime radiant. It says, planning is one thing, executing another, and discovery has nothing to do with it.\n\nRoadmaps, even described at higher altitudes, build up accumulated variance, which rises proportional to the square root of the time period. This means slippage rises exponentially with duration, e.g., a roadmap twice the duration can experience 16 times as much slippage from the original plan. Why waste time on it when each step knows more than all our thinking?\n\nIn ever-changing environments, prioritize adaptability over rigid planning, refraining from commitments extending beyond a 50-day timeframe. We figure things out as we go. It’s as simple as that. Continuous adjustment. We’ll do that regardless, with or without a plan or target.\n\nThere’s no nav in software product design and development. There are phases. You do something, and then you see the next step. It is incremental, not monotonic. You need to be ready to make decisions at any point in time.\n\nDon’t plan all at once; plan along the way. Tell people what to expect more frequently, versus imagining and making bold guesses. You can make decisions as you go. You can make things up as you go. It’s not a scary thing. You’re still making decisions. You’re still being thoughtful and thinking things through, and you can let yourself do this more frequently. There’s nothing magical about doing it all at once…in the past. We can also avoid thrashing around by locking in what we wanna do for the next 30 to 50 business days. This lets us see meaningfully large and important things through and ship software on the regular.\n\nCan you think of ALL the right work in advance?\n\nInstead of suitably detailed long-horizon plans/forecasts, specify the end state, its purpose, and the minimal possible constraints. Be sure to address the following two constraints to stay focused on a distinct path when developing new products:\n\n- State the transient trends and the enduring truths in your vertical, and how the business model works.\n- State what the product will be more and less about and why ([https://substack.com/@mattlane/note/c-86447328](https://substack.com/@mattlane/note/c-86447328)).\n\n    - Help your team learn how to think, and not what to do.\n\n      Don’t plan, prepare. An artifact that doesn’t tell you what’s ahead, but something that teaches you how to act when the future arrives. A future you hopefully co-create.\nCounterintuitively, sometimes—especially in creative problem-solving endeavors—modeling the messiness of reality requires being imprecise or approximate. Imprecise wiggle room often better reflects what’s truly happening than basing conclusions on a precise but false premise.\n\nLearn to accept the discontinuity between artifacts as plans and the work itself.\n\n“Feel” as an outcome of understanding is a much better guide at this altitude. Just because you cannot see far out from where you are presently doesn’t mean you aren’t on the right path or not doing something radically important. Stay present. Do what you think and feel, and not only do what you have thought. Why should I defer to the ‘best guess’ of my past self when I’ve got better eyes now? Before was just now, then. Why not look at now, now? That’s when we know the most about a given thing anyway.\n\nWe must not live ad interim and look upon the present as something to be put up with while it lasts, serving only as a means to our goal. \n\nProgress and flux. The defining properties of life itself. \n\nInstead of using artifacts like roadmaps, put a narrative together about the vision. Speak to what is forever (what won’t change), what needs to change, where to act given the leverage you have, what could cause this vision to fail, and why you are here.\n\nThen, empower talent (your teams) to navigate through customer strategy with coherent action, act, and back-brief on outcomes. We need strong systems to ensure that the many small economic decisions have an impact. This is where you get the biggest bang for your buck when you begin to move fast, i.e., strategy (*intentionally directed actions*) moves downstream to the local levels…the teams.\n\nNo matter how tempting it is to believe in it, the distant objective cannot guide us to itself — it is the ultimate false compass and just eats up time that could be spent on real things.\n\nDon’t outsource decisions to ghosts of past reasoning and think you are improving by applying post hoc rationalization. You’ll always know more now than you did then. Planning is not about freezing decisions in advance—it’s about preparing to *decide better* when the moment comes. The future doesn’t need a blueprint. It needs a team equipped with eyes open, minds sharp, and hands ready. That’s how we get real traction: not by remembering
