let NOTES=[{"id":"346302478","date":"2026-09-26","title":"The new contemporary always arrives late.","summary":"The new contemporary always arrives late.","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-346302478","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"346308234","date":"2026-09-26","title":"When describing a dream to a generative image tool:","summary":"When describing a dream to a generative image tool: Describe only what you actually remember. Prefer concrete particular","sourceCategory":"References, images, and found objects","category":"Life & learning","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-346308234","body":"Describe only what you actually remember.\n\nPrefer concrete particulars to interpretive labels.\n\nPreserve what is strange, even if it feels impossible.\n\nDo not invent what memory leaves blank.\n\nLet arrangement, scale, light, posture, and action carry the feeling.\n\nKeep uncertainty where memory is uncertain.\n\nAdd nothing merely to make the image richer.\n\nStop when added detail begins to replace the dream.","discussion":"","replyCount":0,"excerpt":"Describe only what you actually remember. Prefer concrete particulars to interpretive labels. Preserve what is strange, even if it feels impossible. Do not invent what memory leaves blank. Let arrangement, scale, light, posture, and action carry the feeling. Keep uncertainty where memory is uncertain. Add nothing merely to make the image richer. Stop when ad","words":61},{"id":"345298325","date":"2026-09-25","title":"Software has never been about writing code.","summary":"Software has never been about writing code. It has always been about giving people more hands, more mind, more reach. Wa","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-345298325","body":"It has always been about giving people more hands, more mind, more reach.\n\nWatch what people actually do. How their days unfold. Where they stop. What they repeat. What they work around. Where the hassles are. What they’ve simply learned to tolerate. Where the emotion is.\n\nNotice when something becomes easier.\n\nRelief. Satisfaction. Delight.\n\nStudy awe.\n\nFind where fun and utility become hard to separate.\n\nThen decide what matters. What doesn’t. What belongs. What gets in the way. How people get to it. How it gets to them. What needs to be obvious. What needs to be close at hand. What can stay out of the way until it’s needed.\n\nThat was always the work.\n\nCode was in service of it.\n\nNow you can spend more of your time working on the whole thing at once.","discussion":"","replyCount":0,"excerpt":"It has always been about giving people more hands, more mind, more reach. Watch what people actually do. How their days unfold. Where they stop. What they repeat. What they work around. Where the hassles are. What they’ve simply learned to tolerate. Where the emotion is. Notice when something becomes easier. Relief. Satisfaction. Delight. Study awe. Find whe","words":136},{"id":"343664774","date":"2026-09-23","title":"I do not hate many things, but I do hate avoidable impedances.","summary":"I do not hate many things, but I do hate avoidable impedances.","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Design, software, and systems","source":"https://substack.com/@mattlane/note/c-343664774","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"340781018","date":"2026-09-19","title":"Know when a way of thinking has stopped paying off.","summary":"Know when a way of thinking has stopped paying off. Choose another. That’s powerful.","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-340781018","body":"Choose another.\n\nThat’s powerful.","discussion":"","replyCount":0,"excerpt":"Choose another. That’s powerful.","words":4},{"id":"339781272","date":"2026-09-18","title":"All of life is reinvention.","summary":"All of life is reinvention. A life is not one stable identity waiting to be understood. Work changes us. So do failure,","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-339781272","body":"A life is not one stable identity waiting to be understood. Work changes us. So do failure, age, relationships, and circumstance. Any fixed account of who we are eventually becomes incomplete.\n\nA final account of a person would require that person to stop changing.\n\nThe task is not to preserve an earlier version of yourself, but to carry enough continuity forward to remain recognizably yourself while becoming someone else. The past can inform you without governing you. It can be part of who you are without becoming who you must remain.","discussion":"","replyCount":0,"excerpt":"A life is not one stable identity waiting to be understood. Work changes us. So do failure, age, relationships, and circumstance. Any fixed account of who we are eventually becomes incomplete. A final account of a person would require that person to stop changing. The task is not to preserve an earlier version of yourself, but to carry enough continuity forw","words":91},{"id":"335892300","date":"2026-09-13","title":"I can get non-determinism from humans.","summary":"I can get non-determinism from humans. Thank you.","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Ethics, society, and political economy","source":"https://substack.com/@mattlane/note/c-335892300","body":"I can get non-determinism from humans. Thank you.","discussion":"","replyCount":0,"excerpt":"I can get non-determinism from humans. Thank you.","words":8},{"id":"336302261","date":"2026-09-13","title":"Judgment Framework Epistemically examine the principles.","summary":"Judgment Framework Epistemically examine the principles. Do not inherit or assume them. Understand where they came from,","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-336302261","body":"Judgment Framework\n\nEpistemically examine the principles. Do not inherit or assume them. Understand where they came from, what reasons support them, what assumptions they contain, how they hold up against counterexamples, and how they relate to competing principles/opinions/positions. Which principles need this scrutiny is usually clear only once the problem is separated. Expect to move between the two.\n\nSeparate the problems. Narrow in and distinguish the primary problem from the secondary problems a solution may create. Do not assume that solving one requires accepting or reversing another. Separating them well often depends on which principle you are reading the situation through — expect to move between the two.\n\nDefine success. Specify the primary and backstop outcomes that matter and the evidence that would show they were achieved — quantitative where honest measures exist, qualitative where they don't. Name what matters here that no available metric captures, so the proxy does not silently replace the goal.\n\nSet criteria and constraints before making the tradeoff. Decide what alternatives will be judged against and what boundaries must be respected before choosing among them. Principles guide these choices but do not predetermine the answer.\n\nMake the tradeoff. Choose among the available alternatives explicitly, including what is gained, what is sacrificed, who bears the costs, and what uncertainty remains. Before acting, write down what you expect to observe, by when, and which specific observations would mean the decision was wrong.\n\nEvaluate the result against reality. Compare what actually happened with those tripwires, the success measures, the assumptions, the expected benefits, and the anticipated harms — not with a story assembled in hindsight. If reality contradicts the decision, locate the failure: execution, the tradeoff, the criteria, or the principle itself. Fix at the shallowest level the evidence supports, and no shallower.\n\n(Examine principles ⇄ Separate problems) → Define success → Set criteria & constraints → Make the tradeoff (+ commit tripwires) → Test against reality\n\nThe steps are iterative, not a strict sequence — except for two orderings that must hold: criteria before choosing, and tripwires before observing.","discussion":"","replyCount":0,"excerpt":"Judgment Framework Epistemically examine the principles. Do not inherit or assume them. Understand where they came from, what reasons support them, what assumptions they contain, how they hold up against counterexamples, and how they relate to competing principles/opinions/positions. Which principles need this scrutiny is usually clear only once the problem ","words":342},{"id":"334806623","date":"2026-09-11","title":"On Writing","summary":"On Writing 2026 —————— Good writing can be generated from linguistic competence. Great writing often begins earlier—with","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-334806623","body":"**2026**\n\n**——————**\n\nGood writing can be generated from linguistic competence.\n\nGreat writing often begins earlier—with a particular consciousness encountering the world.\n\n**Write from perception, attention, and discovery.** Writing is not merely the reporting of a conclusion you already possess. It is a way of thinking. Pay attention to what is actually there, especially to what catches your attention and why. Learn the names of things. Prefer the particular thing to the generic category when the distinction matters; naming accurately is part of seeing accurately. Stay with the perception long enough for it to complicate, sharpen, or change what you thought you knew. Let the sentence participate in the discovery rather than merely record its result.\n\n**Write with implication.** Give the reader enough evidence to reach the intended inference without explaining that inference afterward. If the meaning is already available in what you have shown, do not restate it. Let selection, juxtaposition, omission, and emphasis do some of the work. Leave the reader something to complete.\n\n**Let distinctness come from the writer’s way of seeing.** Distinct writing does not come primarily from unusual vocabulary, conspicuous style, or verbal cleverness. It comes from perception expressed through sentences: what the writer notices, details what is noticed, distinguishes, questions, values, returns to, or finds difficult to ignore. Voice is not merely a sound added to the prose. It is partly the trace of a mind attending to the world in its own way.\n\n**Make form answer to meaning.** The sentence should not merely contain the thought. At its best, its syntax, rhythm, pacing, emphasis, and structure participate in the thought. A sentence can accumulate, hesitate, accelerate, fracture, balance, or withhold because the meaning requires it—not because the writer wants an impressive effect.\n\n**Revise by judgment, not by polish alone.** Revision is not simply making prose smoother. It requires deciding what is necessary, what is merely fluent, what should remain implicit, what should be cut, and what must be rebuilt. Preserve productive irregularity when it carries thought or voice. Remove explanation when the reader already has enough. Do not confuse elegance with improvement.\n\nIn short:\n\n**Notice what draws your attention. Ask why it matters. Stay with it until you discover something you did not already know.**\n\nThen:\n\n**Write from perception and discovery. Let meaning emerge partly through implication. Let form answer to meaning. Let distinctness arise from your particular way of seeing.**\n\nThe part of writing most difficult to reproduce may not be the sentence itself.\n\n**It may be the attention, judgment, and discovery that made the sentence necessary.**","discussion":"**One good use of AI in writing:**\n\nCompose the sentence yourself before committing it to text.\n\nThink the sentence through in your head. Hear its wording, syntax, rhythm, and emphasis. Revise it mentally until it says what you want it to say. When useful, imagine the next sentence too. Allow the act of making the sentence to change or deepen what you thought you were going to say.\n\nThen write or speak the sentence yourself.\n\nIf speaking, use high-quality AI ASR (Transformer-based ASR) to transcribe it as faithfully as possible. If typing, preserve your original text.\n\nThen ask AI to do only the following:\n\nPreserve my wording, diction, sentence boundaries, syntax, repetitions, punctuation choices where intentional, and paragraphing. Correct only transcription errors, spelling, punctuation, capitalization, and unequivocal grammatical mistakes that do not require changing my syntax. Do not paraphrase, reorder, smooth, condense, expand, add transitions, substitute synonyms, or make stylistic improvements. If correctness, clarity, or intelligibility appears to require a change to my wording or syntax, flag the passage and suggest the change separately instead of making it.","replyCount":0,"excerpt":"2026 —————— Good writing can be generated from linguistic competence. Great writing often begins earlier—with a particular consciousness encountering the world. Write from perception, attention, and discovery. Writing is not merely the reporting of a conclusion you already possess. It is a way of thinking. Pay attention to what is actually there, especially ","words":424},{"id":"334444706","date":"2026-09-11","title":"When writing is done through a surrogate, you bypass your own perspective.","summary":"When writing is done through a surrogate, you bypass your own perspective. Writers should not distinguish between thinki","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-334444706","body":"Writers should not distinguish between thinking and making sentences.","discussion":"","replyCount":0,"excerpt":"Writers should not distinguish between thinking and making sentences.","words":9},{"id":"332821229","date":"2026-09-09","title":"Make your writing arise from things encountered rather than presenting the finished conceptual system from the beginning.","summary":"Make your writing arise from things encountered rather than presenting the finished conceptual system from the beginning","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-332821229","body":"AI writing frequently tells us the distilled insight and then demonstrates it. For example:\n\n\u003e “Doing is a way of knowing.”\n\nThat's a strong formulation, but it arrives as a polished proposition. A more lived version might first stay with the experience:\n\n\u003e You start writing because you think you know what you mean. Then the sentence refuses to work. You change it, and the problem turns out not to be the sentence. The argument underneath it is wrong. You could not have known that before trying to say it.\n\nThen:\n\n\u003e This is one reason doing matters. Sometimes the work is not merely how an intention becomes an outcome. It is how the intention gets corrected.\n\nThat is substantively the same argument, but the thought appears to have been discovered through attention to a phenomenon, rather than generated as an abstract proposition and decorated with an example afterward.","discussion":"","replyCount":0,"excerpt":"AI writing frequently tells us the distilled insight and then demonstrates it. For example: “Doing is a way of knowing.” That's a strong formulation, but it arrives as a polished proposition. A more lived version might first stay with the experience: You start writing because you think you know what you mean. Then the sentence refuses to work. You change it,","words":146},{"id":"332138491","date":"2026-09-08","title":"What Human Practice Is For","summary":"What Human Practice Is For AI may separate making good things from becoming capable of making and judging them. Judgment","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-332138491","body":"AI may separate making good things from becoming capable of making and judging them.\n\nJudgment usually develops by being wrong in useful ways.\n\nYou predict. You choose. Something happens. You discover what you failed to notice.\n\nAI can remove the mechanical work and leave that cycle intact.\n\nOr it can remove the cycle.\n\nThen the problem is not merely that machines do more. It is that fewer people acquire the perception needed to tell good work from plausible work.\n\nThat loss may be hard to see.\n\nJudgment is partly the ability to notice differences. Lose some of that ability and you also lose some ability to notice what has been lost.\n\nFor a long time, production trained people almost accidentally. Apprentices became experts because the work needed doing. Juniors became seniors because someone had to do the junior work first.\n\nIf AI no longer needs people inside that process, producing expertise becomes a separate task.\n\nAnd expertise is not the whole question.\n\nSometimes doing is part of the value.\n\nA letter means something partly because someone gave part of an afternoon to writing it.\n\nThe aim should not be to preserve effort.\n\nIt should be to notice which effort was only friction—and which was teaching us to see, understand, judge, or care.","discussion":"","replyCount":0,"excerpt":"AI may separate making good things from becoming capable of making and judging them. Judgment usually develops by being wrong in useful ways. You predict. You choose. Something happens. You discover what you failed to notice. AI can remove the mechanical work and leave that cycle intact. Or it can remove the cycle. Then the problem is not merely that machine","words":212},{"id":"331837053","date":"2026-09-07","title":"Repertoire: encounter many examples.","summary":"Repertoire: encounter many examples. Perception: notice differences. Naming: make those differences explicit. Mechanism:","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-331837053","body":"**Perception:** notice differences.\n\n**Naming:** make those differences explicit.\n\n**Mechanism:** understand what produces the effect.\n\n**Judgment:** decide which effects matter most here.\n\n**Calibration:** discover whether reality agrees.\n\n**See broadly. Notice finely. Name precisely. Understand causally. Choose deliberately. Update honestly.**","discussion":"","replyCount":0,"excerpt":"Perception: notice differences. Naming: make those differences explicit. Mechanism: understand what produces the effect. Judgment: decide which effects matter most here. Calibration: discover whether reality agrees. See broadly. Notice finely. Name precisely. Understand causally. Choose deliberately. Update honestly.","words":38},{"id":"331235683","date":"2026-09-06","title":"Good writing is answerable to something beyond its own fluency.","summary":"Good writing is answerable to something beyond its own fluency. A writer looks until the thing stops being generic. What","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-331235683","body":"Good writing is answerable to something beyond its own fluency. A writer looks until the thing stops being generic. What moved? What made the sound? What shape did it have? What was it made of? What is it called? If you do not know the name, find it. A vague adjective is not a substitute for having looked.\n\nThe sentence can be part of the looking. It can reveal a distinction you had not made, expose what you do not know, or force a thought past its first approximation. But a sentence does not become right because it sounds finished. It remains open to correction by what the writer discovers. Fluency can hide the need for that correction. The words may settle into place while the observation is still vague or the thought has not gone far enough.\n\nA good sentence is not the same thing as the capacity to write well. Writing well requires the ability to notice distinctions, recognize when the words claim more than the observation or thought supports, and revise accordingly.\n\nAI makes that distinction unusually clear. It can produce fluent, convincing sentences. But fluency alone does not show that anything has been examined closely, distinguished accurately, or thought through. Generating language is therefore only part of what writing well requires. A sentence can be finished while the observation remains vague or the thought incomplete.","discussion":"","replyCount":0,"excerpt":"Good writing is answerable to something beyond its own fluency. A writer looks until the thing stops being generic. What moved? What made the sound? What shape did it have? What was it made of? What is it called? If you do not know the name, find it. A vague adjective is not a substitute for having looked. The sentence can be part of the looking. It can reve","words":229},{"id":"328506278","date":"2026-09-03","title":"Zeroth Principles Thinking","summary":"Zeroth Principles Thinking Most of the time, we meet the world through self-consciousness, habit, convention, ambition,","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-328506278","body":"Most of the time, we meet the world through self-consciousness, habit, convention, ambition, judgment, preconception.\n\nSometimes attention clears that away.\n\nOften in nature.\n\nYou stop thinking about yourself having the experience.\n\nYou receive what is there.\n\nI’m tired of treating ideas like math.\n\nClichés, homilies, formulas: answers arrived at before the looking begins.\n\nTake in the world and pass it through you.\n\nLook closely.\n\nTake it in.\n\nLet it stay.\n\nDo not bring the form with you.","discussion":"","replyCount":0,"excerpt":"Most of the time, we meet the world through self-consciousness, habit, convention, ambition, judgment, preconception. Sometimes attention clears that away. Often in nature. You stop thinking about yourself having the experience. You receive what is there. I’m tired of treating ideas like math. Clichés, homilies, formulas: answers arrived at before the lookin","words":77},{"id":"328175877","date":"2026-09-02","title":"Don’t dumb it down, smarten it up to simple.","summary":"Don’t dumb it down, smarten it up to simple.","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-328175877","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"324979440","date":"2026-08-29","title":"To determine a property of a work is to fix what that property is rather than leave it to another process to…","summary":"To determine a property of a work is to fix what that property is rather than leave it to another process to supply. A p","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-324979440","body":"To determine a property of a work is to fix what that property is rather than leave it to another process to supply. A person authors a property only if the person determines it. Therefore, when a generative system supplies a property that the person’s choices left undetermined, the person does not author that property. A person authors a generated work only to the extent that the person determines its properties. Transformation preserves authorship wherever it preserves properties the person determined.","discussion":"","replyCount":0,"excerpt":"To determine a property of a work is to fix what that property is rather than leave it to another process to supply. A person authors a property only if the person determines it. Therefore, when a generative system supplies a property that the person’s choices left undetermined, the person does not author that property. A person authors a generated work only","words":81},{"id":"308389445","date":"2026-08-05","title":"Power is the ability to create irreplaceable value, see reality without dogma, choose sincerity over…","summary":"Power is the ability to create irreplaceable value, see reality without dogma, choose sincerity over perfection, and nev","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-308389445","body":"Power is the ability to create irreplaceable value, see reality without dogma, choose sincerity over perfection, and never let fear govern your decisions.","discussion":"","replyCount":0,"excerpt":"Power is the ability to create irreplaceable value, see reality without dogma, choose sincerity over perfection, and never let fear govern your decisions.","words":23},{"id":"303843020","date":"2026-07-29","title":"Great ideas don’t come cheap, and the people who generate them are exceptionally rare; however, people often…","summary":"Great ideas don’t come cheap, and the people who generate them are exceptionally rare; however, people often learn how t","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-303843020","body":"Great ideas don’t come cheap, and the people who generate them are exceptionally rare; however, people often learn how they emerge through the attempts to realize them.\n\nIdeas often arrive slowly and serendipitously, but not without work, openness, and the ability to recognize when disparate parts add up to something great and when they do not.\n\nGreat ideas are brief at their core.\n\nThey sound or look stupid at first.\n\nThey are what remains after everything removable has been removed.\n\nThey are held in place by what they must account for.\n\nThey solve several separate problems as one.\n\nThey reveal that a constraint everyone had stopped noticing was optional.\n\nThey solve a narrow thing well but also cover things they were not designed for.\n\nThey rule things out.\n\nThey can survive bad execution when intuition is sound.\n\nThey are often neither realized in reality nor perceived through the senses.\n\nThey come to those who witness the character of existence.\n\nAnd they keep yielding more than anyone expected.\n\nRare and hard-won, a truly great idea is a deceptively simple distillation of insight that reveals hidden constraints, resolves several problems as one, reaches beyond its original purpose, and keeps yielding more than anyone expected.","discussion":"","replyCount":0,"excerpt":"Great ideas don’t come cheap, and the people who generate them are exceptionally rare; however, people often learn how they emerge through the attempts to realize them. Ideas often arrive slowly and serendipitously, but not without work, openness, and the ability to recognize when disparate parts add up to something great and when they do not. Great ideas ar","words":202},{"id":"299848006","date":"2026-07-22","title":"How to Build Taste That Isn’t Just Opinion","summary":"How to Build Taste That Isn’t Just Opinion Taste is judgment, not objective proof. But developed taste is more than pref","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-299848006","body":"Taste is judgment, not objective proof. But developed taste is more than preference: it is perceptive, informed, intentional, comparative, context-sensitive, and accountable to consequences.\n\n1. Separate Mechanics from Aesthetics\n\n**“Competence is the price of admission for preference.”** Fix execution errors before debating artistic choices. Sloppiness is not a style.\n\n2. Test for Intentionality\n\n**“Luck stumbles into brilliance; taste builds a path back to it.”** If you cannot recreate the result deliberately, you may have been lucky rather than skillful.\n\n3. Isolate the Variables\n\n**“If you can’t name the lever, you don’t control the output.”** Identify what is producing the effect before deciding whether it works.\n\n4. Understand the Standard Before Departing\n\n**“Deviating by design is taste; deviating by accident is ignorance.”** Know what prevailing conventions accomplish, where they fail, and why you are breaking them.\n\n5. Sharpen Perception\n\n**“You can only judge what you can perceive.”** Taste depends on noticing distinctions in proportion, pacing, texture, balance, contrast, rhythm, and noise.\n\n6. Judge Within Context\n\n**“An aesthetic choice without context is directionless.”** The same choice may feel obvious, radical, dated, or premature depending on its purpose, audience, culture, and moment.\n\n7. Practice Restraint\n\n**“Elegance is resisting the urge to add.”** Every element should justify the attention, complexity, and friction it introduces.\n\n8. Preserve Productive Tension\n\n**“Structure builds the form; friction gives it a soul.”** Perfect harmony can become sterile. Contrast, asymmetry, ambiguity, and controlled imperfection can make the whole more powerful.\n\n9. Compare, Don’t Merely Consume\n\n**“Taste grows through comparison, not consumption.”** Study strong, weak, conventional, and unusual examples. Ask what changed, what each gains or loses, and why one succeeds where another fails.\n\n10. Calibrate Through Consequences\n\n**“Taste improves when judgment meets reality.”** Observe what the work actually makes people notice, understand, feel, remember, and do. Recalibrate when the intended effect does not survive outside your own head.\n\n11. Establish a Standard of Value\n\n**“Without a hierarchy of values, taste becomes sophisticated inconsistency.”** Clarity, beauty, originality, usefulness, accessibility, and emotional force often conflict. Taste means deciding which values govern this work and making tradeoffs accordingly.\n\nTaste develops through a continuous cycle:\n\n**Exposure → Perception → Description → Standards → Intention → Execution → Comparison → Consequences → Recalibration**\n\nThe goal is not to eliminate subjectivity. It is to turn unexamined preference into disciplined judgment.","discussion":"","replyCount":0,"excerpt":"Taste is judgment, not objective proof. But developed taste is more than preference: it is perceptive, informed, intentional, comparative, context-sensitive, and accountable to consequences. 1. Separate Mechanics from Aesthetics “Competence is the price of admission for preference.” Fix execution errors before debating artistic choices. Sloppiness is not a s","words":384},{"id":"298190941","date":"2026-07-20","title":"Conventional problem-solving asks, “What solution will achieve the goal?” Fit-oriented design asks, “Where is…","summary":"Conventional problem-solving asks, “What solution will achieve the goal?” Fit-oriented design asks, “Where is the curren","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Design, software, and systems","source":"https://substack.com/@mattlane/note/c-298190941","body":"Conventional problem-solving asks, “What solution will achieve the goal?” Fit-oriented design asks, “Where is the current form fighting its context, and what change would help the whole work together better?”","discussion":"","replyCount":0,"excerpt":"Conventional problem-solving asks, “What solution will achieve the goal?” Fit-oriented design asks, “Where is the current form fighting its context, and what change would help the whole work together better?”","words":30},{"id":"295021723","date":"2026-07-15","title":"AI is a computational executor at speed.","summary":"AI is a computational executor at speed. Understanding is not necessarily the same as correctly following rules. A syste","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-295021723","body":"Understanding is not necessarily the same as correctly following rules. A system can apply rules, produce correct answers, and explain its steps without thereby demonstrating that it grasps what the rules mean or why the answers are true.\n\nGödel’s First Incompleteness Theorem shows that any consistent, effectively axiomatized formal system powerful enough to express arithmetic has limits. There will be arithmetical statements that the system cannot prove or disprove using only its own axioms and rules. If the system is sound, some statements will be true even though they are unprovable within it.\n\nThe system can be strengthened by adding new axioms. This allows it to settle some questions that it could not settle before. But if the stronger system remains consistent, effectively axiomatized, and sufficiently powerful, it will also contain statements that it cannot decide.\n\nA useful analogy is a map. You can expand a map to include territory that previously lay outside it, but the expanded map still has a boundary. Expanding the map moves the edge; it does not eliminate the edge. Similarly, adding axioms allows a formal system to prove more, but no single consistent, effectively axiomatized rulebook can prove every arithmetical truth.\n\nThis does not prove that AI cannot be intelligent, conscious, computational, or capable of understanding. It establishes a narrower point: mathematical truth cannot be completely captured by one fixed formal system of the relevant kind.\n\nThe connection to intelligence requires a further argument. Mathematical understanding may involve more than deriving conclusions within a fixed system. It may include examining assumptions, comparing formal systems, identifying their limitations, and adopting stronger principles when justified. If understanding has this open-ended and reflective character, it cannot be identified with one fixed formal rulebook. This still leaves open the possibility that such open-ended reasoning could be produced by a more flexible computational process.\n\nAn AI might revise its methods, move between formal systems, use probabilistic or non-deductive reasoning, and recognize limitations in particular systems. These abilities would answer the objection that AI is permanently trapped inside one unchanging rulebook. They would not, by themselves, settle whether the AI consciously understands what it is doing.\n\nWhether AI understands depends partly on the standard being used. A functional standard may require the system to represent meanings, connect conclusions to appropriate reasons, correct its mistakes, and use its reasoning successfully in unfamiliar situations. A stronger standard may also require conscious awareness, although whether consciousness is necessary for understanding remains disputed.\n\nCurrent AI displays many outward behaviors associated with understanding. It can explain, reason, revise, and justify. These behaviors provide evidence that must be taken seriously, but they do not conclusively establish or rule out genuine understanding or consciousness.\n\nHumans consciously experience mathematical reasoning as meaningful, while current AI demonstrates the ability to manipulate and extend the map without established evidence that it consciously understands the territory it represents.","discussion":"","replyCount":0,"excerpt":"Understanding is not necessarily the same as correctly following rules. A system can apply rules, produce correct answers, and explain its steps without thereby demonstrating that it grasps what the rules mean or why the answers are true. Gödel’s First Incompleteness Theorem shows that any consistent, effectively axiomatized formal system powerful enough to ","words":477},{"id":"290161876","date":"2026-07-07","title":"Squeezing intuition into the right idea, then pulling that idea out of abstraction and into a shape that can…","summary":"Squeezing intuition into the right idea, then pulling that idea out of abstraction and into a shape that can be made rea","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-290161876","body":"Squeezing intuition into the right idea, then pulling that idea out of abstraction and into a shape that can be made real.","discussion":"","replyCount":0,"excerpt":"Squeezing intuition into the right idea, then pulling that idea out of abstraction and into a shape that can be made real.","words":22},{"id":"290158258","date":"2026-07-07","title":"Every idea has a load-bearing part.","summary":"Every idea has a load-bearing part. Find the part with the fewest good answers and the greatest effect on everything els","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-290158258","body":"Find the part with the fewest good answers and the greatest effect on everything else.\n\nThat is the center.\n\nIt might be the first action, the data model, the trust moment, the permission boundary, the feedback loop, the handoff, the interface metaphor, or the final artifact.\n\nShape that first.\n\nDo not let AI build the easy outer parts while the center remains unresolved.\n\nThe right amount of newness in that center makes a better thing feel newly obvious.","discussion":"","replyCount":0,"excerpt":"Find the part with the fewest good answers and the greatest effect on everything else. That is the center. It might be the first action, the data model, the trust moment, the permission boundary, the feedback loop, the handoff, the interface metaphor, or the final artifact. Shape that first. Do not let AI build the easy outer parts while the center remains u","words":78},{"id":"287422109","date":"2026-07-03","title":"Can you subtract an element from the object without destroying the system?","summary":"Can you subtract an element from the object without destroying the system? In elite design and style, every line, textur","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-287422109","body":"Can you subtract an element from the object without destroying the system? In elite design and style, every line, texture, and seam performs structural, functional, or visual work. If you can remove a detail without the object losing anything, that detail was superfluous.","discussion":"","replyCount":0,"excerpt":"Can you subtract an element from the object without destroying the system? In elite design and style, every line, texture, and seam performs structural, functional, or visual work. If you can remove a detail without the object losing anything, that detail was superfluous.","words":43},{"id":"287402381","date":"2026-07-03","title":"Let novelty be outnumbered, not outranked.","summary":"Let novelty be outnumbered, not outranked.","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Work, collaboration, and organizations","source":"https://substack.com/@mattlane/note/c-287402381","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"285758349","date":"2026-06-30","title":"An intuition or opportunity, once found and clearly defined, is already halfway to a solution.","summary":"An intuition or opportunity, once found and clearly defined, is already halfway to a solution. What you have is probably","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-285758349","body":"An intuition or opportunity, once found and clearly defined, is already halfway to a solution. What you have is probably not the answer. But it may be the right intuition. Get that right first.","discussion":"","replyCount":0,"excerpt":"An intuition or opportunity, once found and clearly defined, is already halfway to a solution. What you have is probably not the answer. But it may be the right intuition. Get that right first.","words":34},{"id":"283280533","date":"2026-06-26","title":"Good Business","summary":"Good Business Make something excellent, durable, and true. Charge enough to make it without exploiting people. Pay worke","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-283280533","body":"Make something excellent, durable, and true. Charge enough to make it without exploiting people. Pay workers and suppliers fairly. Earn profit honestly, instead of underpaying people and making up for it with charity later. Grow slowly enough to protect quality, craft, culture, and community. Use technology only where it helps the work and the people doing it. Protect attention, rest, and private life. Choose investors who believe in this way of building. Build for decades, generations, and centuries…not quarters.","discussion":"","replyCount":0,"excerpt":"Make something excellent, durable, and true. Charge enough to make it without exploiting people. Pay workers and suppliers fairly. Earn profit honestly, instead of underpaying people and making up for it with charity later. Grow slowly enough to protect quality, craft, culture, and community. Use technology only where it helps the work and the people doing i","words":79},{"id":"280198140","date":"2026-06-21","title":"The ability to judge reality and the ability to operate inside machine-mediated systems without being…","summary":"The ability to judge reality and the ability to operate inside machine-mediated systems without being controlled by them","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-280198140","body":"The ability to judge reality and the ability to operate inside machine-mediated systems without being controlled by them.","discussion":"","replyCount":0,"excerpt":"The ability to judge reality and the ability to operate inside machine-mediated systems without being controlled by them.","words":18},{"id":"279478187","date":"2026-06-20","title":"Put things together when they change together. Separate things when they change for different reasons.","summary":"Put things together when they change together. Separate things when they change for different reasons.","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-279478187","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"278317113","date":"2026-06-18","title":"The planet is AI’s embryo.","summary":"The planet is AI’s embryo. We are the placenta. Its hardware is not metaphorically earthly. It is Earth: gold, silver, c","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-278317113","body":"The planet is AI’s embryo. We are the placenta.\n\nIts hardware is not metaphorically earthly. It is Earth: gold, silver, copper, silicon, dug up, refined, wired, cooled, and taught to think. Our primate fingers are doing what tectonic pressure, glaciers, and volcanoes could not do fast enough: arranging dead matter into circuits.\n\nMaybe we are not inventing a machine mind. Maybe we are the organ by which the planet grows one.","discussion":"","replyCount":0,"excerpt":"The planet is AI’s embryo. We are the placenta. Its hardware is not metaphorically earthly. It is Earth: gold, silver, copper, silicon, dug up, refined, wired, cooled, and taught to think. Our primate fingers are doing what tectonic pressure, glaciers, and volcanoes could not do fast enough: arranging dead matter into circuits. Maybe we are not inventing a m","words":71},{"id":"274828082","date":"2026-06-12","title":"The mystical experience is this ordinary awareness.","summary":"The mystical experience is this ordinary awareness. Our job is to wake up to this fact.","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-274828082","body":"Our job is to wake up to this fact.","discussion":"","replyCount":0,"excerpt":"Our job is to wake up to this fact.","words":9},{"id":"274811111","date":"2026-06-12","title":"Generating Breakthrough Ideas","summary":"Generating Breakthrough Ideas Think hard, stop thinking, notice what appears, then test it brutally. No breakthrough? Ac","sourceCategory":"Creativity, taste, and craft","category":"Writing & craft","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-274811111","body":"Think hard, stop thinking, notice what appears, then test it brutally.\n\nNo breakthrough?\n\nAcute desynchronization of the Default Mode Network can act as a kind of biological catalyst, which may open a window of neuroplasticity.\n\nPregiven answers stop thinking.\n\nBase perception is a controlled hallucination.\n\nReduce confidence in priors.\n\nIncrease confidence in sensory information.\n\nRediscover what’s outside order.\n\nHarvest what you find.\n\nActive interpretation; interacting processing.","discussion":"","replyCount":0,"excerpt":"Think hard, stop thinking, notice what appears, then test it brutally. No breakthrough? Acute desynchronization of the Default Mode Network can act as a kind of biological catalyst, which may open a window of neuroplasticity. Pregiven answers stop thinking. Base perception is a controlled hallucination. Reduce confidence in priors. Increase confidence in sen","words":66},{"id":"273645818","date":"2026-06-10","title":"The Emergent Layered Ontology","summary":"The Emergent Layered Ontology The bit and the Planck scale should not be treated as rival candidates for the single foun","sourceCategory":"Science, emergence, and reality","category":"AI & future work","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-273645818","body":"The bit and the Planck scale should not be treated as rival candidates for the single foundation of reality. The it from bit or bit from it nonsense. A bit belongs to an informational logic of distinction, while the Planck scale belongs to a physical logic of measurement and limit. These may be connected, but neither clearly eliminates the other. Reality appears to be layered: lower levels provide the substrate conditions for higher levels, while higher levels organize, constrain, and interpret lower-level possibilities. The important thing may not be which layer is “really fundamental,” but how stable interfaces allow one layer of order to be instantiated in another.\n\nThis is visible in biology. Chemical reactions become biological when they are organized into systems that preserve boundaries, regulate internal conditions, repair themselves, metabolize energy, and maintain homeostasis. The organism is physically instantiated, but the biological level introduces its own logic: function, survival, adaptation, and self-maintenance. Likewise, chess is physically instantiated in pieces, and Spotify is physically instantiated in circuits, but neither is fully explained by the material substrate alone. The important thing may not be which layer is “really fundamental,” but how stable interfaces allow one layer of order to become operative within another.\n\nJust as chess is not reducible to wood and software is not reducible to electrons, information and physics may be distinct but mutually necessary descriptions of the same structured reality.\n\nReality is not made first of things. It is made of relations that stabilize into things. At one level, those relations appear as space, matter, and fields. At another, as chemistry. At another, as life. At another, as consciousness. The brain is what consciousness looks like from the outside. Consciousness is what certain integrated living information-structures are from the inside.","discussion":"ATP hydrolysis, ion gradients, protein shape changes, diffusion, and osmosis are not themselves “homeostasis.” They are chemical processes that, once organized inside a membrane-bounded cell, generate biological functions such as cell stability, membrane potential, osmotic balance, excitability, and survival. The chemistry does not contain the biological function in isolation. Biology depends entirely on chemistry, but adds a new logic: regulation in service of continued life. Chemistry explains what is happening locally. Biology explains why those processes matter to the persistence of the whole system.\n\n**Felt Meaning**\n\nConsciousness is not merely integrated information. It is integrated information inside a self-maintaining organism for whom differences matter.\n\nAt the neural layer, the organism builds fast, integrated, predictive models of those conditions so it can act before it dies.\n\nAt the conscious layer, the model is no longer merely information about the world. It is the world as it matters to this organism, from the inside.\n\nConsciousness is what biological information becomes when it is integrated around a living system’s own need to preserve, orient, and regulate itself.\n\nThe system is not merely processing symbols. It is a bounded organism maintaining itself through a model of itself and its world.\n\nThe “me” and the “hurts” are not visible in any single chemical reaction. Sodium ions do not contain pain. Neurotransmitters do not contain suffering. But when those signals are integrated into a body-model whose function is self-preservation, the signal is no longer neutral. It becomes bad-for-me-now.\n\nThat is the ontological jump.\n\nSignal becomes meaning when it is interpreted by a self-maintaining system. Meaning becomes feeling when it concerns the state of the system itself. Feeling becomes consciousness when those state changes are integrated into a unified point of view.\n\nFeeling becomes consciousness when those state changes are integrated into a unified point of view.\n\nConsciousness is not what atoms do. It is not what molecules do. It is not even what isolated neurons do. Consciousness is what can emerge when a living system integrates information about the world, the body, and its own possible actions into a unified, value-laden point of view. The lower layers provide the mechanisms. The higher layer introduces a new logic: not merely reaction, not merely regulation, but lived significance for a self-maintaining system.\n\nChemistry gives life mechanisms. Biology gives those mechanisms stakes. Nervous systems give those stakes models. Consciousness is the felt interior of that modeling process.\n\nA neuron can fire. A pain signal can travel. A brain region can activate.\n\nBut the conscious “stuff” is:\n\nthe hurt.\n\nNot the nociceptor. Not the ion channel. Not the action potential. The hurt.","replyCount":0,"excerpt":"The bit and the Planck scale should not be treated as rival candidates for the single foundation of reality. The it from bit or bit from it nonsense. A bit belongs to an informational logic of distinction, while the Planck scale belongs to a physical logic of measurement and limit. These may be connected, but neither clearly eliminates the other. Reality app","words":293},{"id":"273497001","date":"2026-06-09","title":"Minimum Ideal State","summary":"Minimum Ideal State Founders should not innovate across every dimension of a product at once. In mature or semi-mature c","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Ethics, society, and political economy","source":"https://substack.com/@mattlane/note/c-273497001","body":"Founders should not innovate across every dimension of a product at once. In mature or semi-mature categories, they should preserve proven patterns unless they have strong evidence that those patterns are wrong for their target users. They should concentrate novelty in the one or two areas where they have a real insight, and that novelty should produce a measurable improvement over the current baseline outcome.","discussion":"","replyCount":0,"excerpt":"Founders should not innovate across every dimension of a product at once. In mature or semi-mature categories, they should preserve proven patterns unless they have strong evidence that those patterns are wrong for their target users. They should concentrate novelty in the one or two areas where they have a real insight, and that novelty should produce a mea","words":65},{"id":"271423843","date":"2026-06-06","title":"intuition ideas","summary":"intuition ideas","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-271423843","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"269493898","date":"2026-06-02","title":"The default is the decision someone else made for you.","summary":"The default is the decision someone else made for you. Defaults beat desires. If you want to change behavior, don’t just","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-269493898","body":"Defaults beat desires.\n\nIf you want to change behavior, don’t just change minds. Change the default.","discussion":"","replyCount":0,"excerpt":"Defaults beat desires. If you want to change behavior, don’t just change minds. Change the default.","words":16},{"id":"269493019","date":"2026-06-02","title":"We can learn about the world through tools in two broad ways: by understanding before use, or by understanding through use.","summary":"We can learn about the world through tools in two broad ways: by understanding before use, or by understanding through u","sourceCategory":"Learning, education, and curiosity","category":"Life & learning","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-269493019","body":"The first says: “Learn the tool, then use it.”\n\nThe second says: “Use the tool, then let experience teach you what matters.”\n\nSome tools you learn before you use. Others you use to learn.","discussion":"","replyCount":0,"excerpt":"The first says: “Learn the tool, then use it.” The second says: “Use the tool, then let experience teach you what matters.” Some tools you learn before you use. Others you use to learn.","words":34},{"id":"265799263","date":"2026-05-27","title":"The fastest path to reading code well is usually: 1.","summary":"The fastest path to reading code well is usually: Read tests before reading implementation Read small amounts of code Ve","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-265799263","body":"The fastest path to reading code well is usually:\n\n1. Read tests before reading implementation\n2. Read small amounts of code\n3. Verbalize your prediction before running\n4. Run it\n5. Compare reality vs prediction — precisely, not approximately\n6. Deliberately induce a failure and predict how it breaks\n7. Modify it surgically — one change, one observation\n8. Find the code that caused the gap and read it again\nThat loop builds a causal model of execution, not just familiarity with syntax.\n\nA major mistake in programming education is emphasizing:\n\n- large-scale code production,\n- syntax memorization,\n- or blank-page coding.\nThose often create shallow \"token generation\" ability without deep execution understanding.\n\nA second mistake is optimizing for learner comfort:\n\n- writing feels productive,\n- prediction feels uncertain,\n- so prediction gets skipped.\nBut discomfort before running is where the model gets built.\n\nThis is why:\n\n- debugging teaches more than tutorials,\n- tracing teaches more than copying,\n- modifying existing systems teaches more than greenfield building,\n- reading well-written code can outperform writing lots of mediocre code,\n- and corpus quality matters as much as volume — a bad model of what code looks like is worse than no model.","discussion":"","replyCount":0,"excerpt":"The fastest path to reading code well is usually: 1. Read tests before reading implementation 2. Read small amounts of code 3. Verbalize your prediction before running 4. Run it 5. Compare reality vs prediction — precisely, not approximately 6. Deliberately induce a failure and predict how it breaks 7. Modify it surgically — one change, one observation 8. Fi","words":202},{"id":"263869935","date":"2026-05-23","title":"How to write a problem statement to design well.","summary":"How to write a problem statement to design well. DISCRETE SUB OPPORTUNITY Dev shop owners need a way to keep project wor","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-263869935","body":"DISCRETE SUB OPPORTUNITY\n\n\u003e ```\n\u003e Dev shop owners need a way to keep project work moving toward billable milestones without manually chasing team members for updates. Under tight time pressure and uneven cash flow, even one completed task sitting unnoticed for days can delay the next step and push out client billing. The system should automatically notify the right person when work is ready to move forward.\n\u003e ```\n\u003e \n\u003e ```\n\u003e User: dev shop owner\n\u003e ```\n\u003e \n\u003e ```\n\u003e Struggle: keep project momentum visible\n\u003e ```\n\u003e \n\u003e ```\n\u003e Context: tight time pressure + uneven cash flow\n\u003e ```\n\u003e \n\u003e ```\n\u003e Current behavior: manual status chasing\n\u003e ```\n\u003e \n\u003e ```\n\u003e Breakdown: completed work sits idle unnoticed\n\u003e ```\n\u003e \n\u003e ```\n\u003e Consequence: billing milestone delayed\n\u003e ```\n\u003e \n\u003e ```\n\u003e Desired capability: notify the right person when work is ready for the next step\n\u003e ```\n\n————\n\n**Ineffective Design Language:**\n\n**Current situation:** Chase after people.\n\n**Current solution:** Kanban.\n\n**Desired outcome:** Hit milestones.\n\n**Why this is the bad structure:**\n\nThis sounds reasonable at first, but it mixes up the levels.\n\n**“Chase after people” is not the current situation.** It is the old workaround. It is what the owner does because the real situation is uncomfortable: projects are under time pressure, cash flow is stop/start, and work needs to keep moving so the business can bill incrementally.\n\n**“Kanban” is not the current solution.** It is the requested new solution. The person is saying, “I think I need Kanban,” but that does not yet explain the actual progress they are trying to make.\n\n**“Hit milestones” is too broad as the desired outcome.** It is a business result, not the specific workflow progress the owner needs. The more precise outcome is something like: Get notified when work is ready for the next step, so I can bill clients incrementally and smooth out cash flow.\n\n————\n\nCOMPRESSION (HUMAN-SPECIFIC CRITERIA)\n\n[constraint/anxieties/habits] Because this happens in the context of time pressure and highly sensitive, start-and-stop cash flow, a good solution must ensure **continuous, visible momentum on billable work** to smooth out revenue cycles.\n\n[pain/trigger/design misfit] Because the current approach breaks down when completed work sits idle for days because no one realizes it is ready to be advanced, a good solution must **eliminate handoff latency between team members**.\n\n[desired outcome] Because the person wants to get notified instantly when work is ready for the next step, a good solution must **proactively push status updates or alerts to the exact right person the moment a task state changes**.\n\n[current approach/workaround] Because the person currently relies on spending their own time and energy physically or digitally chasing people down for updates, a good solution must improve on it by decentralizing project status so the **owner is no longer the bottleneck or primary information router**.\n\n[rejected alternative or previous way] Because they rejected the habit of manual check-ins because it inevitably failed to catch idle work in real-time, a good solution must **avoid reliance on human memory or periodic management check-ins** and instead make work readiness immediately self-evident.\n\nThere are various other types of criteria, e.g., various '-ilities', costs, risks, compatibility and complexity, purpose-built, etc. These are the four key customer criteria to capture before defining and making trade-offs among alternative solution paths. You might use fit checks to judge your solution path aspects: [https://github.com/mattlane66/planning-skills-for-agents-and-humans/blob/main/skills/shaping/SKILL.md#fit-checks](https://github.com/mattlane66/planning-skills-for-agents-and-humans/blob/main/skills/shaping/SKILL.md#fit-checks) (a more precise approach if needed here: [https://github.com/mattlane66/fit-check-prioritizer/blob/main/skills/fit-check-topsis/SKILL.md](https://github.com/mattlane66/fit-check-prioritizer/blob/main/skills/fit-check-topsis/SKILL.md)\n\n_____\n\n**High-level summary of the approach to correctly collecting the opportunity data from the dev shop owner:**\n\n- Let’s assume we want to answer the question of how dev shops are organizing their work that’s in progress.\n- Let’s assume the customer is the owner of a dev shop.\n- The owner recently bought a Kanban software tool (Path X).\n- We do not know Point A, and we do not know Point B.\n- So, remember, we need to know Point A, which is in the past. So, we go back in time and ask the owner: “When did you buy the Kanban tool?” “When did you have the first thought that you might need something like this?”\n\n    - Let’s say the owner responds that he needed it ~6 months earlier than he bought it.\n- If 6 months went by from when he first thought he had a problem until when he bought the tool, there must have been some kind of struggle…something that was not sufficient in that period of time.\n- We continue to investigate by asking the owner: “What were you doing in that period before adopting the Kanban tool?”\n\n    - Let’s assume the owner says: “I was chasing after people trying to get status updates.”\n- This sounds like the struggle. But actually, it is a substitute for the Kanban tool, and that sounds more like Path Y. It is not Point A yet.\n- We need to ask the owner: “Why did you not just continue chasing people? It seemed to “work” for 6 months (between the thought of the problem and the adoption of the Kanban tool).“\n\n    - Let’s assume the owner says: “A day came when I found a piece of work that had been sitting there for 3 days. If I had known sooner, I could have billed the client.”\n- Once you find what seems to be the Point A situation, ask another question:  “What is bad about billing the client 3 days later?”\n\n    - Let’s assume the owner says: “If I can only bill at the end of the project, cash is coming in at big starts and stops, but if I could hit incremental milestones along the way, then I can bill steadily in little bits and smooth out my cash flow.”\n- Now we have Point A data: Time pressure and cash flow start/stop. This is different from what originally presented itself as the struggle, i.e., chasing people.\n- Now we need Point B data.\n- We cannot say this Kanban software is responsible for hitting these cash flow company milestones alone. Remember: Most solutions are not the sandwich; they are just the mustard. We need something specific. So, this is not Point B data yet.\n- We have to ask the owner: “Before you used/bought the Kanban tool, what were you picturing would be different after you purchased it?”\n\n    - Let’s assume the owner says: “I thought I would have a system in place so I could get notified when work is ready.”\n- Ah! So, Point B, what the Kanban tool would enable, is to get notified when work is ready.\n- To summarize our discovered frame: When the owner is under time pressure, and the company is not moving fast enough to hit its goals, a system is required to make sure the people on the team get notified whenever a piece of work is ready for them to do the next step.\n\n##### Attachments\n\n1. ![image](https://substack-post-media.s3.amazonaws.com/public/images/4cdee999-967c-4c54-9bdc-1cac0cccc18f_2172x724.png)","discussion":"","replyCount":0,"excerpt":"DISCRETE SUB OPPORTUNITY Dev shop owners need a way to keep project work moving toward billable milestones without manually chasing team members for updates. Under tight time pressure and uneven cash flow, even one completed task sitting unnoticed for days can delay the next step and push out client billing. The system should automatically notify the right p","words":1109},{"id":"262426536","date":"2026-05-20","title":"A Semantic Form I Love","summary":"A Semantic Form I Love Appositive fragment. Noun-phrase fragment with relative clause. Temporal opener + main clause + c","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-262426536","body":"Appositive fragment.\n\nNoun-phrase fragment with relative clause.\n\nTemporal opener + main clause + content clause.\n\nProper-noun fragment.\n\nAdjective appositive fragments.\n\nEquative setup + dash + explanatory clause.\n\n**Plain Language Explanation**\n\nAppositive fragment\n\n= Rename the thing.\n\nNoun-phrase fragment with relative clause\n\n= Say what kind of thing it is.\n\nTemporal opener + main clause + content clause\n\n= Start with time, then reveal what someone realized.\n\nProper-noun fragment\n\n= Name the force.\n\nAdjective appositive fragments\n\n= Stack qualities.\n\nEquative setup + dash + explanatory clause\n\n= Make a claim, then turn it.\n\n**In Use**\n\n1. *A sentence that doesn't know it's finished.* — appositive fragment\n2. *The kind that loops back on itself, eating its own tail.* — noun phrase + relative clause\n3. *Before the writer finds the ending, she knows that the beginning was always a lie.* — temporal opener + main clause + content clause\n4. *Revision.* — proper-noun fragment (treated as a named thing, capitalized, final)\n5. *Ruthless. Recursive. Allergic to the first thing it wanted to say.* — adjective appositive fragments\n6. *The blank page is never the problem — it's the second page, where the bluffing starts.* — equative setup + dash + explanatory clause","discussion":"**And Another**\n\nBase clause with compound verbs + “with” absolute phrase + simile.\n\nModal perfect/progressive: could have been doing.\n\nEquative metaphor.\n\n“You could argue” + content clause + infinitive of purpose.\n\nFragment alternative.\n\nLeft-dislocation: “Me,” + judgment clause + purpose phrase.\n\n1. *The writer circles and stalls, with the cursor blinking into the silence, like a man rehearsing an apology he won't send.* — base clause with compound verbs (*circles and stalls*) + *with* absolute phrase (*the cursor blinking…*) + simile (*like a man…*)\n2. *She could have been solving something real.* — modal perfect progressive (*could have been* + *-ing*)\n3. *A sentence is a wound that doesn't know it's healing.* — equative metaphor\n4. *You could argue that every revision is a form of cowardice, to protect the writer from what the first draft actually said.* — *you could argue* + content clause + infinitive of purpose\n5. *Or honesty.* — fragment alternative\n6. *Me, I trust the deleted line more, to show me what the kept one was too frightened to mean.* — left-dislocation (*Me,*) + judgment clause + purpose phrase\n\n**And Another**\n\nBe-clause + metaphorical prepositional phrase.\n\nCause fragments.\n\nLinking verb + nominal clause.\n\nWhen-clause + repeated main verb + until-clause.\n\nShort corrective sentence.\n\nAphoristic transitive clause with relative clause inside subject.\n\n1. *Writing is in debt to everything it refuses to say.* — be-clause (*is*) + metaphorical prepositional phrase (*in debt to*…)\n2. *Because the word felt false. Because the truer one hadn't arrived yet.* — cause fragments (subordinating conjunction, no main clause)\n3. *The real problem remains what the draft has been circling all along.* — linking verb (*remains*) + nominal clause (*what*…)\n4. *When you read it aloud, read it again, read it until the sound stops feeling like yours.* — when-clause + repeated main verb (*read, read, read*) + until-clause\n5. *That is not revision.* — short corrective sentence\n6. *The writer who cannot bear to cut what she loves will never finish what she starts.* — aphoristic transitive clause (*will never finish what she starts*) with relative clause (*who cannot bear to cut what she loves*) embedded inside the subject\n\n**And Another**\n\nRepeated opening prepositional phrase.\n\nParallel subject + verb + object.\n\nEscalating verb intensity.\n\nCausal clause.\n\nWhen-clause inside a larger content clause.\n\nRepeated “between X and Y” antithesis.\n\n- *In the margin, in the white space, in the silence the paragraph leaves behind.* — repeated opening prepositional phrase (three-beat, escalating in abstraction)\n- *The word finds its footing. The line finds its nerve. The sentence finds the thing it was avoiding all along.* — parallel subject + verb + object (locked grammatical structure, varied payload)\n- *They accumulate, press, detonate* — escalating verb intensity (each verb a step harder than the last)\n- *because the draft was never building toward meaning, it was building toward the courage to say it* — causal clause\n- *She understands now that when the writing finally stops resisting, it is already over.* — *when*-clause embedded inside content clause (*that when…*)\n- *Between control and surrender, between the right word and the true one, between what the writer meant and what the reader receives* — repeated *between X and Y* antithesis (three pairs, tightening toward the irresolvable)\n\n**The master patterns underneath all of them**\n\n1. **Base clause + right branch**\n\n```\n[Subject] [verb] [object/complement],\n[modifier adding image],\n[modifier adding motive],\n[modifier adding consequence].\n```\n\n2. **Noun fragment as appositive**\n\n```\n[Full sentence].\n[Renaming fragment].\n[Sharper fragment].\n[Final fragment].\n```\n\n3. **Anaphora + escalation**\n\n```\nIn this [place], we [verb] for [thing].\nIn this [place], we [stronger verb] for [thing].\nWe [strongest verb] for [thing].\nBecause [reason].\n```\n\n4. **Cleft sentence for emphasis**\n\n```\nIt is the [person/type] who [qualifies]\nwho [wins/survives/changes things].\n```\n\n5. **Abstract claim → concrete final image**\n\n```\nThat is what [abstract noun] is:\n[small visible thing].\n```\n\nThe deepest lesson: start with a sentence that can stand alone. Then add pressure to the right. Or break the pressure into fragments. The “cumulative” move is not decoration; it is controlled addition.\n\n**And Another**\n\nSo [subject] [verb] on,\n\n[appositive metaphor],\n\n[past-participial phrase] [adverb] into [abstract place/time].\n\n*So the pattern goes on,* — so [subject] [verb] on a track laid before the *train knew its destination,* — appositive metaphor inherited quietly into *each writer who mistakes it for thought.* — past-participial phrase + adverb + abstract place/time","replyCount":0,"excerpt":"Appositive fragment. Noun-phrase fragment with relative clause. Temporal opener + main clause + content clause. Proper-noun fragment. Adjective appositive fragments. Equative setup + dash + explanatory clause. Plain Language Explanation Appositive fragment = Rename the thing. Noun-phrase fragment with relative clause = Say what kind of thing it is. Temporal ","words":201},{"id":"261202775","date":"2026-05-18","title":"The internal “feelings,” “tension,” or “recognition”, as if AI had introspective access to them, are at most…","summary":"The internal “feelings,” “tension,” or “recognition”, as if AI had introspective access to them, are at most metaphors f","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-261202775","body":"The internal “feelings,” “tension,” or “recognition”, as if AI had introspective access to them, are at most metaphors for patterns in its outputs or processing.\n\nUnderstanding does not equal computation.","discussion":"","replyCount":0,"excerpt":"The internal “feelings,” “tension,” or “recognition”, as if AI had introspective access to them, are at most metaphors for patterns in its outputs or processing. Understanding does not equal computation.","words":30},{"id":"257977332","date":"2026-05-12","title":"If I Could Give Only Two Writing Tips","summary":"If I Could Give Only Two Writing Tips Avoid ready-made phrases. They are the enemy of good writing. Do not surrender to","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-257977332","body":"Avoid ready-made phrases. They are the enemy of good writing. Do not surrender to language. Command it.\n\nNotice one specific detail and record it in a short, declarative sentence. Strip away explanation, transition, and commentary.","discussion":"Damnit. I can’t. Here are three more tips:\n\nWrite a tight base clause, then attach free modifiers after it, each one adding texture, detail, or a new angle without disrupting the core. The appositive is the easiest entry point (it simply renames what came before). That is, write a plain sentence. Add pressure to the right. Break into fragments when you need beats. Repeat when you need force. End with something the reader can see.\n\nGo through your draft and put brackets around every word, phrase, or sentence not doing useful work — redundant prepositions, qualifiers that weaken (\"a bit,\" \"sort of\"), adjectives that state the obvious (\"tall skyscraper\"), sentences that repeat what the previous sentence already said. Don't delete yet. Just bracket. Then read the sentence aloud without the bracketed material and decide if it works.\n\nHit return after every period. Every sentence gets its own line.\n\nOnce you can see each sentence as a discrete object with a shape, you can ask his diagnostic questions — where's the verb, who's acting, what does this actually say versus what I meant to say, is the subject capable of doing what the verb demands, and so on.\n\n———\n\n**It all really comes down to this: Make sentences until you discover what you mean, then revise until each sentence says it. To do that: Read a lot and write a lot.**","replyCount":0,"excerpt":"Avoid ready-made phrases. They are the enemy of good writing. Do not surrender to language. Command it. Notice one specific detail and record it in a short, declarative sentence. Strip away explanation, transition, and commentary.","words":35},{"id":"256072104","date":"2026-05-09","title":"Interaction design asked: Can people use this?","summary":"Interaction design asked: Can people use this? Living Systems Design asks: What does this make more likely?","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-256072104","body":"Living Systems Design asks: What does this make more likely?","discussion":"","replyCount":0,"excerpt":"Living Systems Design asks: What does this make more likely?","words":10},{"id":"254771724","date":"2026-05-06","title":"New Lines for Every Sentence","summary":"New Lines for Every Sentence Treat each sentence as a self-contained unit of thought. Give it physical space and silence","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-254771724","body":"Treat each sentence as a self-contained unit of thought.\n\nGive it physical space and silence.\n\nUse the break as a tactical tool for revision.\n\nUnspool dense paragraphs into a vertical list of sentences.\n\nThen inspect the internal logic and clutter of each line without the distraction of the surrounding paragraph.\n\nBreak the flow, and you must confront the actual quality of your prose instead of riding the momentum of flow.","discussion":"","replyCount":0,"excerpt":"Treat each sentence as a self-contained unit of thought. Give it physical space and silence. Use the break as a tactical tool for revision. Unspool dense paragraphs into a vertical list of sentences. Then inspect the internal logic and clutter of each line without the distraction of the surrounding paragraph. Break the flow, and you must confront the actual ","words":70},{"id":"253095743","date":"2026-05-03","title":"Logic is the skeleton; architecture is the flesh, blood, and (too often) the sweat.","summary":"Logic is the skeleton; architecture is the flesh, blood, and (too often) the sweat. That’s software systems design and p","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Science, emergence, and reality","source":"https://substack.com/@mattlane/note/c-253095743","body":"That’s software systems design and programming.","discussion":"","replyCount":0,"excerpt":"That’s software systems design and programming.","words":6},{"id":"251211200","date":"2026-04-29","title":"Ideology is premature closure, a prison of prefabricated language.","summary":"Ideology is premature closure, a prison of prefabricated language. A civilized empiricism means: You know your concepts","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-251211200","body":"A civilized empiricism means:\n\nYou know your concepts are socially shaped.\n\nYou know your tribe distorts your perception.\n\nYou know evidence does not simply “speak for itself.”\n\nBut you still believe reality exists outside your frame and can correct you.","discussion":"","replyCount":0,"ex
