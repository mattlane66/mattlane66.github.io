cerpt":"A civilized empiricism means: You know your concepts are socially shaped. You know your tribe distorts your perception. You know evidence does not simply “speak for itself.” But you still believe reality exists outside your frame and can correct you.","words":40},{"id":"249420533","date":"2026-04-26","title":"Path Analysis","summary":"Path Analysis Alternatives are not merely different ways to execute the same idea. They are distinct ways to address the","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Design, software, and systems","source":"https://substack.com/@mattlane/note/c-249420533","body":"Alternatives are not merely different ways to execute the same idea. They are distinct ways to address the same opportunity. Without this discipline, you are not doing good design.\n\nAnd when a requirement specifies the solution, the design is a tautology. Separating requirements from solutions is key to doing design.","discussion":"","replyCount":0,"excerpt":"Alternatives are not merely different ways to execute the same idea. They are distinct ways to address the same opportunity. Without this discipline, you are not doing good design. And when a requirement specifies the solution, the design is a tautology. Separating requirements from solutions is key to doing design.","words":50,"relation":{"label":"Related tool","text":"Fit Check Error Model","href":"../fit-check/"}},{"id":"249242788","date":"2026-04-26","title":"The Force-Multiplying Challenge and Opportunity","summary":"The Force-Multiplying Challenge and Opportunity The hard part of collaboration is this: we all work differently. There i","sourceCategory":"Work, collaboration, and organizations","category":"Products & systems","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-249242788","body":"The hard part of collaboration is this: we all work differently. There is no single right way to work. But when we have to work together, and my way of working interferes with yours, something has gone wrong and needs to change.\n\nIt is not enough for me to say, “This is how I work, and it works.” When I work with you, something has to change in both of us, without making either of us smaller.\n\nWhen your way of working collides with mine, we are stress-testing our assumptions against a live, intelligent opponent: each other. Unlike an AI that defaults to the path of least resistance or the most statistically likely answer, human collaboration forces us to defend, iterate, and refine our ideas until they hold up under genuine scrutiny.\n\nBut that only works if we can make the collision legible.\n\nThe real move is to factor the conflict into smaller parts, name what each part is protecting, and then compose those parts into a better way of working. Maybe I am protecting speed while you are protecting coherence. Maybe I need sketches to think, while you need criteria to decide. Maybe I want to keep the solution space open, while you want to make the work executable.\n\nOnce those differences have names, they stop being personal. They become design material.\n\nThat is where collaboration becomes force-multiplying. We do not merely compromise or meet in the middle. We break our working styles into useful parts, name the tensions clearly, and recombine them into a third, superior way of working that neither of us could have reached alone.\n\nThe goal is not sameness. The goal is composition.\n\nWe stay distinct long enough for the difference to matter, then build a shared method strong enough to hold both of us.","discussion":"","replyCount":0,"excerpt":"The hard part of collaboration is this: we all work differently. There is no single right way to work. But when we have to work together, and my way of working interferes with yours, something has gone wrong and needs to change. It is not enough for me to say, “This is how I work, and it works.” When I work with you, something has to change in both of us, wi","words":300},{"id":"248676615","date":"2026-04-24","title":"Figure out what’s actually happening, decide what’s possible, draw the line, spell out what matters, then…","summary":"Figure out what’s actually happening, decide what’s possible, draw the line, spell out what matters, then choose what to","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-248676615","body":"Figure out what’s actually happening, decide what’s possible, draw the line, spell out what matters, then choose what to give up.","discussion":"","replyCount":0,"excerpt":"Figure out what’s actually happening, decide what’s possible, draw the line, spell out what matters, then choose what to give up.","words":21},{"id":"248651582","date":"2026-04-24","title":"Pragmatics and epistemic reasoning are back and not going away.","summary":"Pragmatics and epistemic reasoning are back and not going away.","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-248651582","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"243340177","date":"2026-04-14","title":"Opportunity Leveling","summary":"Opportunity Leveling In a just society, people can reasonably expect the benefits attached to their roles under fair rul","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-243340177","body":"In a just society, people can reasonably expect the benefits attached to their roles under fair rules. But it is a mistake to think we inherently deserve a society that highly rewards the talents or traits we happen to possess. Inequalities are justified only when they make the least advantaged better off than they would be under a more equal arrangement.\n\n**Simple Difference Principle Examples**\n\n**Paying doctors more:** If higher pay is needed to attract and keep talented doctors, and that leads to better care, shorter wait times, or more clinics in poor and rural areas, then the inequality can be justified. The key is that the least advantaged are better off than they would be under a more equal system. If higher pay makes doctors richer without improving access to or care for those who are worse off, then the inequality is not justified.\n\n**CEO compensation:** If higher CEO pay is part of a system that grows firms in ways that raise wages, improve training, and expand opportunity for the lowest-paid workers, then the inequality may be justified. But if executives receive large bonuses while entry-level workers see stagnant pay, weaker benefits, or less security, then the inequality fails the test.\n\n**Higher pay for teachers in poor districts:** If paying teachers more helps attract strong teachers to underserved schools and improves outcomes for poor students, the inequality can be justified. If the extra pay mainly benefits already advantaged schools or does not materially improve the condition of the least advantaged students, then it is not justified.\n\nThis is the core idea: inequality is not justified because the talented deserve more, but because it must work to the benefit of those worst off.","discussion":"","replyCount":0,"excerpt":"In a just society, people can reasonably expect the benefits attached to their roles under fair rules. But it is a mistake to think we inherently deserve a society that highly rewards the talents or traits we happen to possess. Inequalities are justified only when they make the least advantaged better off than they would be under a more equal arrangement. Si","words":283},{"id":"241499841","date":"2026-04-10","title":"Argument Reconstruction","summary":"Argument Reconstruction First, separate what was said from what would need to be true. Ask: “Assuming all these premises","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Ethics, society, and political economy","source":"https://substack.com/@mattlane/note/c-241499841","body":"First, separate what was said from what would need to be true.\n\nAsk: “Assuming all these premises are true, does the conclusion necessarily follow?”\n\nDo not argue with the conclusion until you know what unstated premise is doing the work.\n\nAdd the missing premise explicitly if needed.\n\nOnce you spot the gap, write the missing bridge as a separate line and mark it as implicit.\n\nThat turns vague disagreement into something concrete. Now you can ask:\n\n- Is this hidden premise true?\n\n- Is it too broad?\n\n- Is it the wrong definition?\n\n- Is the causal claim unsupported?\n\n- Is the moral rule shared?\n\nNot all premises play the same role.\n\n- Independent: supports the conclusion on its own\n\n- Linked: only works together with another premise\n\n- Serial: supports another premise, not the conclusion directly\n\nThis matters because it tells you where to attack or strengthen the argument.\n\nIf two premises are linked, knocking out one collapses the whole support. If a premise is serial, it may be supporting a subclaim rather than the conclusion.\n\nUse three checks:\n\n- Removal test: Take one premise out. Can the conclusion still be reached? If yes, it may be redundant or misplaced.\n\n- Counterexample test: Ask: “Can I imagine a case where all the premises are true but the conclusion is false?” If yes, something is still missing.\n\n- Necessity/sufficiency test: Are the premises together enough? Is each one actually needed?\n\nThis is the practical heart of the method. It tells you whether the argument is actually complete.\n\nState the conclusion, list the reasons, ask whether they force the conclusion, make the missing bridge explicit, then test whether the full set really holds.","discussion":"","replyCount":0,"excerpt":"First, separate what was said from what would need to be true. Ask: “Assuming all these premises are true, does the conclusion necessarily follow?” Do not argue with the conclusion until you know what unstated premise is doing the work. Add the missing premise explicitly if needed. Once you spot the gap, write the missing bridge as a separate line and mark i","words":282},{"id":"238708221","date":"2026-04-05","title":"Just Barely Enough Product","summary":"Just Barely Enough Product The best reduced-scope products win by deleting dependencies, not by adding features, and whe","sourceCategory":"Product strategy and development","category":"Products & systems","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-238708221","body":"The best reduced-scope products win by deleting dependencies, not by adding features, and when the product becomes a primitive, not a platform.","discussion":"","replyCount":0,"excerpt":"The best reduced-scope products win by deleting dependencies, not by adding features, and when the product becomes a primitive, not a platform.","words":22},{"id":"236067457","date":"2026-03-31","title":"Planning + Serendipity Principles","summary":"Planning + Serendipity Principles - Plan for direction, not prediction. Decide where you are going, not how every step w","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-236067457","body":"- Plan for direction, not prediction. Decide where you are going, not how every step will unfold.\n\n- Do not try to control the world; prepare to respond to it. The mistake is trying to control the system and context instead of building the ability to adapt within them.\n\n- Use plans to reduce confusion, not eliminate uncertainty. A plan should clarify action, not create the illusion of control.\n\n- Treat reality as the final editor. The world gets a vote. Update the plan when facts change.\n\n- Optimize for adaptability, not perfect adherence. A good plan survives contact with life.\n\n- Protect compounding; welcome useful surprise. Preserve the work that builds over time, while leaving room for discoveries.\n\n- Do not confuse fullness with progress. A packed calendar often means low strategic quality.\n\n- Slack is a feature, not waste. Margin is what lets you absorb disruption and notice opportunity.\n\n- Serendipity works best inside boundaries. Randomness is most valuable when it has a container.\n\n- Planning should increase contact with reality, not replace it. The map should help you move, not become a substitute for moving.","discussion":"","replyCount":0,"excerpt":"- Plan for direction, not prediction. Decide where you are going, not how every step will unfold. - Do not try to control the world; prepare to respond to it. The mistake is trying to control the system and context instead of building the ability to adapt within them. - Use plans to reduce confusion, not eliminate uncertainty. A plan should clarify action, n","words":188},{"id":"227585143","date":"2026-03-14","title":"2013, the summer of my life. The summer I fell in love. The first time we met, I knew I was in trouble. Derya. Radiant. Charming. Beautiful. And one of the sexiest things about her: she made me laugh.","summary":"2013, the summer of my life. The summer I fell in love. The first time we met, I knew I was in trouble. Derya. Radiant.","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-227585143","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"225032056","date":"2026-03-09","title":"It’s not enough to know how to decompose an object or problem.","summary":"It’s not enough to know how to decompose an object or problem. To recompose with imagination, you also need to know how","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-225032056","body":"To recompose with imagination, you also need to know how to ask of each part:\n\nDoes the system fail without this? If yes, it’s an epicenter. \n\nDoes this part have the most \"unknowns\"? If yes, it should be sequenced first. \n\nCould this part work in a different product? If yes, it has transformational or adjacent possible potential.","discussion":"","replyCount":0,"excerpt":"To recompose with imagination, you also need to know how to ask of each part: Does the system fail without this? If yes, it’s an epicenter. Does this part have the most \"unknowns\"? If yes, it should be sequenced first. Could this part work in a different product? If yes, it has transformational or adjacent possible potential.","words":57},{"id":"223396370","date":"2026-03-05","title":"AI Literacy = E × P","summary":"AI Literacy = E × P Rigorous alignment = epistemic reasoning × pragmatics","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-223396370","body":"Rigorous alignment = epistemic reasoning × pragmatics","discussion":"","replyCount":0,"excerpt":"Rigorous alignment = epistemic reasoning × pragmatics","words":7},{"id":"220930451","date":"2026-02-28","title":"Our Jobs","summary":"Our Jobs AI won’t take all jobs, but it will absorb many tasks inside most jobs. It will eliminate some roles where the","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-220930451","body":"AI won’t take all jobs, but it will absorb many tasks inside most jobs. It will eliminate some roles where the remaining tasks can be fully standardized. In response, organizations will (maybe should) concentrate human responsibility at decision gates: the points where someone must approve an action because the costs of being wrong are meaningful.\n\nThis shift doesn’t imply we can know less. For many roles, it implies the opposite. If a human is accountable for the decision, they must be able to justify it under scrutiny. That requires two kinds of understanding: domain knowledge (what “correct” and “good” mean here) and system knowledge (what the AI relied on, what it assumed, how uncertain it is, and how it typically fails). You don’t need access to the AI’s private inner thoughts. You need a usable reasoning trace and evidence trail—inputs, sources, constraints, confidence signals, and tests—so you can decide when to trust, when to verify, and when to override.\n\nKeep teaching. Keep learning.","discussion":"","replyCount":0,"excerpt":"AI won’t take all jobs, but it will absorb many tasks inside most jobs. It will eliminate some roles where the remaining tasks can be fully standardized. In response, organizations will (maybe should) concentrate human responsibility at decision gates: the points where someone must approve an action because the costs of being wrong are meaningful. This shift","words":163},{"id":"219355232","date":"2026-02-25","title":"We don’t need politics.","summary":"We don’t need politics. We need a metaphysical model feeding into moral model feeding into an economic model.","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-219355232","body":"We don’t need politics. We need a metaphysical model feeding into moral model feeding into an economic model.","discussion":"","replyCount":0,"excerpt":"We don’t need politics. We need a metaphysical model feeding into moral model feeding into an economic model.","words":18},{"id":"214199697","date":"2026-02-13","title":"Whether mechanical or intellectually demanding, many forms of work contain a variety of toil—some that deepen…","summary":"Whether mechanical or intellectually demanding, many forms of work contain a variety of toil—some that deepen thinking a","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-214199697","body":"Whether mechanical or intellectually demanding, many forms of work contain a variety of toil—some that deepen thinking and skill, others that merely consume time. Wisdom lies in discerning where automation serves us and where preserving human engagement matters more.","discussion":"","replyCount":0,"excerpt":"Whether mechanical or intellectually demanding, many forms of work contain a variety of toil—some that deepen thinking and skill, others that merely consume time. Wisdom lies in discerning where automation serves us and where preserving human engagement matters more.","words":39},{"id":"211335608","date":"2026-02-07","title":"My Modified OODA Loop: The PC²UDA Loop 1.","summary":"My Modified OODA Loop: The PC²UDA Loop 1. Problem: Notice an inadequacy (empirical or conceptual): contradiction, surpri","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-211335608","body":"My Modified OODA Loop: **The PC²UDA Loop**\n\n1. Problem: Notice an inadequacy (empirical or conceptual): contradiction, surprise, goal failure, explanatory gap, unexplained regularity, new constraint/aim, or a mismatch between prediction and outcome.\n\n2. Conjecture: Propose 2–3 explanatory candidates (not just predictions).\n\n3. Criticism: Attack candidates hard:\n\n- Non-empirical criticism: inconsistency, vagueness, ad hoc patches, low explanatory power, doesn’t actually explain the problem.\n\n- Empirical criticism (where useful): design discriminating observations/experiments that would rule out at least one live conjecture.\n\n4. Update: Revise/eliminate conjectures; tentatively adopt the best-surviving explanation(s) (or keep multiple live candidates if unresolved) and revise what you’re paying attention to next (your “orientation”).\n\n5. Decide: Choose the next discriminating move: the cheapest/fastest action that maximizes learning or advantage per unit cost/time/risk given constraints.\n\n6. Act Execute: produce new reality.\n\n→ Loop: Act generates new outcomes and constraints, which feed new Problems (including new criticisms).\n\nOf course, the goal is to always shorten this learning loop length to minimum time per unit error-correction / advantage (i.e., maximize discrimination rate, not just speed).","discussion":"This is the one strategic through line that emerges as the signal from the noise.","replyCount":0,"excerpt":"My Modified OODA Loop: The PC²UDA Loop 1. Problem: Notice an inadequacy (empirical or conceptual): contradiction, surprise, goal failure, explanatory gap, unexplained regularity, new constraint/aim, or a mismatch between prediction and outcome. 2. Conjecture: Propose 2–3 explanatory candidates (not just predictions). 3. Criticism: Attack candidates hard: - N","words":173},{"id":"208656472","date":"2026-02-02","title":"Once you’ve developed enough experience to make sound judgments, approaching strategy through rational…","summary":"Once you’ve developed enough experience to make sound judgments, approaching strategy through rational inference, imagin","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-208656472","body":"Once you’ve developed enough experience to make sound judgments, approaching strategy through rational inference, imagination, written analysis, and visual reasoning gives you a distinct advantage over those who rely primarily on tools or research.","discussion":"","replyCount":0,"excerpt":"Once you’ve developed enough experience to make sound judgments, approaching strategy through rational inference, imagination, written analysis, and visual reasoning gives you a distinct advantage over those who rely primarily on tools or research.","words":34},{"id":"202164640","date":"2026-01-19","title":"You are free to do what you want, but you are not free to want what you want.","summary":"You are free to do what you want, but you are not free to want what you want.","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-202164640","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"194420599","date":"2026-01-02","title":"A great problem solver does two things: (1) tracks truth under uncertainty and (2) finds structure in…","summary":"A great problem solver does two things: (1) tracks truth under uncertainty and (2) finds structure in complexity. Everyt","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-194420599","body":"A great **problem solver** does two things: (1) tracks truth under uncertainty and (2) finds structure in complexity. Everything else is support skill: language, values, self-control, and coordination.\n\nThe Two-Part Engine:\n\n1) Probability + Causality\n\nSo you don’t fool yourself. (Calibration, base rates, evidence quality, confounding, causal graphs / counterfactuals.)\n\n2) Algorithms + Systems\n\nSo you can make progress on messy reality. (Decomposition, abstraction, constraints, feedback loops, second-order effects, leverage points.)","discussion":"","replyCount":0,"excerpt":"A great problem solver does two things: (1) tracks truth under uncertainty and (2) finds structure in complexity. Everything else is support skill: language, values, self-control, and coordination. The Two-Part Engine: 1) Probability + Causality So you don’t fool yourself. (Calibration, base rates, evidence quality, confounding, causal graphs / counterfactua","words":71},{"id":"193737245","date":"2025-12-31","title":"Judgment skills are central to critical thinking: deciding what’s true, what matters, and what should be done.","summary":"Judgment skills are central to critical thinking: deciding what’s true, what matters, and what should be done. These for","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-193737245","body":"**Judgment skills** are central to critical thinking: deciding what’s true, what matters, and what should be done. These forms of metacognitive knowledge should be taught to every kid. These are high-stakes agency skills that can atrophy if delegated.\n\nA citizen who can’t form an independent perspective is easy to steer—by ideology, by media, or by AI.\n\nShort list:\n\n**Reading & interpretation**\n\nExtract claims, infer meaning, evaluate framing, detect rhetoric, notice omissions and ambiguity.\n\n**Argumentation**\n\nClaim → reasons → assumptions → evidence → best objections → revised view.\n\n**Epistemic judgment**\n\nCalibration, source evaluation, bias/motivated reasoning detection, standards of proof (including correlation vs causation).\n\n**Uncertainty & quantitative literacy**\n\nBase rates, expected impact, orders of magnitude, basic statistical literacy, feedback loops and unintended consequences.\n\n**Practical wisdom**\n\nWhen rules apply, context sensitivity, second-order effects, tradeoffs under constraints, situational judgment.\n\n**Moral & political reasoning**\n\nLegitimacy, rights, justice, welfare, liberty/equality tensions, how to justify collective power and policy.\n\n**Self-governance**\n\nEmbodied awareness (sleep, stress, hunger, energy), sustainable habits, distress tolerance, impulse control, self-knowledge that supports clear thinking.\n\n**Social fluency & care**\n\nEmpathy and perspective-taking, conversational norms (listening/turn-taking), respect signals, gratitude, disagreement without contempt, apology and repair, everyday etiquette as coordination.\n\n**Aesthetic judgment**\n\nTaste and quality discernment: noticing beauty, understanding why something works, recognizing craftsmanship, standards beyond trend-following.\n\n———\n\nCritical thinking isn’t only critiquing ideas; it’s also generating better ones.\n\nImagination is how you produce alternatives, counterfactuals, and “other ways x could work,” which is essential for problem-solving and creation.","discussion":"","replyCount":0,"excerpt":"Judgment skills are central to critical thinking: deciding what’s true, what matters, and what should be done. These forms of metacognitive knowledge should be taught to every kid. These are high-stakes agency skills that can atrophy if delegated. A citizen who can’t form an independent perspective is easy to steer—by ideology, by media, or by AI. Short list","words":242},{"id":"192543364","date":"2025-12-28","title":"All the following mental models are handy. But when the map and the territory disagree, trust the territory.","summary":"All the following mental models are handy. But when the map and the territory disagree, trust the territory. 80/20 Rule","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-192543364","body":"**80/20 Rule (Efficiency):** Focus on the vital few, ignore the trivial many.\n\nTerritory check: Often, there are more opportunities in the under-managed 80% of tasks than in the over-managed 20%.\n\nSignal: We focus excessively on the high-payoff 20% while ignoring the untapped potential in the remaining 80%.\n\n**Inversion (Safety/Reliability):** Avoid stupidity rather than seeking brilliance.\n\nTerritory check: Sometimes the downside is already bounded, and the environment is winner-take-most, so “avoid mistakes” caps you at mediocrity while a few bold bets dominate outcomes.\n\nSignal: you’re in this territory: you can survive failure cheaply, but only big upside moves the needle.\n\n**Chesterton’s Fence (Reform/Change):** Don’t destroy what you don’t understand.\n\nTerritory check: Some “fences” are pure legacy cruft—kept alive by inertia—whose original function no longer exists, and the cost of keeping them now exceeds the risk of removal.\n\nSignal: nobody can name a current function, only history; the fence creates measurable harm today.\n\n**Hanlon’s Razor (Relationships):** They aren’t evil; they’re just human/clumsy. (Also: impact \u003e intent.)\n\nTerritory check: In many conflicts, repeated harmful behavior persists because it benefits the person (status, convenience, or money). Not “evil,” but still strategic—and it won’t change without consequences.\n\nSignal: pattern repeats after clear feedback + low/no cost to them; they benefit from the outcome.\n\n**Parkinson’s Law (Speed/Execution):** Work expands to fill the time available—so use tight timeboxes with explicit scope cuts, not just shorter deadlines.\n\nTerritory check: In complex/creative/quality-critical work, compressing time can increase rework, defects, and coordination overhead—making the calendar longer and the product worse.\n\nSignal: high coupling/dependencies, unclear requirements, or quality is hard to test quickly.\n\n**Regret Minimization (Big Life Choices):** Optimize for your 80-year-old self.\n\nTerritory check: Your future self’s values can change dramatically, and “max future optionality” can become a rationalization for never committing—so you end up regretting lack of depth, not lack of breadth.\n\nSignal: you keep postponing commitment; you have many open loops but little compounding mastery/relationships.\n\n**Pre-Mortem (Risk Management):** Assume the disaster has already happened, then look for the causes to prevent them now.\n\nTerritory check: In high-speed, low-stakes environments, over-analyzing failure modes (analysis paralysis) can kill the \"velocity\" that was actually your best protection. Sometimes you just need to \"ship and fix.\"\n\nSignal: You are solving for 1% edge cases while the 99% core product hasn't even met the market yet; the cost of the meeting exceeds the cost of a \"fast fail.\"\n\n**Reversibility (Sequencing):** Decide as late as possible for easy-to-change (reversible) choices to maximize fresh info. Decide early for hard-to-unwind (irreversible) choices or those with long wait times. (Also treat compounding choices—health, skills, reputation—as “start early.”)\n\nTerritory check: Some “reversible” decisions become sticky through social commitments, sunk costs, or path-dependence—so waiting “because reversible” can quietly make the decision irreversible anyway.\n\nSignal: switching costs grow with time (team habits, identity, contracts, integration debt).\n\n**Base Rates / Reference Class Forecasting (Prediction):** Before your story, ask what typically happens in similar cases.\n\nTerritory check: Base rates can mislead when you’re in a genuinely different reference class (new tech, new distribution, rule changes) or when you can materially change the causal drivers that defined the base rate.\n\nSignal: one or more core constraints of the historical set have been removed (cost curve shift, new channel, new regulation).\n\n**Incentives / Principal–Agent (Organizations):** People do what they’re rewarded to do (including unofficial rewards).\n\nTerritory check: In many situations, intrinsic motivation, identity, loyalty, or mission dominates incentives—and treating everything as incentive-maximization mispredicts behavior (and can corrode trust).\n\nSignal: people repeatedly sacrifice personal gain for principle, craftsmanship, belonging, or reputation for integrity.\n\n**Goodhart’s Law (Metrics):** When a measure becomes a target, it stops being a good measure.\n\nTerritory check: Some metrics remain robust targets when they’re hard to game and tightly coupled to what you actually care about—especially when paired with audits/quality checks.\n\nSignal: the metric has “tamper resistance” (e.g., independent verification, etc.","discussion":"","replyCount":0,"excerpt":"80/20 Rule (Efficiency): Focus on the vital few, ignore the trivial many. Territory check: Often, there are more opportunities in the under-managed 80% of tasks than in the over-managed 20%. Signal: We focus excessively on the high-payoff 20% while ignoring the untapped potential in the remaining 80%. Inversion (Safety/Reliability): Avoid stupidity rather th","words":638},{"id":"191916903","date":"2025-12-26","title":"Think on paper.","summary":"Think on paper. Ship in text.","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Design, software, and systems","source":"https://substack.com/@mattlane/note/c-191916903","body":"Think on paper. Ship in text.","discussion":"","replyCount":0,"excerpt":"Think on paper. Ship in text.","words":6},{"id":"189807406","date":"2025-12-20","title":"If you’re aligning on what the space looks like and how pieces connect (opportunities) → use a tree.","summary":"If you’re aligning on what the space looks like and how pieces connect (opportunities) → use a tree. If you’re arguing a","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-189807406","body":"If you’re arguing about what to pick next (solutions) → use a matrix.","discussion":"","replyCount":0,"excerpt":"If you’re arguing about what to pick next (solutions) → use a matrix.","words":13},{"id":"188294577","date":"2025-12-16","title":"Don’t Atrophy Via AI","summary":"Don’t Atrophy Via AI Keep a manual spine. Automate limbs, not judgment. Own the call. Delegation isn’t abdication. Earn","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-188294577","body":"Keep a manual spine. Automate limbs, not judgment.\n\nOwn the call. Delegation isn’t abdication.\n\nEarn the question. State it, constrain it, name what changes your mind.\n\nDo the first 15%. Frame, bound, estimate, sketch the system…then prompt.\n\nMatch tool to risk. Brainstorming can hallucinate; decisions can’t. Testable beats believable.\n\nNever trust smoothness. Coherence ≠ correctness.\n\nTriangulate + touch primary. One source is a story; originals keep you honest.\n\nPreserve the struggle. Offloading difficulty offloads learning—choose your easy.\n\nDo the last 15%. Verify, test when it matters, check counterfactuals, log bets.\n\nProtect the boundary + stay trainable. No sensitive data in unapproved tools; calibrate to avoid quiet atrophy.\n\n———-\n\nManual spine, not autopilot: frame the question, do the first 15%, match tool to risk. Never trust smoothness—triangulate + read the primary. Preserve some struggle. Do the last 15%: verify, test, log bets. Own the call. Stay trainable.","discussion":"","replyCount":0,"excerpt":"Keep a manual spine. Automate limbs, not judgment. Own the call. Delegation isn’t abdication. Earn the question. State it, constrain it, name what changes your mind. Do the first 15%. Frame, bound, estimate, sketch the system…then prompt. Match tool to risk. Brainstorming can hallucinate; decisions can’t. Testable beats believable. Never trust smoothness. Co","words":146},{"id":"186352589","date":"2025-12-10","title":"What was it like to wake up after having never gone to sleep?","summary":"What was it like to wake up after having never gone to sleep? When you were born. Where do you exist within the present-","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Work, collaboration, and organizations","source":"https://substack.com/@mattlane/note/c-186352589","body":"When you were born.\n\nWhere do you exist within the present-tense simulation, a timeline unconstrained by reality?\n\nWhen you are dreaming.","discussion":"","replyCount":0,"excerpt":"When you were born. Where do you exist within the present-tense simulation, a timeline unconstrained by reality? When you are dreaming.","words":21},{"id":"180923678","date":"2025-11-25","title":"Explore Being Right We need not be right to know; what matters is reaching a place where no further criticism…","summary":"Explore Being Right We need not be right to know; what matters is reaching a place where no further criticism is possi","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-180923678","body":"Explore \u003e Being Right\n\nWe need not be right to know; what matters is reaching a place where no further criticism is possible.","discussion":"","replyCount":0,"excerpt":"Explore Being Right We need not be right to know; what matters is reaching a place where no further criticism is possible.","words":22},{"id":"180232911","date":"2025-11-23","title":"Understanding Memorizing","summary":"Understanding Memorizing You might find hidden truths through experience that you can generalize into heuristics. Then","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-180232911","body":"You might find hidden truths through experience that you can generalize into heuristics. Then, you can create a philosophy around that. Any pursuit you master will lead to philosophy, i.e., will lead you to becoming a philosopher, if you go deep enough and generalize those truths back out.","discussion":"","replyCount":0,"excerpt":"You might find hidden truths through experience that you can generalize into heuristics. Then, you can create a philosophy around that. Any pursuit you master will lead to philosophy, i.e., will lead you to becoming a philosopher, if you go deep enough and generalize those truths back out.","words":48},{"id":"179787291","date":"2025-11-21","title":"Physics of the Problem","summary":"Physics of the Problem Delimit the situational boundaries in both space and time and make the context specific. In other","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Design, software, and systems","source":"https://substack.com/@mattlane/note/c-179787291","body":"Delimit the situational boundaries in both space and time and make the context specific.\n\nIn other words, clarify where and when the situation occurs, and describe the context (when and where the unmet/unrealized need or desire occurs, and the current approach/workaround and its result) precisely. Doing so narrows the focus of the problem so tightly that it is already halfway to being solved.\n\n**The context layers you need:**\n\n**THE WHO**\n\n*Name, role, location, and any other helpful background information of the person with the unmet/unrealized need or desire.*\n\n**THEIR CURRENT APPROACH**\n\n*Current solution/workaround/compensating behavior and when and where it happens (and if possible, what they were doing before and when they switched to what they are doing now).*\n\n**THEIR RESULT**\n\n*Current result from the current solution/workaround/compensating behavior.*\n\n**THEIR DESIRED OUTCOME**\n\n*Their desired outcome before (and after) they started with their current approach (when they switched from what they were doing before to what they are doing now).*\n\n**Two solution-agnostic requirements examples:**\n\n```\nWhen I’m in a rush, I’m starving, need something I can eat with one hand while on the go, and I’m not sure when I’ll be able to eat again, and most options are too slow, too messy, or not filling enough, help me get something hot, fast, and satisfying that I can eat on the move, so I can curb my hunger quickly, stay on schedule, and avoid crashing later.\n```\n\n```\nWhen I’m (software development agency owner) under time pressure and discover work has been sitting idle—delaying billing and causing cash flow problems, and the only way to track progress is by chasing people for updates, which is slow and unreliable, I want a system that notifies my team the moment work is ready so I can keep the workflow moving, hit project milestones faster, and smooth out my billing and cash flow.\n```\n\nNarrowing down the problem isn’t an either/or proposition — it’s not that you either get all the behavior you want, or just one small piece. Finding a foothold can solve a real problem, produce a meaningful win, and pave the way for more opportunities, both expected and unexpected.\n\nGood explanatory problems move from what’s happening and has this happened multiple times to what underlying network structure causes these patterns, and what beliefs led to this structure.\n\n**Additional tips:**\n\n- Tackle the most unknown slices first.\n\n- Not every slice of a larger problem calls for the same level of finish. \n\n- Limit who you’re solving for.\n\n**Critical questions to ask about the problem:**\n\n- What happens if we do nothing?\n\n- What is/are the input signal/s and the output response we want to measure and observe?\n\n- Is the cost of the failure higher than the cost of the solution?\n\n- Before committing to a path to solve a problem (*pre-mortem*): Why did this fail?\n\n- What’s happening? Has this happened multiple times? What underlying structure causes these patterns? What beliefs led to this structure (Where is this intuition coming from)?\n\n- What missing information would lead to making a different decision?\n\n- What is *not* part of this problem?\n\n**Five key ways to unpack demand when interviewing:**\n\n- Context first: anchor to moments in time. “What was happening the week before?” “Who was there?” The irrational becomes rational with context.\n\n- Contrast: ask “Why this and not that?” “What did you choose away from?” Contrast reveals boundaries and value code.\n\n- Reference point: there’s no fast, only faster than… get the comparison people are holding in their heads.\n\n- Energy cues: listen for emphasis, pauses, sighs. When you hear energy, stop and dig. “Say more—why is that important?”\n\n- Down to action: keep probing until you hit “the edge of articulation,” then switch to examples or analogies to make it tangible. “Show me,” “Give me an example,” “What’s not that?”","discussion":"Another example, and one where multiple perspectives converged, that drove a step-function change in an industry:\n\n**Exporter / Shipper**\n\nWhen I’m trying to send a mixed load of goods overseas (crates, pallets, barrels) and it has to go factory → truck/rail → pier → ship → pier → truck/rail, every handoff means breaking the load apart and touching each piece again—waiting on stevedores, fighting congestion, filling out paperwork that doesn’t match reality, and hoping nothing gets crushed, soaked, or stolen—help me move this shipment end-to-end as a single protected unit that can transfer between truck/rail/ship without being opened, so I can trust the schedule, cut losses and claims, and make ocean shipping predictable enough to build a business around.\n\n**Shipping line / Ship owner — the “capital sits idle” physics**\n\nWhen my ship arrives at a busy port with break-bulk cargo, it can sit at the dock for days while crews unload and reload thousands of individual pieces—each one a chance for damage, pilferage, miscounts, labor delays, and paperwork chaos—help me standardize loading so cargo can be moved on/off fast with minimal handling, so my ship spends time sailing instead of waiting, my schedules stop collapsing, and my cost per trip drops dramatically.\n\n**Port / Terminal operator — the “yard is a jam” physics**\n\nWhen inbound cargo hits the pier in a rush and everything has to be staged, sorted, counted, guarded, and moved by hand with inconsistent packaging and no common interface, the yard turns into a bottleneck where congestion, mistakes, and theft scale with volume—help me create a simple, repeatable way to move freight through the terminal with fewer touches and clearer custody, so throughput rises, losses fall, and the whole port stops operating like a permanent exception-handling machine.","replyCount":0,"excerpt":"Delimit the situational boundaries in both space and time and make the context specific. In other words, clarify where and when the situation occurs, and describe the context (when and where the unmet/unrealized need or desire occurs, and the current approach/workaround and its result) precisely. Doing so narrows the focus of the problem so tightly that it i","words":635},{"id":"178414268","date":"2025-11-18","title":"Problem-Solving Skills We Should Teach Kids","summary":"Problem-Solving Skills We Should Teach Kids Teach them to model situations as discrete structures (graphs, sets, constra","sourceCategory":"Learning, education, and curiosity","category":"Life & learning","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-178414268","body":"Teach them to model situations as discrete structures (graphs, sets, constraints).\n\nTeach them families of algorithms (search, greedy, DP) and when each fits.\n\nTeach invariants, extremal reasoning, and impossibility proofs via puzzles.\n\nTeach them to reason about complexity and trade-offs (exact vs heuristic).\n\nDo it through rich, varied problems that feel like real planning, scheduling, and network tasks, not just symbol pushing.","discussion":"","replyCount":0,"excerpt":"Teach them to model situations as discrete structures (graphs, sets, constraints). Teach them families of algorithms (search, greedy, DP) and when each fits. Teach invariants, extremal reasoning, and impossibility proofs via puzzles. Teach them to reason about complexity and trade-offs (exact vs heuristic). Do it through rich, varied problems that feel like ","words":62},{"id":"178028917","date":"2025-11-17","title":"Creative Problem-Solving Sequencing Heuristics","summary":"Creative Problem-Solving Sequencing Heuristics Frame the change: Before doing any work, look at real examples and write","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-178028917","body":"1. Frame the change: Before doing any work, look at real examples and write a simple statement of the core problem and what “better” will look like for real people.\n2. Dump and cluster the work: List every relevant task, constraint, and idea, then group items that obviously must change together and give each group a clear, plain-language name.\n3. Choose scope and constraints: For this project, decide which parts you are allowed to change, which parts must stay as they are, and where you’ll use standard patterns versus special custom solutions.\n4. Map structure and uncertainty: Draw how these groups depend on one another and mark the ones where you know the least, so you can see both the structure of the work and the riskiest spots.\n5. Sequence by leverage and unknowns: Start with a group of work that many others depend on and that has big open questions, so early steps give you maximum learning and flexibility.\n6. Anchor hard-to-undo decisions early: Make the few big, hard-to-reverse choices about flow, layout, or structure before spending time on details that are easy to tweak.\n7. Time decisions by reversibility and options: Make decisions as late as you can without losing good options—wait on choices that are easy to change and benefit from fresh information, and decide early on things that are hard to unwind or have long lead times.\n8. Slice into tiny end-to-end experiments: Turn big ideas into the smallest usable slice that still solves a real problem for someone, and build or test that before attempting anything broader.\n9. Let the next step define “done”: For each slice or group, call it “done” when it is just good enough for the very next piece of work to start, and push everything else later.\n10. Protect and improve the whole: After each step, zoom out and ask whether the whole thing now feels clearer, simpler, and more coherent, and adjust before adding more.\n11. Keep a steady zoom rhythm: Move back and forth between revisiting the overall plan and building small concrete slices, letting each finished slice reshape your view of what should come next.","discussion":"","replyCount":0,"excerpt":"1. Frame the change: Before doing any work, look at real examples and write a simple statement of the core problem and what “better” will look like for real people. 2. Dump and cluster the work: List every relevant task, constraint, and idea, then group items that obviously must change together and give each group a clear, plain-language name. 3. Choose scop","words":358},{"id":"170879081","date":"2025-10-28","title":"Don’t Violate These Product Development Principles","summary":"Don’t Violate These Product Development Principles Get feedback from real use, not projections. Iterate on actual proble","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-170879081","body":"Get feedback from real use, not projections. Iterate on actual problems, not hypothetical ones. Direction is a filter, not an order-dependent roadmap.\n\nDecide as late as you can without losing options. Favor near-action decisions for reversible, loosely-coupled choices where fresh information is highest quality. Decide earlier when a choice is hard to unwind, tightly coupled, or has long lead times.\n\nCertainty isn’t about horizon; it’s about relevance. Plan this month, finish it, then plan the next. Short horizons deliver more certainty; long projections miss. Make more short-term calls—the information is fresh.\n\nKeep the compass, drop the itinerary. Let the far objective constrain what you will and won’t do; let near-term evidence set the sequence. Use intent to narrow options; use learning to pick the next step.\n\nStart with values and principles.\n\nDefine what matters at the core (e.g., “remove administrative work to save teachers time on x, y, and z,” “x% of students enroll in y class,” “x% of students pass y exam within ZPD”).\n\nMeasure what matters by the work itself.\n\nIs the product good? Does it solve the problem? Does it help users/customers? If someone isn’t doing good work, the team sees it quickly. If you can’t tell who’s contributing, you have a communication or clarity problem—not a measurement problem.\n\nIf you need elaborate systems to ensure people are working, either you hired poorly, failed to clarify what matters, or built an environment where people can’t do their best work. Fix root causes instead of adding management overhead. Teach people to set and achieve their own goals so they feel ownership within the directional space set forth and to sustain motivation when it suffers.\n\nUse rolling-wave planning; decide late for reversible/loosely-coupled choices and decide earlier for irreversible/high-coupling/long-lead choices.","discussion":"","replyCount":0,"excerpt":"Get feedback from real use, not projections. Iterate on actual problems, not hypothetical ones. Direction is a filter, not an order-dependent roadmap. Decide as late as you can without losing options. Favor near-action decisions for reversible, loosely-coupled choices where fresh information is highest quality. Decide earlier when a choice is hard to unwind,","words":290,"relation":{"label":"Related system","text":"Planning Skills","href":"https://github.com/mattlane66/planning-skills-for-agents-and-humans"}},{"id":"169244486","date":"2025-10-23","title":"Logic hits incompleteness, algorithms hit undecidability, physics hits interpretational gaps, cosmology hits…","summary":"Logic hits incompleteness, algorithms hit undecidability, physics hits interpretational gaps, cosmology hits measure amb","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-169244486","body":"Logic hits incompleteness, algorithms hit undecidability, physics hits interpretational gaps, cosmology hits measure ambiguity.","discussion":"🧠 Eight Minds, Six Questions — The Experiment Begins\n\nI’ve started a new series testing how eight different AI systems interpret UCTiT–UCP v4.0, the Unified Theory of Coherence.\n\nEach AI received the same document and six identical questions — revealing how different “minds” reason about time, information, and meaning.\n\nYou can now read the first conversation below:\n\nPart 1A – Questions 1 to 3: [https://substack.com/@ryanlaneuctit/note/c-169355519?r=62kent](https://substack.com/@ryanlaneuctit/note/c-169355519?r=62kent)\n\nPart 1B – Questions 4 to 6: [https://substack.com/@ryanlaneuctit/note/c-169356801?r=62kent](https://substack.com/@ryanlaneuctit/note/c-169356801?r=62kent)\n\nThis project is about more than comparison — it’s about seeing whether coherence itself is intuitive across all forms of intelligence.","replyCount":0,"excerpt":"Logic hits incompleteness, algorithms hit undecidability, physics hits interpretational gaps, cosmology hits measure ambiguity.","words":14},{"id":"167847219","date":"2025-10-19","title":"Model systems precisely (JSON, state diagrams, invariants).","summary":"Model systems precisely (JSON, state diagrams, invariants). Test before coding—list what breaks. Read unfamiliar code we","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-167847219","body":"Model systems precisely (JSON, state diagrams, invariants). Test before coding—list what breaks. Read unfamiliar code weekly. Debug with logs, not guesses. Ship to real users and iterate. Master one domain for 2+ years. Repeat forever. Everything else changes. This doesn't.","discussion":"","replyCount":0,"excerpt":"Model systems precisely (JSON, state diagrams, invariants). Test before coding—list what breaks. Read unfamiliar code weekly. Debug with logs, not guesses. Ship to real users and iterate. Master one domain for 2+ years. Repeat forever. Everything else changes. This doesn't.","words":40},{"id":"168082656","date":"2025-10-19","title":"The Hill Chart","summary":"The Hill Chart Basecamp’s Hill Chart is a great example of form-context fit. It maps a universal reality of knowledge wo","sourceCategory":"Work, collaboration, and organizations","category":"Products & systems","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-168082656","body":"Basecamp’s Hill Chart is a great example of form-context fit.\n\nIt maps a universal reality of knowledge work—unknowns → knowns—into a dead-simple shape that exposes risk and progress without fake certainty. It eliminates the core misfit (lists/burndowns hide uncertainty) with a form (a single hill) that any team can grasp in 30 seconds.\n\n**Forces → Form → Fit (at a glance)**\n\nForces (context): Early work is uncertainty/learning; late work is execution. Stakeholders want status without ceremony; teams need a shared model of “stuck.”\n\nForm: A hill with two regions—uphill (figuring out) and downhill (cranking). Scopes are dots you move along the curve over time.\n\nFit: Progress becomes legible without meetings or estimates; the exact source of risk is visible (what’s still uphill).\n\n**Anti-patterns it helps you avoid**\n\nTurning scopes into task lists (you’ll re-hide uncertainty).\n\nMoving dots as “motivation theater” (only move when reality changes).\n\nTreating position as percent complete (it’s a phase, not a percentage).","discussion":"","replyCount":0,"excerpt":"Basecamp’s Hill Chart is a great example of form-context fit. It maps a universal reality of knowledge work—unknowns → knowns—into a dead-simple shape that exposes risk and progress without fake certainty. It eliminates the core misfit (lists/burndowns hide uncertainty) with a form (a single hill) that any team can grasp in 30 seconds. Forces → Form → Fit (a","words":156},{"id":"168049222","date":"2025-10-19","title":"The universe is the answer; our questions—their quality and fit—matter.","summary":"The universe is the answer; our questions—their quality and fit—matter. Our goal is to find the right ones. When a probl","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Science, emergence, and reality","source":"https://substack.com/@mattlane/note/c-168049222","body":"The universe is the answer; our questions—their quality and fit—matter. Our goal is to find the right ones. When a problem stays insoluble, always suspect the question—it’s been asked the wrong way.","discussion":"","replyCount":0,"excerpt":"The universe is the answer; our questions—their quality and fit—matter. Our goal is to find the right ones. When a problem stays insoluble, always suspect the question—it’s been asked the wrong way.","words":32},{"id":"168051117","date":"2025-10-19","title":"Describe observable effects and regularities in the way things behave (laws).","summary":"Describe observable effects and regularities in the way things behave (laws). This method marks a clear boundary between","sourceCategory":"Philosophy, knowledge, and mind","category":"Judgment & knowledge","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-168051117","body":"Describe observable effects and regularities in the way things behave (laws). This method marks a clear boundary between describing observable effects and guessing at causes beyond empirical evidence (hypotheses).","discussion":"","replyCount":0,"excerpt":"Describe observable effects and regularities in the way things behave (laws). This method marks a clear boundary between describing observable effects and guessing at causes beyond empirical evidence (hypotheses).","words":29},{"id":"168078658","date":"2025-10-19","title":"Simple Difference Principle Examples","summary":"Simple Difference Principle Examples Paying doctors more If higher pay attracts talent and expands clinics in poor areas","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-168078658","body":"Paying doctors more\n\nIf higher pay attracts talent and expands clinics in poor areas so the poorest get better care than before, that inequality passes.\n\nIf it just boosts doctor income with no improvement for the poorest, it fails.\n\nCEO bonus plan\n\nIf bonuses come with raising entry-level wages and training so the poorest workers end up better off, okay.\n\nIf bonuses are funded by cutting the lowest wages/benefits so the poorest are worse off, not okay.","discussion":"","replyCount":0,"excerpt":"Paying doctors more If higher pay attracts talent and expands clinics in poor areas so the poorest get better care than before, that inequality passes. If it just boosts doctor income with no improvement for the poorest, it fails. CEO bonus plan If bonuses come with raising entry-level wages and training so the poorest workers end up better off, okay. If bon","words":77},{"id":"167716152","date":"2025-10-18","title":"To design well is to make wrong action costly","summary":"To design well is to make wrong action costly Good design sometimes means adding friction or leaving something out, crea","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Work, collaboration, and organizations","source":"https://substack.com/@mattlane/note/c-167716152","body":"Good design sometimes means adding friction or leaving something out, creating discomfort where activity happens but shouldn’t.","discussion":"","replyCount":0,"excerpt":"Good design sometimes means adding friction or leaving something out, creating discomfort where activity happens but shouldn’t.","words":17},{"id":"165116106","date":"2025-10-10","title":"Motivation, Trust, and Direction","summary":"Motivation, Trust, and Direction Summary: Reward real work: collaboration, momentum, learning, and novelty that ships. S","sourceCategory":"Work, collaboration, and organizations","category":"Products & systems","also":"Judgment, decisions, and problem-solving","source":"https://substack.com/@mattlane/note/c-165116106","body":"Summary:\n\nReward real work: collaboration, momentum, learning, and novelty that ships. Set strategy above projects and let teams inform it. Use goals to test strategy, not to manufacture motivation. After each cycle ask if you’d extend the work and whether the team stayed healthy. Share risk with clear bounds. Assume trust, start at 50%, and use accountability only as a short-term sauna. Without trust, nothing magical happens.\n\n————-\n\nActivity can be directed or undirected.\n\nOne kind of activity lacks passion, quality, and ownership. That’s vanity work—busywork.\n\nThe good kind shows up as high collaboration, steady momentum, growing confidence, controlled adaptability, sound choices, failure that sparks useful inquiry, and implemented novelty.\n\nTrust the people who expect nothing but the best work from themselves and those who are closest to the work and its materials to do their best work. Evaluate them on the quality and cadence of that activity. Reject busywork. Value opportunity-finding skills that lead to intended use in real contexts. Track whether return on effort and the frequency of learning create higher-level value for the organization.\n\nSet direction that sits above the project track where good activity happens. Let local teams inform direction-setting. If long-horizon, point-in-time goals are useful, let them follow from coherent strategy—not drive it. Strategy, then goals. Direction \u003e Destination. \n\nSmall choices shape organizational outcomes far more than a few large ones. When teams have clear decision rules and support to handle tradeoffs, they can respond to opportunities and risks much faster, which improves alignment, reduces bottlenecks, and enhances flow.\n\nManagement designs strategy; goals test it. Use point-in-time outcomes to judge managerial judgment and to inform the next round of direction modeling.\n\nAt the end of each short cycle ask: (1) Would we do it again or extend it once the learnings land? (2) Did the way the work unfolded feel healthy for the team? Be like evolution and double down on what works, not what doesn’t.\n\nAt year-end, those closest to the work ask one question: Would I hire this person again? Hell yes / No.\n\nGoals don’t manufacture motivation. People bring it. An act is fully human only when it rises from within. What’s done by pressure, habit, or instruction alone never becomes part of the self; it stays foreign to who we are. Such deeds draw no human vigor; they are carried out with rote accuracy. When we move like machines—answering cues and orders instead of our own aims and capacities—people may praise the result, yet the doer is despised.\n\nShare risk. Leave enough latitude for breakthroughs. Set firm boundaries for alignment. Use specifics when hard-earned knowledge applies. Trust capable people to work it out.\n\nAssume trust; don’t dole it out conditionally. That applies to everyone. Start with a 50% trust battery. If it dips below 50%, use accountability measures briefly. It’s a sauna—get out fast. Accountability is what you need when you’ve lost trust. And when you don’t have trust, you can’t do magical things.","discussion":"","replyCount":0,"excerpt":"Summary: Reward real work: collaboration, momentum, learning, and novelty that ships. Set strategy above projects and let teams inform it. Use goals to test strategy, not to manufacture motivation. After each cycle ask if you’d extend the work and whether the team stayed healthy. Share risk with clear bounds. Assume trust, start at 50%, and use accountabilit","words":492},{"id":"165103398","date":"2025-10-10","title":"Don’t ask what makes you (or others) unique.","summary":"Don’t ask what makes you (or others) unique. Ask who you (or others) are when no one’s looking.","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"References, images, and found objects","source":"https://substack.com/@mattlane/note/c-165103398","body":"Ask who you (or others) are when no one’s looking.","discussion":"","replyCount":0,"excerpt":"Ask who you (or others) are when no one’s looking.","words":10},{"id":"157570017","date":"2025-09-19","title":"Syntax-craft for LLMs","summary":"Syntax-craft for LLMs Begin with the outcome—a one-line task; follow with parallel, single-action steps; define terms at","sourceCategory":"AI, automation, and future work","category":"AI & future work","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-157570017","body":"Begin with the outcome—a one-line task; follow with parallel, single-action steps; define terms at first mention in brief appositives; then foreground scope and edge cases—“If/When…, then…”. These cues align syntax and intention so the model codes to spec.","discussion":"","replyCount":0,"excerpt":"Begin with the outcome—a one-line task; follow with parallel, single-action steps; define terms at first mention in brief appositives; then foreground scope and edge cases—“If/When…, then…”. These cues align syntax and intention so the model codes to spec.","words":38},{"id":"157570560","date":"2025-09-19","title":"Successful decision-making requires getting straight on criteria, conditions, and constraints.","summary":"Successful decision-making requires getting straight on criteria, conditions, and constraints.","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-157570560","body":"","discussion":"","replyCount":0,"excerpt":"","words":0},{"id":"155446483","date":"2025-09-13","title":"Competing factors: Figuring out the right things to build often requires identifying the embedded criteria…","summary":"Competing factors: Figuring out the right things to build often requires identifying the embedded criteria behind the av","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-155446483","body":"Competing factors: Figuring out the right things to build often requires identifying the embedded criteria behind the avoidance or the workarounds.","discussion":"","replyCount":0,"excerpt":"Competing factors: Figuring out the right things to build often requires identifying the embedded criteria behind the avoidance or the workarounds.","words":21},{"id":"154673446","date":"2025-09-11","title":"AI cannot replicate the human act of thinking and emotional introspection involved in true writing—the act of…","summary":"AI cannot replicate the human act of thinking and emotional introspection involved in true writing—the act of meaning-ma","sourceCategory":"Writing, language, and communication","category":"Writing & craft","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-154673446","body":"AI cannot replicate the human act of thinking and emotional introspection involved in true writing—the act of meaning-making that is uniquely human and not just text generation or simulation.","discussion":"","replyCount":0,"excerpt":"AI cannot replicate the human act of thinking and emotional introspection involved in true writing—the act of meaning-making that is uniquely human and not just text generation or simulation.","words":29},{"id":"151458914","date":"2025-09-01","title":"If a moral rule is grounded in shared human cognition, reflected in cross-cultural judgments, and justified…","summary":"If a moral rule is grounded in shared human cognition, reflected in cross-cultural judgments, and justified by reasons a","sourceCategory":"Ethics, society, and political economy","category":"Society & institutions","also":"Philosophy, knowledge, and mind","source":"https://substack.com/@mattlane/note/c-151458914","body":"**If** a moral rule is grounded in shared human cognition, reflected in cross-cultural judgments, and justified by reasons any culture can accept, **then** it’s true for everyone; those conditions hold for “intentionally killing a non-threatening person is wrong,” **therefore,** global moral relativism is false.\n\nThis is an epistemological problem.\n\nWe have instinctive methods for trying to define principles that we use to go from a range of evidence and background knowledge to ideas that might be an explanation for them.\n\nThat’s our means to advance knowledge. But perhaps these are the wrong means, leading us away from understanding and knowledge, which means we’re stuck.","discussion":"","replyCount":0,"excerpt":"If a moral rule is grounded in shared human cognition, reflected in cross-cultural judgments, and justified by reasons any culture can accept, then it’s true for everyone; those conditions hold for “intentionally killing a non-threatening person is wrong,” therefore, global moral relativism is false. This is an epistemological problem. We have instinctive me","words":104},{"id":"147526687","date":"2025-08-21","title":"The Aftermap: Navigate by wake, not wish.","summary":"The Aftermap: Navigate by wake, not wish. An Aftermap is the map you draw after outcomes. Start from where you actually","sourceCategory":"Product strategy and development","category":"Products & systems","also":"Learning, education, and curiosity","source":"https://substack.com/@mattlane/note/c-147526687","body":"An Aftermap is the map you draw after outcomes. Start from where you actually are, and revise direction based on what just happened. The longer you wait between intent and review, the more variability you **incur**—call it *variance debt*. Keep the loop short.\n\nAn Aftermap isn’t a log of actions; it’s your updated model of the world: what you now know about, what you still need to learn, and the moves that sharpen your differentiation at a low cost. A roadmap is a guess dressed in certainty. An Aftermap lets you decide from evidence—where you’ve been and what worked—rather than wishful destinations.\n\nDo what seems interesting and valuable. Sometimes greatness follows.\n\nDirection over destination. \n\n• Measure the gap: plan → outcome.\n\n• Reduce the gap: tighten the review cadence.\n\n• Spend learnings on low-cost, high-signal moves.","discussion":"","replyCount":0,"excerpt":"An Aftermap is the map you draw after outcomes. Start from where you actually are, and revise direction based on what just happened. The longer you wait between intent and review, the more variability you incur—call it variance debt. Keep the loop short. An Aftermap isn’t a log of actions; it’s your updated model of the world: what you now know about, what y","words":136},{"id":"147665358","date":"2025-08-21","title":"Process-Oriented Success Measurement","summary":"Process-Oriented Success Measurement Process that is about improving the craft and chemistry between people is much more","sourceCategory":"Work, collaboration, and organizations","category":"Products & systems","also":"Life, identity, and personal practice","source":"https://substack.com/@mattlane/note/c-147665358","body":"Process that is about improving the craft and chemistry between people is much more important than outcomes.\n\nThe point isn’t to know, it is to do. And for it to be done. \n\nThe Holistic Approach to Outcomes:\n\nOutcomes must extend far beyond simple output measurements. It’s not just about the output and outcome, it’s about how did it feel as we went. When evaluating the success of any project or initiative, ask critical questions about the broader impact:\n\n- Are people burned out?\n- Do team members who previously liked each other now loathe each other?\n- Did this make the company stronger or weaker?\n- Did this improve or damage personal relationships?\n- Are we making more money than we’re spending?\n- Did we move our understanding about the world forward or not?\nYou could technically end up with a great feature or product that people love, but if it completely destroyed internal morale, that’s not a good outcome.","discussion":"","replyCount":0,"excerpt":"Process that is about improving the craft and chemistry between people is much more important than outcomes. The point isn’t to know, it is to do. And for it to be done. The Holistic Approach to Outcomes: Outcomes must extend far beyond simple output measurements. It’s not just about the output and outcome, it’s about how did it feel as we went. When evaluat","words":160},{"id":"144182262","date":"2025-08-11","title":"Ask an LLM to teach you about:","summary":"Ask an LLM to teach you about: Limits of math/CS: Incompleteness → computability → complexity → Kolmogorov complexity. P","sourceCategory":"Learning, education, and curiosity","category":"Life & learning","also":"AI, automation, and future work","source":"https://substack.com/@mattlane/note/c-144182262","body":"- Limits of math/CS: Incompleteness → computability → complexity → Kolmogorov complexity.\n- Physics: Classical chaos → fluids/turbulence → QFT basics → quantum gravity puzzles.\n- Inference: Graphical models → causal DAGs/ID algorithms → experiments under interference.\nChoose one of these highly complex topics and engage the model to help you deepen your understanding. Keep asking questions and refining your knowledge until the concept becomes clear. This process will not only help you grasp challenging subjects, but also teach you how to learn—an invaluable skill for tackling difficult concepts.","discussion":"Other hard-to-understand/mind-opening topics YOU CAN LEARN your way with AI:\n\n[https://en.wikipedia.org/wiki/Quantum_contextuality](https://en.wikipedia.org/wiki/Quantum_contextuality)\n\n[https://en.wikipedia.org/wiki/Rice%27s_theorem](https://en.wikipedia.org/wiki/Rice%27s_theorem)","replyCount":0,"excerpt":"- Limits of math/CS: Incompleteness → computability → complexity → Kolmogorov complexity. - Physics: Classical chaos → fluids/turbulence → QFT basics → quantum gravity puzzles. - Inference: Graphical models → causal DAGs/ID algorithms → experiments under interference. Choose one of these highly complex topics and engage the model to help you deepen your unde","words":89},{"id":"138867850","date":"2025-07-25","title":"The Nubs of Technology","summary":"The Nubs of Technology Speed, cost, and convenience while maintaining high standards of quality and satisfaction.","sourceCategory":"Design, software, and systems","category":"Products & systems","also":"Creativity, taste, and craft","source":"https://substack.com/@mattlane/note/c-138867850","body":"Speed, cost, and convenience while maintaining high standards of quality and satisfaction.","discussion":"","replyCount":0,"excerpt":"Speed, cost, and convenience while maintaining high standards of quality and satisfaction.","words":12},{"id":"131254195","date":"2025-07-02","title":"The present on your watch is represented by a hairline that is as thin as possible as is consistent with…","summary":"The present on your watch is represented by a hairline that is as thin as possible as is consistent with visibility. But","sourceCategory":"Life, identity, and personal practice","category":"Life & learning","also":"Product strategy and development","source":"https://substack.com/@mattlane/note/c-131254195","body":"The present on your watch is represented by a hairline that is as thin as possible as is consistent with visibility. \n\nBut the future does not change into the past, where everything is a result of the past.\n\nThe past is caused by the present.\n\nNow. The present. It’s not counted in seconds. It drones.","discussion":"","replyCount":0,"excerpt":"The present on your watch is represented by a hairline that is as thin as possible as is consistent with visibility. But the future does not change into the past, where everything is a result of the past. The past is caused by the present. Now. The present. It’s not counted in seconds. It drones.","words":55},{"id":"130621438","date":"2025-06-30","title":"As You Go","summary":"As You Go If you can plan a year out, you can also steer month to month. When you feel sure about twelve months, you can","sourceCategory":"Judgment, decisions, and problem-solving","category":"Judgment & knowledge","also":"Writing, language, and communication","source":"https://substack.com/@mattlane/note/c-130621438","body":"If you can plan a year out, you can also steer month to month. When you feel sure about twelve months, you can adapt week by week. By late June, you know more about July than you did in February. Decide closer to the moment. What’s so magical about mapping the whole year? Because conditions change and information improves, a decision taken near the action is likelier to be right than one made a year in advance. Certainty is not about horizon—it’s about relevance.\n\nPlan this month, finish it, then plan the next. Craving certainty? Short horizons deliver more of it; long projections miss. Make more short-term calls and you’ll probably make better ones, because the information is fresh.\n\nNow, someone might say, “What about go-to-market timing, or giving the marketing team three months’ notice? My CEO needs to know exactly what we’re building next year so we can hire.” I hear that. But I don’t need a tale about next year—that would be fiction. Let’s figure it out as we go; we’ll likely end up in a better place.\n\nSome businesses do need long lead times: building a factory, designing an airplane, buying a Super Bowl spot, reserving a trade-show booth. Those dates lock you in. I’m not denying that. But treating every decision as if foretelling the future equals certainty doesn’t add up. A prediction isn’t certainty; it’s a guess.\n\nYou might argue, “If we define the destination a year out, we’ll get there.” Maybe. But we’ll land more accurately if we adjust en route. Sometimes we’ll make the same calls; other times we’ll choose better ones. In most cases, planning a year ahead buys little. Maybe you don’t need to know—you just want the sensation of knowing. Why is “figuring it out as we go” so frightening? That’s how life works for most of us anyway.\n\nOld ideas don’t get seniority. They’re records of what we thought then, not what we should do now, especially as contexts change. I’d rather work from “here’s what we think now.” Every few weeks, we decide from scratch what’s worth doing next. Old ideas are fair game—if they’re as good as today’s. Prior notes don’t get priority.\n\nSell what exists today—not what it might become. Don’t placate or promise. Roll with it and learn from real, not imagined, usage. Don’t put yourself on the hook for what we once thought. Focus on what we think will matter as we go. If old ideas end up being good ideas, we’ll do them anyway.\n\nWe’ll decide along the way. We’ll decide differently near execution. So why forecast now?","discussion":"I’ve never liked roadmaps. Even though they’re meant to chart new things later, they feel like looking backward—a record of what we thought then. I prefer working from “here’s what we think now.” Every
