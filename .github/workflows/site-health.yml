name: Site health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and render draft content before checks
        run: |
          python scripts/validate_notes.py
          python scripts/generate_note_pages.py
          python scripts/check_site.py
      - name: Compile site generation scripts
        run: python -m py_compile scripts/generate_note_pages.py scripts/browser_smoke.py

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Render candidate Notes and sitemap before browser tests
        run: |
          python scripts/validate_notes.py
          python scripts/generate_note_pages.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test desktop and phone rendering in Chromium
        run: python scripts/browser_smoke.py
