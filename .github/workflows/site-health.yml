name: Site health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check site structure, links, and safety basics
        run: python scripts/check_site.py

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture static homepage previews
        run: python scripts/capture_previews.py
      - name: Test desktop and phone rendering in Chromium
        run: python scripts/browser_smoke.py
      - name: Upload preview captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview-captures
          path: preview-captures/*.png
          if-no-files-found: error
