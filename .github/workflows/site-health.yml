name: Site health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prevent email and credential disclosure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/test_privacy.py
          python scripts/check_privacy.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Install Notes Markdown dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-notes.txt
      - name: Validate and render draft content before checks
        run: |
          python scripts/validate_notes.py
          python scripts/test_note_rendering.py
          python scripts/test_article_rendering.py
          python scripts/generate_note_pages.py
          python scripts/check_site_consistency.py
          python scripts/check_site.py
      - name: Compile site generation scripts
        run: python -m py_compile scripts/generate_note_pages.py scripts/browser_smoke.py

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Notes Markdown dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-notes.txt
      - name: Render candidate Notes and sitemap before browser tests
        run: |
          python scripts/validate_notes.py
          python scripts/test_note_rendering.py
          python scripts/test_article_rendering.py
          python scripts/generate_note_pages.py
          python scripts/check_site_consistency.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          # Ubuntu GitHub-hosted runners already include Chromium runtime libraries.
          # Avoid apt downloads, which can stall and time out the browser check.
          python -m playwright install chromium
      - name: Test desktop and phone rendering in Chromium
        run: python scripts/browser_smoke.py
