name: Capture Shaping Board tile image
on:
  push:
    branches:
      - add-shaping-board-preview-20261016
    paths:
      - .github/workflows/capture-board-tile-preview.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out canonical Shaping Board
        run: git clone --depth 1 https://github.com/mattlane66/planning-skills-for-agents-and-humans.git /tmp/planning-skills
      - name: Capture the real Shaping Board interface
        run: node /tmp/planning-skills/scripts/capture-shaping-board-preview.mjs "$GITHUB_WORKSPACE/assets/shaping-board-preview.png"
      - name: Optimize preview for portfolio tile
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          p=Path('assets/shaping-board-preview.png')
          image=Image.open(p).convert('RGB')
          print('Captured dimensions:', image.size)
          image=ImageOps.fit(image, (1280, 800), method=Image.Resampling.LANCZOS, centering=(0.5,0.05))
          image.save('assets/shaping-board-preview.webp', 'WEBP', quality=85, method=6)
          p.unlink()
          print('Optimized tile bytes:', Path('assets/shaping-board-preview.webp').stat().st_size)
          PY
      - name: Commit captured preview on this draft branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shaping-board-preview.webp
          git diff --cached --quiet && exit 0
          git commit -m "Capture real Shaping Board preview for portfolio tile"
          git fetch origin add-shaping-board-preview-20261016
          git rebase origin/add-shaping-board-preview-20261016
          git push origin HEAD:add-shaping-board-preview-20261016
