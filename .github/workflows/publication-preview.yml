name: Publication preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Same-repository pull requests only: the workflow runs repository scripts.
# Untrusted fork PRs must never receive a token capable of writing content.
permissions:
  contents: write

concurrency:
  group: publication-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Notes Markdown dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-notes.txt
      - name: Validate and render draft content without publishing
        run: |
          python scripts/validate_notes.py
          python scripts/test_note_rendering.py
          python scripts/test_article_rendering.py
          python scripts/generate_note_pages.py
          python scripts/check_site_consistency.py
          python scripts/check_site.py
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture real HTML desktop and phone previews
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/preview_content.py --base "$BASE_SHA"
          python scripts/browser_smoke.py
      - name: Commit generated static pages to the review branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html notes/index.html notes/n sitemap.xml planning-tools/index.html
          if git diff --cached --quiet; then
            echo "Draft pages already match their source."
          else
            git commit -m "Build draft static site for publication review"
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi
      - name: Attach unpublished review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-preview-${{ github.run_id }}
          path: publication-preview/
          if-no-files-found: warn
          retention-days: 14
