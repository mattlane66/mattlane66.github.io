name: Publication preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate and render the draft (never deploy)
        run: |
          python scripts/validate_notes.py
          python scripts/generate_note_pages.py
          python scripts/check_site.py
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture desktop and phone preview
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/preview_content.py --base "$BASE_SHA"
      - name: Attach unpublished preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-preview-${{ github.run_id }}
          path: publication-preview/
          if-no-files-found: warn
          retention-days: 14
