name: Assemble LCC lossless recording
on:
  push:
    branches: [spatial-audio-fidelity-presets-20261115]
    paths:
      - '.github/workflows/assemble-lcc-lossless.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reassemble and verify bit-perfect FLAC
        shell: bash
        run: |
          set -euo pipefail
          cat spatial-audio/audio/gravity.part0 spatial-audio/audio/gravity.part1 > spatial-audio/audio/gravity.flac
          echo "e2f83abef190a989c13a07ed0a70b53bc65dc82d635c5a075c7f55c056d3fae9  spatial-audio/audio/gravity.flac" | sha256sum --check -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spatial-audio/audio/gravity.flac
          git rm spatial-audio/audio/gravity.part0 spatial-audio/audio/gravity.part1
          git commit -m "Assemble verified lossless Gravity recording"
          git push
