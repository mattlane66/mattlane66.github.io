name: Upscale working-form hero
on:
  push:
    paths:
      - ".github/workflows/upscale-working-form.yml"
jobs:
  upscale:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upscale and sharpen hero
        run: |
          ffmpeg -y -i assets/working-form-flow.jpg             -vf "scale=iw*2:ih*2:flags=lanczos,unsharp=5:5:1.15:5:5:0.0"             -q:v 2 assets/working-form-flow-upscaled.jpg
          file assets/working-form-flow-upscaled.jpg
          ls -lh assets/working-form-flow-upscaled.jpg
      - name: Point homepage at upscaled asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          s=s.replace("./assets/working-form-flow.jpg?v=20260929c","./assets/working-form-flow-upscaled.jpg?v=20260929d")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/working-form-flow-upscaled.jpg index.html
          git commit -m "Upscale and sharpen homepage working-form visual"
          git pull --rebase origin main
          git push
