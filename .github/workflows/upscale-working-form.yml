name: Upscale working-form hero
on:
  push:
    paths:
      - ".github/workflows/upscale-working-form.yml"
jobs:
  upscale:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upscale and sharpen hero
        run: |
          if command -v magick >/dev/null 2>&1; then
            magick assets/working-form-flow.jpg -filter Lanczos -resize 200% -unsharp 0x1.1+1.2+0.02 -quality 96 assets/working-form-flow-upscaled.jpg
          elif command -v convert >/dev/null 2>&1; then
            convert assets/working-form-flow.jpg -filter Lanczos -resize 200% -unsharp 0x1.1+1.2+0.02 -quality 96 assets/working-form-flow-upscaled.jpg
          else
            echo "ImageMagick is unavailable" >&2
            exit 1
          fi
          file assets/working-form-flow-upscaled.jpg
          ls -lh assets/working-form-flow-upscaled.jpg
      - name: Point homepage at upscaled asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          s=s.replace("./assets/working-form-flow.jpg?v=20260929c","./assets/working-form-flow-upscaled.jpg?v=20260929d")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/working-form-flow-upscaled.jpg index.html
          git commit -m "Upscale and sharpen homepage working-form visual"
          git pull --rebase origin main
          git push
