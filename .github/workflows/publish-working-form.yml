name: Publish working-form hero asset
on:
  push:
    paths:
      - ".github/workflows/publish-working-form.yml"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode hero asset
        run: |
          mkdir -p assets
          cat > /tmp/hero.b64 <<'EOF'
[...]

EOF
          base64 -d /tmp/hero.b64 > assets/working-form-flow.jpg
          file assets/working-form-flow.jpg
          ls -lh assets/working-form-flow.jpg
      - name: Commit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/working-form-flow.jpg
          git commit -m "Add Safari-safe working-form hero asset"
          git pull --rebase origin main
          git push
