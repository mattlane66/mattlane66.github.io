name: Publish working-form hero asset
on:
  push:
    paths:
      - ".github/workflows/publish-working-form.yml"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode hero asset
        shell: python
        run: |
          import base64
          from pathlib import Path
          data = (
            ""
            ""
            ""
            ""
            ""
          )
          raw = base64.b64decode(data, validate=True)
          assert raw[:2] == b"\xff\xd8" and raw[-2:] == b"\xff\xd9"
          Path("assets").mkdir(exist_ok=True)
          Path("assets/working-form-flow.jpg").write_bytes(raw)
          print(len(raw))
      - name: Commit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/working-form-flow.jpg
          git commit -m "Add working-form hero image"
          git pull --rebase origin main
          git push
