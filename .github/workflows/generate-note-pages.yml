name: Check generated Note pages

on:
  push:
    branches: [main]
    paths:
      - "notes/index.html"
      - "notes/direct-notes.json"
      - "notes/removed-note-ids.json"
      - "notes/n/**"
      - "scripts/generate_note_pages.py"
      - ".github/workflows/generate-note-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-note-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Notes Markdown dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-notes.txt
      - name: Rebuild generated Note pages
        run: |
          python scripts/validate_notes.py
          python scripts/test_note_rendering.py
          python scripts/test_article_rendering.py
          python scripts/generate_note_pages.py
          python scripts/check_site.py
      - name: Confirm the published commit contains all generated output
        run: |
          git diff --exit-code -- notes/index.html notes/n sitemap.xml planning-tools/index.html || {
            echo "::error::Generated pages differ from the merged commit. Publish only a reviewed PR containing generated output."
            exit 1
          }
