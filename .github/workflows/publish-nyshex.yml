name: Publish NYSHEX case
on:
  push:
    paths:
      - ".github/workflows/publish-nyshex.yml"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write NYSHEX case study
        shell: bash
        run: |
          mkdir -p nyshex
          printf '%s' '' | base64 -d | gunzip > nyshex/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nyshex/index.html
          git commit -m "Add NYSHEX case study"
          git push
