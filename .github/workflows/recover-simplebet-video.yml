name: Recover SimpleBet video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-simplebet-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n1

      - name: Recover highest-quality public MP4 stream
        env:
          VIDEO_TEMPLATE: "https://vod-adaptive-ak.vimeocdn.com/exp=1790648075~acl=%2F1e07433a-c1b1-40c1-a782-ddad7bd9256b%2Fpsid%3D1074c4d7c12e71a47b56b94040948879bd1e948e1790644475%2F%2A~hmac=ecd289b306f3b80082f26ed2738baef6428ff40f065472ee3f4f21898719f5c7/1e07433a-c1b1-40c1-a782-ddad7bd9256b/psid=1074c4d7c12e71a47b56b94040948879bd1e948e1790644475/v2/remux/avf/9208d68a-4590-484c-8cb7-51628eaab871/segment.m4s?pathsig=8c953e4f~lSAS4mJQtxKdTC2AQ3CWe1daqlu2URaTySSh1vWn1QA&r=dXMtZWFzdDE%3D&sid=2&st=video"
          AUDIO_TEMPLATE: "https://vod-adaptive-ak.vimeocdn.com/exp=1790648075~acl=%2F1e07433a-c1b1-40c1-a782-ddad7bd9256b%2Fpsid%3D1074c4d7c12e71a47b56b94040948879bd1e948e1790644475%2F%2A~hmac=ecd289b306f3b80082f26ed2738baef6428ff40f065472ee3f4f21898719f5c7/1e07433a-c1b1-40c1-a782-ddad7bd9256b/psid=1074c4d7c12e71a47b56b94040948879bd1e948e1790644475/v2/remux/avf/8f5184af-47d9-4744-894f-8dbbbd5b6145/segment.m4s?pathsig=8c953e4f~TW9ZwmTpaXDcSfian9l7_nv-_gBBJuHxqPZqwb-k81k&r=dXMtY2VudHJhbDE%3D&sid=1&st=audio"
        run: |
          set -euxo pipefail
          mkdir -p recovered

          python - <<'PY'
          import os,re,subprocess
          from pathlib import Path

          templates={"video":os.environ["VIDEO_TEMPLATE"],"audio":os.environ["AUDIO_TEMPLATE"]}

          for kind,template in templates.items():
              misses=0
              successes=0
              # Known public playback already exposed sids 1-8. Walk forward until the stream ends.
              for sid in range(0,401):
                  url=re.sub(r"([?&]sid=)\d+",rf"\g<1>{sid}",template)
                  url=re.sub(r"([?&]st=)(video|audio)",rf"\g<1>{kind}",url)
                  out=Path("recovered")/f"{kind}-{sid:04d}.m4s"
                  cp=subprocess.run(
                      ["curl","-fsSL","--retry","1","--connect-timeout","8","--max-time","20","-o",str(out),url],
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL
                  )
                  if cp.returncode==0 and out.exists() and out.stat().st_size>0:
                      print("OK",kind,sid,out.stat().st_size,flush=True)
                      successes+=1
                      misses=0
                  else:
                      out.unlink(missing_ok=True)
                      print("MISS",kind,sid,flush=True)
                      if sid>=8:
                          misses+=1
                          if misses>=3:
                              break
              if successes<8:
                  raise SystemExit(f"Only recovered {successes} {kind} segments")
          PY

          ls -lh recovered | head -50
          echo "Video fragment header:"
          xxd -l 128 "$(find recovered -name 'video-*.m4s' | sort | head -n1)"
          echo "Audio fragment header:"
          xxd -l 128 "$(find recovered -name 'audio-*.m4s' | sort | head -n1)"

          python - <<'PY'
          from pathlib import Path
          for kind in ("video","audio"):
              fs=sorted(Path("recovered").glob(f"{kind}-*.m4s"))
              # If sid 0 is a valid init/first segment it naturally comes first.
              with open(f"{kind}-joined.m4s","wb") as out:
                  for p in fs: out.write(p.read_bytes())
              with open(f"{kind}-list.txt","w") as out:
                  for p in fs: out.write(f"file '{p.resolve()}'\n")
              print(kind,len(fs),"segments",sum(p.stat().st_size for p in fs))
          PY

          ffprobe -v error -show_entries stream=index,codec_name,codec_type,width,height -show_entries format=duration,size -of json video-joined.m4s || true
          ffprobe -v error -show_entries stream=index,codec_name,codec_type,width,height -show_entries format=duration,size -of json audio-joined.m4s || true

          if ffmpeg -y -i video-joined.m4s -i audio-joined.m4s -map 0:v:0 -map 1:a:0 -c copy -movflags +faststart simplebet-410327242.mp4; then
            echo "Merged fragmented streams directly."
          else
            ffmpeg -y -f concat -safe 0 -i video-list.txt -c copy video-track.mp4
            ffmpeg -y -f concat -safe 0 -i audio-list.txt -c copy audio-track.m4a
            ffmpeg -y -i video-track.mp4 -i audio-track.m4a -map 0:v:0 -map 1:a:0 -c copy -movflags +faststart simplebet-410327242.mp4
          fi

          ls -lh simplebet-410327242.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate,bit_rate -of json simplebet-410327242.mp4

      - name: Preserve as a durable GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="simplebet-media-v1"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SimpleBet portfolio media" \
              --notes "Recovered from the still-public Vimeo presentation stream for portfolio preservation."
          gh release upload "$TAG" simplebet-410327242.mp4 --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets

      - name: Keep a workflow artifact backup too
        uses: actions/upload-artifact@v4
        with:
          name: simplebet-410327242
          path: simplebet-410327242.mp4
          retention-days: 90
