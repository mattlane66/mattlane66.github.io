name: Refresh SEO artifacts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate SEO artifacts
        run: python scripts/apply_seo.py
      - name: Remove one-time workflow
        run: rm .github/workflows/refresh-seo.yml
      - name: Commit regenerated SEO files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh site-native SEO artifacts"
          git push
